services:
  pulse:
    image: rcourtman/pulse:6.4.1
    container_name: pulse
    environment:
      TZ: America/Los_Angeles
      PULSE_DEPLOYMENT_METHOD: docker_compose
    volumes:
      - /srv/ssd/docker/data/pulse:/data
    ports:
      - "192.168.8.100:7655:7655"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7655/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  backend:
    external: true
