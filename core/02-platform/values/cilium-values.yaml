# =========================
# CORE
# =========================

kubeProxyReplacement: true

ipam:
  mode: kubernetes

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# =========================
# PLATFORM FEATURES
# =========================

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

envoy:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Envoy serves its metrics already; this only asks for them. Whole, it was
  # 7,237 series per node - a hundred statistics for each Gateway backend,
  # half of them histogram buckets. Kept: requests and their response
  # classes, timeouts, latency as sum and count, connections, backend health
  # and the server's own - about 300 per node.
  prometheus:
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__]
          regex: "envoy_(cluster_upstream_rq_(xx|total|timeout)|cluster_upstream_rq_time_(sum|count)|cluster_upstream_cx_(active|connect_fail)|cluster_membership_(healthy|total)|http_downstream_rq_(xx|total)|http_downstream_cx_active|listener_downstream_cx_active|server_.*)"

# =========================
# LOAD BALANCER
# =========================

l2announcements:
  enabled: true

# Talos exposes the LAN through this bridge, so auto-detection has no physical
# default route to select for direct routing.
devices: br0

nodePort:
  directRoutingDevice: br0

# With iptables masquerading, replies from a local NodePort or LoadBalancer
# backend are masqueraded before BPF can restore the service port, so clients
# receive data from the pod's port and reset the connection.
bpf:
  masquerade: true

operator:
  replicas: 1
  # Its metrics are served by default; the monitor is what was missing.
  prometheus:
    serviceMonitor:
      enabled: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  # Its leader election cannot be switched off, only slowed: a 60 s lease and
  # 40 s to renew it ride out the etcd stalls of a node short of memory, which
  # made it exit on the defaults (15 s, 10 s) in the stress test of
  # 2026-09-29. With one replica nobody waits for the lease.
  extraArgs:
    - --leader-election-lease-duration=60s
    - --leader-election-renew-deadline=40s
    - --leader-election-retry-period=5s

# =========================
# METRICS
# =========================

# The agent's own metrics - endpoints, policy drops, BPF map pressure - off
# in the chart by default.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

# =========================
# RESOURCES
# =========================

# The chart sets no resources, which made every Cilium pod BestEffort - the
# first thing Talos's OOM controller kills when the node runs short of memory.
# On 2026-09-26 an Immich import did exactly that to Envoy and the operator,
# 35 kills in five minutes, and every Gateway route went down. Requests
# guarantee a CPU share under contention; there is no CPU limit, which would
# throttle the network. Memory limits sit far above use only so that every
# container - init containers too - has one: that controller scores such a
# pod zero and never picks it. The envoy and operator settings sit with their
# own sections above. See traps.yaml.
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
initResources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 512Mi}
