apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core/03-gitops/apps/services/gatus/app
  prune: true
  # The history claim is on lvm-worker-1; the scrape is a VictoriaMetrics
  # object, whose CRD the observability stack brings.
  dependsOn:
  - name: openebs-classes
  - name: observability
