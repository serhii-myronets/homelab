# One path per account. The targets are the Services kmcp makes for each
# MCPServer.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: webull-prod
spec:
  mcp:
    targets:
      - name: webull
        static:
          backendRef: {name: webull-mcp-prod}
          port: 3000
          protocol: StreamableHTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: webull-sandbox
spec:
  mcp:
    targets:
      - name: webull
        static:
          backendRef: {name: webull-mcp}
          port: 3000
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webull-prod
spec:
  parentRefs:
    - name: mcp
  rules:
    - matches:
        - path: {type: PathPrefix, value: /prod}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: webull-prod}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webull-sandbox
spec:
  parentRefs:
    - name: mcp
  rules:
    - matches:
        - path: {type: PathPrefix, value: /sandbox}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: webull-sandbox}
