# The access token from `webull-openapi-mcp auth` (valid 15 days, renewed on
# use) and uv's package cache. Losing it costs one re-authentication and one
# download, so it is not backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: lvm
  resources:
    requests:
      storage: 1Gi
