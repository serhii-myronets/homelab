# Whoever reaches port 3000 can use these keys, and whoever runs code in a pod
# can send them anywhere. Both directions are closed to all but what each
# server needs: its own Webull environment, DNS, and PyPI for uvx.
#
# Only the `mcp` Gateway's proxy may reach port 3000, so its key check and
# tool filter cannot be walked around - not even with a port-forward, which
# arrives from the node.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webull-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webull-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        # The US sandbox, from UAT_ENDPOINTS in the server's sdk_client.py.
        - matchName: api.sandbox.webull.com
        - matchName: events-api.sandbox.webull.com
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webull-mcp-prod
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webull-mcp-prod
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: mcp
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        # US production, from endpoints.json in webull-openapi-python-sdk.
        - matchName: api.webull.com
        - matchName: data-api.webull.com
        - matchName: events-api.webull.com
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
