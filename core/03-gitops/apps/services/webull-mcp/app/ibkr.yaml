# IBKR's own hosted MCP server, behind the same Gateway, key and tool filter
# as Webull: https://mcp.home/ibkr. The account's OAuth token never reaches a
# client; the gateway adds it on the way out.
#
# ibkr-oauth holds the client_id and refresh token, written once by
# ../ibkr-login.py with scope mcp.read only - so IBKR itself refuses orders
# whatever the filter lets through. ibkr-token holds the access token, which
# lives ten minutes; the CronJob below renews it every five. Neither Secret is
# in git, so a lost refresh token means running ibkr-login.py again.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ibkr
spec:
  mcp:
    targets:
      - name: ibkr
        static:
          host: api.ibkr.com
          port: 443
          path: /v1/api/mcp-public
          protocol: StreamableHTTP
  policies:
    tls:
      sni: api.ibkr.com
    # Replaces the client's `Authorization` (the gateway key) with the token.
    auth:
      secretRef:
        name: ibkr-token
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ibkr
spec:
  parentRefs:
    - name: mcp
  rules:
    - matches:
        - path: {type: PathPrefix, value: /ibkr}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: ibkr}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ibkr-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ibkr-token
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ibkr-oauth, ibkr-token]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ibkr-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ibkr-token
subjects:
  - kind: ServiceAccount
    name: ibkr-token
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ibkr-token
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ibkr-token
        spec:
          serviceAccountName: ibkr-token
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              # The image the Webull servers run, already on the nodes.
              image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
              command: [python3, /script/ibkr-refresh.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              volumeMounts:
                - {name: script, mountPath: /script}
          volumes:
            - name: script
              configMap:
                name: ibkr-refresh
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ibkr-token
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ibkr-token
  ingress: []
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        - matchName: api.ibkr.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
