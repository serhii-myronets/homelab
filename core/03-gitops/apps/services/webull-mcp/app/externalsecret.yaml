# Keys for Webull's sandbox (UAT) from developer.webull.com. kmcp hands every
# key of this Secret to the server as an environment variable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webull-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: webull-mcp
  data:
    - {secretKey: WEBULL_APP_KEY, remoteRef: {key: /services/webull-mcp/WEBULL_APP_KEY}}
    - {secretKey: WEBULL_APP_SECRET, remoteRef: {key: /services/webull-mcp/WEBULL_APP_SECRET}}
