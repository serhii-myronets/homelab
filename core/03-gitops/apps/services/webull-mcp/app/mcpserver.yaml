# Webull's own MCP server (github.com/webull-inc/webull-openapi-mcp), against
# the sandbox. It speaks only stdio, so kmcp puts agentgateway in front of it:
# MCP over HTTP at webull-mcp.webull-mcp:3000/mcp, one server process per
# session.
#
# Reached through https://mcp.home/sandbox (gateway.yaml), never directly.
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: webull-mcp
spec:
  transportType: stdio
  # The first session of a pod downloads the package before it answers.
  timeout: 60s
  deployment:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    cmd: uvx
    # Pinned: uvx resolves the package at every session start, and an
    # unpinned name would run whatever was published last with these keys.
    args: ["webull-openapi-mcp==1.2.6", "serve"]
    port: 3000
    secretRefs:
      - name: webull-mcp
    env:
      WEBULL_ENVIRONMENT: uat
      WEBULL_REGION_ID: us
      WEBULL_TOKEN_DIR: /data/conf
      # Read-only for now: without `trading` the server registers no tool that
      # places, changes or cancels an order - nor the ones that list orders.
      # `market-data` still writes watchlists and community posts.
      WEBULL_TOOLSETS: account,market-data,instrument
      # The server's own guards, checked before an order leaves the pod.
      WEBULL_MAX_ORDER_NOTIONAL_USD: "1000"
      WEBULL_MAX_ORDER_QUANTITY: "10"
      WEBULL_AUDIT_LOG_FILE: /data/audit.log
      UV_CACHE_DIR: /data/uv-cache
      UV_PYTHON_DOWNLOADS: never
      HOME: /data
    # Not a claim: kmcp's Deployment rolls out new pod first, and the LVM
    # driver will not mount one volume into two pods (traps.yaml,
    # openebs-lvm-mounts-a-volume-into-one-pod-only), so every change would
    # hang. The sandbox needs no token, and the cache and audit log are lost
    # with the pod. Prod's 15-day token will need somewhere else to live.
    volumes:
      - name: data
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 20m, memory: 128Mi}
      limits: {memory: 512Mi}
