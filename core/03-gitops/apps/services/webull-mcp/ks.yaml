apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webull-mcp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core/03-gitops/apps/services/webull-mcp/app
  prune: true
  dependsOn:
    - name: kmcp
