# The API and the web interface. Everything it keeps that matters is either
# in Postgres or under /data on the media disk, so this pod holds no state of
# its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  annotations:
    # Restarted when a Secret or ConfigMap it reads changes (reloader.yaml).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        # Kubelet creates a missing subPath directory owned by root, and the
        # server writes as the user the image runs as.
        - name: prepare
          image: busybox:1.38
          command: [sh, -c, "mkdir -p /data && chown 1000:1000 /data"]
          # Equal to its limits, so the pod stays Guaranteed; see below.
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: hdd-a, mountPath: /data, subPath: photos}
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.2.4
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: DB_HOSTNAME, value: postgres}
            - {name: DB_USERNAME, value: postgres}
            - {name: DB_DATABASE_NAME, value: immich}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: immich-db, key: DB_PASSWORD}
            - {name: REDIS_HOSTNAME, value: valkey}
            - {name: IMMICH_MACHINE_LEARNING_URL, value: "http://machine-learning:3003"}
          ports:
            - {name: http, containerPort: 2283}
          startupProbe:
            httpGet: {path: /api/server/ping, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/server/ping, port: http}
            timeoutSeconds: 5
          # Six misses thirty seconds apart before a restart. On one core
          # during an import it answers late but has not hung, and a restart
          # throws away every job in flight.
          livenessProbe:
            httpGet: {path: /api/server/ping, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          # Every container here, the init one included, has a memory limit, so
          # the pod cgroup has memory.max and Talos's OOM controller scores it
          # zero - it is never chosen while any pod without a limit is left.
          # Before the init container had one, this was the victim every time;
          # see traps.yaml. The CPU ceiling keeps an import's thumbnails and
          # transcodes from taking every core; a throttled pod answers slowly,
          # hence the probe timeouts above. The iGPU slot is for QSV
          # transcoding, chosen under Administration, Video Transcoding.
          #
          # Memory: 3Gi reserved, 4Gi allowed. At 2.5Gi, then at 3Gi, the
          # kernel killed it inside its own limit during imports - through the
          # night of 2026-09-30 it held 2.2-2.7Gi with job concurrency already
          # at one or two, and a single large video or image pushed it over,
          # three times. The ceiling above the request is for those peaks
          # without reserving a further gigabyte on controlplane; if the node
          # runs short, Talos takes machine learning, never this.
          resources:
            requests: {cpu: "1", memory: 3Gi, gpu.intel.com/i915: "1"}
            limits: {cpu: "1", memory: 4Gi, gpu.intel.com/i915: "1"}
          volumeMounts:
            # Upstream calls this UPLOAD_LOCATION and mounts it at /data:
            # originals, thumbnails and encoded video all live under it.
            - {name: hdd-a, mountPath: /data, subPath: photos}
      volumes:
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - {name: http, port: 2283, targetPort: http}
