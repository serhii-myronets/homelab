# The widgets' API keys, under /homepage in Infisical, copied there from each
# application's own configuration. Homepage reads HOMEPAGE_VAR_* into the
# {{HOMEPAGE_VAR_...}} placeholders of services.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: homepage-keys
  data:
    - {secretKey: HOMEPAGE_VAR_SONARR_KEY, remoteRef: {key: /homepage/SONARR_API_KEY}}
    - {secretKey: HOMEPAGE_VAR_RADARR_KEY, remoteRef: {key: /homepage/RADARR_API_KEY}}
    - {secretKey: HOMEPAGE_VAR_PROWLARR_KEY, remoteRef: {key: /homepage/PROWLARR_API_KEY}}
    - {secretKey: HOMEPAGE_VAR_SEERR_KEY, remoteRef: {key: /homepage/SEERR_API_KEY}}
---
# home-ca's certificate alone, never its key, so the site monitors verify
# https://*.home rather than skip the check.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-ca-root
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: home-ca-root
  data:
    - secretKey: home-ca.crt
      remoteRef: {key: /home-ca/TLS_CRT}
