# Every card. href is what a person opens; siteMonitor checks that same
# address through the Gateway, with home-ca trusted; namespace and
# podSelector tie a card to its pods for their state and load; widget is the
# live numbers, read inside the cluster.

- Photos & media:
    - Immich:
        href: https://immich.home
        description: Photos and videos
        icon: immich.png
        siteMonitor: https://immich.home/api/server/ping
        namespace: immich
        app: server
        podSelector: app=server
        widget:
          type: immich
          version: 2
          url: http://server.immich.svc.cluster.local:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          fields: [photos, videos, storage]
    - Jellyfin:
        href: https://jellyfin.home
        description: Films and series
        icon: jellyfin.png
        siteMonitor: https://jellyfin.home/health
        namespace: jellyfin
        app: jellyfin
        podSelector: app=jellyfin
        widget:
          type: jellyfin
          version: 2
          url: http://jellyfin.jellyfin.svc.cluster.local:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          # The library's size, and who is watching what right now.
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          enableMediaControl: false
          showEpisodeNumber: true

- Library:
    - Seerr:
        href: https://seerr.home
        description: Ask for something to watch
        icon: seerr.png
        siteMonitor: https://seerr.home/api/v1/status
        widget:
          type: seerr
          url: http://seerr.library.svc.cluster.local:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          fields: [pending, approved, available]
    - Sonarr:
        href: https://sonarr.home
        description: Series
        icon: sonarr.png
        siteMonitor: https://sonarr.home/ping
        widget:
          type: sonarr
          url: http://sonarr.library.svc.cluster.local:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          fields: [wanted, queued, series]
    - Radarr:
        href: https://radarr.home
        description: Films
        icon: radarr.png
        siteMonitor: https://radarr.home/ping
        widget:
          type: radarr
          url: http://radarr.library.svc.cluster.local:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          fields: [wanted, queued, movies]
    - Prowlarr:
        href: https://prowlarr.home
        description: Indexers
        icon: prowlarr.png
        siteMonitor: https://prowlarr.home/ping
        widget:
          type: prowlarr
          url: http://prowlarr.library.svc.cluster.local:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
          fields: [numberOfGrabs, numberOfQueries, numberOfFailGrabs]

- Coming up:
    - Next to arrive:
        description: Episodes and films due, from Sonarr and Radarr
        icon: mdi-calendar-star
        widget:
          type: calendar
          view: agenda
          maxEvents: 8
          previousDays: 1
          showTime: true
          integrations:
            - {type: sonarr, service_group: Library, service_name: Sonarr, baseUrl: "https://sonarr.home"}
            - {type: radarr, service_group: Library, service_name: Radarr, baseUrl: "https://radarr.home"}
    - qBittorrent:
        href: https://torrent.home
        description: Downloads, through NordVPN
        icon: qbittorrent.png
        siteMonitor: https://torrent.home/
        namespace: torrent
        app: torrent
        podSelector: app=torrent
        # No credentials: qBittorrent admits the pod network without a
        # password (AuthSubnetWhitelist in its qBittorrent.conf).
        widget:
          type: qbittorrent
          url: http://torrent-web.torrent.svc.cluster.local:8080
          enableLeechProgress: true

- Health:
    # Straight from VictoriaMetrics, which keeps every number here already.
    - Disks:
        href: https://grafana.home
        description: The HDDs, the fullest volume, controlplane's swap
        icon: mdi-harddisk
        widget:
          type: prometheusmetric
          url: http://vmsingle-vm.observability.svc.cluster.local:8428
          refreshInterval: 60000
          metrics:
            - label: Photos disk free
              query: node_filesystem_avail_bytes{mountpoint="/var/mnt/hdd-a"}
              format: {type: bytes}
            - label: Second disk free
              query: node_filesystem_avail_bytes{mountpoint="/var/mnt/hdd-b"}
              format: {type: bytes}
            - label: Fullest volume
              query: max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100
              format: {type: number, suffix: "%", options: {maximumFractionDigits: 0}}
            - label: Swap in use
              query: node_memory_SwapTotal_bytes{instance="192.168.8.10:9100"} - node_memory_SwapFree_bytes{instance="192.168.8.10:9100"}
              format: {type: bytes}
    - Backups:
        href: https://grafana.home
        description: Hourly to R2 for every service, nightly for etcd
        icon: mdi-backup-restore
        widget:
          type: prometheusmetric
          url: http://vmsingle-vm.observability.svc.cluster.local:8428
          refreshInterval: 60000
          metrics:
            # 1 for a backup that has missed its hour. Backups only - restores
            # are role destination - and only in namespaces that still exist:
            # VolSync keeps reporting an archived service until it restarts.
            - label: Services behind
              query: sum(volsync_volume_out_of_sync{role="source"} and on(obj_namespace) label_replace(kube_namespace_status_phase{phase="Active"} == 1, "obj_namespace", "$1", "namespace", "(.+)")) or vector(0)
              format: {type: number}
            - label: Services backed up
              query: count(volsync_volume_out_of_sync{role="source"} and on(obj_namespace) label_replace(kube_namespace_status_phase{phase="Active"} == 1, "obj_namespace", "$1", "namespace", "(.+)"))
              format: {type: number}
            - label: etcd, hours ago
              query: (time() - max(kube_cronjob_status_last_successful_time{cronjob="etcd-backup"})) / 3600
              format: {type: number, options: {maximumFractionDigits: 1}}
    - Nodes:
        href: https://grafana.home
        description: How warm each machine runs, and how long since a reboot
        icon: mdi-thermometer
        widget:
          type: prometheusmetric
          url: http://vmsingle-vm.observability.svc.cluster.local:8428
          refreshInterval: 60000
          metrics:
            - label: controlplane CPU
              query: max(node_hwmon_temp_celsius{instance="192.168.8.10:9100", chip=~".*coretemp.*"})
              format: {type: number, suffix: " °C", options: {maximumFractionDigits: 0}}
            - label: controlplane NVMe
              query: max(node_hwmon_temp_celsius{instance="192.168.8.10:9100", chip=~".*nvme.*"})
              format: {type: number, suffix: " °C", options: {maximumFractionDigits: 0}}
            - label: worker-1 CPU
              query: max(node_hwmon_temp_celsius{instance="192.168.8.11:9100", chip=~".*coretemp.*"})
              format: {type: number, suffix: " °C", options: {maximumFractionDigits: 0}}
            - label: Up, days
              query: min(node_time_seconds - node_boot_time_seconds) / 86400
              format: {type: number, options: {maximumFractionDigits: 1}}
    - Alerts:
        href: https://grafana.home/alerting/groups
        description: What vmalert has firing - nothing reaches anyone yet
        icon: mdi-bell-alert
        widget:
          type: prometheusmetric
          url: http://vmsingle-vm.observability.svc.cluster.local:8428
          refreshInterval: 60000
          metrics:
            # Watchdog and InfoInhibitor always fire, by design, at severity
            # none; they are left out.
            - label: Critical
              query: count(ALERTS{alertstate="firing", severity="critical"}) or vector(0)
              format: {type: number}
            - label: Warning
              query: count(ALERTS{alertstate="firing", severity="warning"}) or vector(0)
              format: {type: number}

