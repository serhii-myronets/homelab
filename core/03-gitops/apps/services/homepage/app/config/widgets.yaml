# The bar across the top.
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: core
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
- openmeteo:
    label: Beaverton
    latitude: 45.4871
    longitude: -122.8037
    timezone: America/Los_Angeles
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 0
- search:
    provider: duckduckgo
    target: _blank
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
