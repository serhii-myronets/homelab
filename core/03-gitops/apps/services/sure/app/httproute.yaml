# Two names on purpose. Day to day this is sure.home; the public one exists
# because Plaid refuses a redirect it cannot reach over public TLS, and Sure
# builds that redirect from the host the browser is on - so accounts are
# linked from sure.serhii.link and used from either. Cloudflare Access gates
# the public name whole, with no exemption for Plaid's webhook, which means
# updates arrive by the worker polling rather than being pushed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sure
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - sure.home
    - sure.serhii.link
  rules:
    - backendRefs:
        - {name: sure, port: 3000}
