apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    # Restarted when its Cloudflare token changes (reloader.yaml).
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    provider:
      name: cloudflare

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef: {name: cloudflare-api-token, key: CF_API_TOKEN}

    # Records come from HTTPRoutes only. The Gateway carries the tunnel as its
    # target, and only names under serhii.link are published; any other name on
    # the same Gateway stays on the LAN.
    sources:
      - gateway-httproute
    domainFilters:
      - serhii.link
    extraArgs:
      - --cloudflare-proxied

    # Each cluster owns only the records it created: core's, and the lab's
    # as owner lab, are left to each other.
    registry: txt
    txtOwnerId: core
    policy: sync

    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
