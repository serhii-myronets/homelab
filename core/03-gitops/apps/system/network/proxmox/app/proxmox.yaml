# proxmox.home: the Proxmox host's web UI (docs/hosts/proxmox.yaml), behind the
# Gateway for HTTPS with home-ca's certificate and a name without a port.
# Local only - no serhii.link name. The host itself still answers at
# https://192.168.8.30:8006, and ssh goes to that address, not to this name.
#
# Through a pod, as gatus.home is (router/app/gatus.yaml): Cilium's Gateway
# does not route to addresses outside the cluster (traps.yaml,
# cilium-gateway-cannot-reach-outside-the-cluster). Unlike Gatus, the host
# speaks only HTTPS, with its own self-signed certificate: the Gateway hands
# the pod plain HTTP, and socat carries it to the host over TLS again,
# without verifying a certificate nothing here can trust.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxmox-proxy
  template:
    metadata:
      labels:
        app: proxmox-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: socat
          image: alpine/socat:1.8.1.3
          args:
            - TCP-LISTEN:8006,fork,reuseaddr
            - OPENSSL:192.168.8.30:8006,verify=0,connect-timeout=5
          ports:
            - {name: http, containerPort: 8006}
          # Ready only while the host answers, so the Gateway says 503 rather
          # than hanging when it does not.
          readinessProbe:
            exec:
              command: [socat, -u, /dev/null, "TCP:192.168.8.30:8006,connect-timeout=2"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox
spec:
  selector:
    app: proxmox-proxy
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [proxmox.home]
  rules:
    - backendRefs:
        - {name: proxmox, port: 80}
