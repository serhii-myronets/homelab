# A second Gateway API implementation beside Cilium, for MCP: its GatewayClass
# `agentgateway` (made by the controller itself) turns a Gateway into a proxy
# that speaks MCP - filtering tools, checking keys, logging calls. Cilium's
# main-gateway stays the house's entrance; an agentgateway Gateway sits behind
# it on a ClusterIP Service.
#
# Since kgateway 2.3 this controller lives in the agentgateway project, not in
# kgateway, which is now Envoy only.
#
# Built against Gateway API 1.7, which core runs since 2026-11-08.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: agentgateway-system
spec:
  interval: 30m
  chart:
    spec:
      chart: agentgateway-crds
      version: "1.7.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
        namespace: flux-system
  driftDetection:
    mode: enabled
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  interval: 30m
  dependsOn:
    - name: agentgateway-crds
  chart:
    spec:
      chart: agentgateway
      version: "1.7.0"
      sourceRef:
        kind: HelmRepository
        name: agentgateway
        namespace: flux-system
  driftDetection:
    mode: enabled
