# gatus.home: Gatus on the router (router/gatus, decisions/0036), behind the
# Gateway for HTTPS and a name without a port. Local only - no serhii.link
# name, so nothing from the internet reaches the router this way.
#
# It goes down with controlplane, when the status matters most; the router
# answers directly at http://192.168.8.1:8090 regardless.
#
# Through a pod, not a Service whose EndpointSlice names the router: Cilium's
# Gateway does not route to addresses outside the cluster - its Envoy dials
# from the Gateway's own address and the reply never finds it (traps.yaml,
# cilium-gateway-cannot-reach-outside-the-cluster). Plain pods reach the router
# fine. socat rather than nginx: the Gateway already does everything HTTP, so
# this only has to carry bytes, and the router's address is in Git here
# rather than in a hand-written EndpointSlice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus-proxy
  template:
    metadata:
      labels:
        app: gatus-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: socat
          image: alpine/socat:1.8.1.3
          args:
            - TCP-LISTEN:8090,fork,reuseaddr
            - TCP:192.168.8.1:8090,connect-timeout=5
          ports:
            - {name: http, containerPort: 8090}
          # Ready only while the router answers, so the Gateway says 503
          # rather than hanging when it does not.
          readinessProbe:
            exec:
              command: [socat, -u, /dev/null, "TCP:192.168.8.1:8090,connect-timeout=2"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
spec:
  selector:
    app: gatus-proxy
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [gatus.home]
  rules:
    - backendRefs:
        - {name: gatus, port: 80}
