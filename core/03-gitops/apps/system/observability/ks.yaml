# The Prometheus Operator's types, first: every Kustomization that carries a
# ServiceMonitor or a PrometheusRule depends on this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core/03-gitops/apps/system/observability/crds
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core/03-gitops/apps/system/observability/app
  prune: true
  wait: true
  timeout: 15m
  # VMSingle's claims need the lvm-worker-1 class; the router's scrape is a
  # Prometheus Operator kind.
  dependsOn:
  - name: openebs-classes
  - name: prometheus-crds
