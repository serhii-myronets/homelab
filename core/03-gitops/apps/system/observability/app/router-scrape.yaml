# The router's own metrics, from the Lua node exporter router/node-exporter
# installs there: CPU, memory, every interface - eth1 is the WAN - conntrack
# and Wi-Fi clients. A static target, as the router is outside the cluster;
# vmagent reaches it like any pod reaches the LAN.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: router
spec:
  jobName: router
  staticConfigs:
    - targets: ["192.168.8.1:9100"]
      labels:
        node: router
  # The VictoriaMetrics operator does not carry jobName over: the job came
  # out as scrapeConfig/observability/router, and Homepage's router widgets,
  # which ask for job="router", went blank.
  relabelings:
    - targetLabel: job
      replacement: router
