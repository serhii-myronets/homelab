# Traces from outside the cluster, local only: the Appraisal Workbench worker
# runs on the owner's Mac and sends its spans to https://otlp.home/v1/traces,
# through core's Gateway to the collector's OTLP HTTP port, which forwards
# them to Tempo like any pod's (decisions/0050). Only the traces path is
# routed; logs and metrics keep their own ways in.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otlp
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [otlp.home]
  rules:
    - matches:
        - path: {type: Exact, value: /v1/traces}
      backendRefs:
        - {name: otel-collector, port: 4318}
