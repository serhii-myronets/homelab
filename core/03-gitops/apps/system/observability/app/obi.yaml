# OpenTelemetry eBPF Instrumentation: spans and RED metrics for services that
# send none of their own, read from the kernel without touching them. Spans go
# to the collector on the node and on to Tempo; metrics are scraped like any
# other. See decisions/0049.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obi
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: opentelemetry-ebpf-instrumentation
      version: "0.14.3"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  values:
    fullnameOverride: obi
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {memory: 768Mi}
    # The monitor needs the chart's Service in front of the metrics port.
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      metrics: {endpoint: {interval: 30s}}
      internalMetrics: {endpoint: {interval: 30s}}
    config:
      data:
        extensions:
          obi:
            version: "2.0"
            capture:
              # The services only. Left to the chart, it would watch the
              # controllers' every call to the API server, and the
              # observability stack itself - each span Tempo took in would
              # make another.
              policy:
                default_action: exclude
                match_order: first_match_wins
              rules:
                - name: exclude-obi-and-collectors
                  action: exclude
                  match:
                    process:
                      exe_path_glob: ['{*/obi,obi,*otelcol*,*ebpf-instrument*}']
                # Anything sending OTLP already traces itself.
                - name: exclude-otlp-exporters
                  action: exclude
                  match:
                    process:
                      exports_otlp: {port: 4317, protocol: protobuf}
                - name: services
                  action: include
                  match:
                    kubernetes:
                      namespace_glob:
                        - homepage
                        - immich
                        - jellyfin
                        - library
                        - samba
                        - sure
                        - torrent
                        - vaultwarden
        # Through the collector's node-local Service rather than the node's
        # address: the collector opens no host ports.
        tracer_provider:
          processors:
            - batch:
                exporter:
                  otlp_grpc:
                    endpoint: http://otel-collector.observability.svc:4317
                    tls: {insecure: true}
                max_export_batch_size: 4096
                max_queue_size: 16384
                schedule_delay: 15000
        # Scraped, like every other metric here, rather than pushed.
        meter_provider:
          readers:
            - pull:
                exporter:
                  prometheus/development:
                    port: 9090
