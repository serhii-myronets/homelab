# Where the lab's agents write (decisions/0040). The lab's vmagent pushes to
# https://ingest.home, through core's Gateway, to this vmauth; it lets a
# request in only with the lab's token and only on the write path, and
# forwards it to VMSingle. Reads, queries and deletes are refused - the token
# is worth a flood of junk series at worst, never core's data.
#
# The lab's logs have no path here since VictoriaLogs went (decisions/0047):
# they return when the lab's collector writes to Loki's OTLP path.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: ingest
spec:
  userSelector:
    matchLabels: {vmauth: ingest}
  nodeSelector: {kubernetes.io/hostname: worker-1}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
---
# One user per cluster that writes here, so each can be cut off alone.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: lab
  labels: {vmauth: ingest}
spec:
  tokenRef: {name: lab-ingest, key: token}
  targetRefs:
    - crd: {kind: VMSingle, name: vm, namespace: observability}
      paths: ["/api/v1/write"]
---
# The lab holds the same token at /system/observability/INGEST_TOKEN in its
# own Infisical project.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-ingest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: lab-ingest
  data:
    - secretKey: token
      remoteRef: {key: /system/observability/LAB_INGEST_TOKEN}
---
# Local only, as grafana.home: the lab is on the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingest
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [ingest.home]
  rules:
    - backendRefs:
        - {name: vmauth-ingest, port: 8427}
