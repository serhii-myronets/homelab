# Where the lab's agents write (decisions/0040). The lab's vmagent and
# vlagent push to https://ingest.home, through core's Gateway, to this
# vmauth; it lets a request in only with the lab's token and only on the two
# write paths, and forwards it to VMSingle or VLSingle. Reads, queries and
# deletes are refused - the token is worth a flood of junk series at worst,
# never core's data.
#
# Not the chart's vmauth (vm-internal), which serves vmalert inside the
# cluster without any login. That one selects no VMUser, as nothing sets
# selectAllByDefault; this one selects only users labelled for it.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: ingest
spec:
  userSelector:
    matchLabels: {vmauth: ingest}
  nodeSelector: {kubernetes.io/hostname: worker-1}
  tolerations: [{key: homelab/dedicated, value: worker-1, effect: NoSchedule}]
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
---
# One user per cluster that writes here, so each can be cut off alone.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: lab
  labels: {vmauth: ingest}
spec:
  tokenRef: {name: lab-ingest, key: token}
  targetRefs:
    - crd: {kind: VMSingle, name: vm, namespace: observability}
      paths: ["/api/v1/write"]
    - crd: {kind: VLSingle, name: vm, namespace: observability}
      paths: ["/insert/native"]
---
# The lab holds the same token at /system/observability/INGEST_TOKEN in its
# own Infisical project.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-ingest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: lab-ingest
  data:
    - secretKey: token
      remoteRef: {key: /system/observability/LAB_INGEST_TOKEN}
---
# Local only, as grafana.home: the lab is on the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingest
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [ingest.home]
  rules:
    - backendRefs:
        - {name: vmauth-ingest, port: 8427}
