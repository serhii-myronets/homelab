# The logs' store, chosen over VictoriaLogs after the two ran side by side
# (decisions/0047). One process, the chunks and index on worker-1's disk, a
# month kept.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "18.13.8"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  values:
    deploymentMode: SingleBinary
    loki:
      # One tenant: nothing writes here but core's own collector.
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-10-05"
            store: tsdb
            object_store: filesystem
            schema: v13
            index: {prefix: loki_index_, period: 24h}
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      querier:
        max_concurrent: 2

    singleBinary:
      replicas: 1
      nodeSelector: {kubernetes.io/hostname: worker-1}
      persistence:
        enabled: true
        size: 20Gi
        storageClass: lvm-worker-1
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {memory: 1Gi}
      extraEnv:
        - {name: GOMEMLIMIT, value: 900MiB}

    # The chart's defaults are for a cluster: memcached for chunks and
    # results, an nginx gateway, a canary writing test lines, MinIO, and the
    # other deployment modes' components. None of it earns its memory here.
    chunksCache: {enabled: false}
    resultsCache: {enabled: false}
    gateway: {enabled: false}
    lokiCanary: {enabled: false}
    test: {enabled: false}
    minio: {enabled: false}
    ruler: {enabled: false}
    sidecar:
      rules: {enabled: false}
    backend: {replicas: 0}
    read: {replicas: 0}
    write: {replicas: 0}

    monitoring:
      serviceMonitor:
        enabled: true
        # vmagent's interval; the chart's 15s suits its own recording rules,
        # which are not installed.
        interval: 30s
    # The chart's monitor stamps every series with this as `cluster`,
    # the release name by default; the dashboards select by cluster.
    clusterLabelOverride: core
---
# For Grafana's datasource sidecar, which provisions every ConfigMap so
# labelled in this namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-ds
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc:3100
