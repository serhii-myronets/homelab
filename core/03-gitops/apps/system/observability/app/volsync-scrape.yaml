# VolSync's own metrics - above all volsync_volume_out_of_sync, a backup that
# has missed its hour - for Grafana and Homepage. The controller serves them
# over HTTPS and asks the API server whether the caller may read /metrics;
# rather than switch that check off, vmagent is given the chart's own
# metrics-reader role. Here rather than beside VolSync, because the scrape is
# a VictoriaMetrics kind and this stack brings its CRD.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: volsync
spec:
  namespaceSelector:
    matchNames: [storage]
  selector:
    matchLabels:
      app.kubernetes.io/name: volsync
      control-plane: volsync-controller
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The controller's certificate is self-signed at start-up.
        insecureSkipVerify: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent-reads-volsync-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-metrics-reader
subjects:
  - kind: ServiceAccount
    name: vmagent-vm
    namespace: observability
