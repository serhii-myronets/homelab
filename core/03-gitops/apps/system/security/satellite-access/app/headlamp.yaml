# satellite's Headlamp shows core too, through this account. `edit`, by the
# owner's choice on 2026-09-30: it can restart, change and delete workloads
# in every namespace, and read and write their Secrets - so a satellite
# broken into can do the same to core. `view` would have read everything but
# Secrets and changed nothing.
#
# The token below is copied by hand into Infisical, prod
# /satellite/CORE_HEADLAMP_TOKEN, with the cluster CA beside it as
# /satellite/CORE_CA; satellite builds its kubeconfig from them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
---
# A token that does not expire, which Kubernetes fills in and keeps.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-token
  annotations:
    kubernetes.io/service-account.name: headlamp
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: satellite-headlamp-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - {kind: ServiceAccount, name: headlamp, namespace: satellite-access}
---
# `edit` is namespaced; Headlamp also lists what belongs to the cluster as a
# whole. Read only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: satellite-headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [scheduling.k8s.io, node.k8s.io, networking.k8s.io]
    resources: [priorityclasses, runtimeclasses, ingressclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: satellite-headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: satellite-headlamp-cluster-read
subjects:
  - {kind: ServiceAccount, name: headlamp, namespace: satellite-access}
