# A local authority of the cluster's own, for the .home names. Nothing
# public issues certificates for an invented domain, so devices that should
# see a valid certificate have to trust this root; without that, browsers
# warn and the pages still open.
#
# The root is not generated here any more. cert-manager made it on
# 2026-09-20 from a self-signed issuer, which left it existing only in this
# cluster: a rebuild would have minted a new root and every device would have
# had to trust it again. Since 2026-09-30 it lives in Infisical, prod
# /home-ca, and comes back from there - the same key and certificate, valid
# until 2036-09-17. Nothing renews it; replace it by hand before then.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-ca
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: home-ca
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: crt
      remoteRef: {key: /system/home-ca/TLS_CRT}
    - secretKey: key
      remoteRef: {key: /system/home-ca/TLS_KEY}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
spec:
  ca:
    secretName: home-ca
