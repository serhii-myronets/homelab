apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 30m
  # The chart's csi-snapshotter sidecar needs the snapshot CRDs, which the
  # cluster-wide controller owns. Stating it here puts the dependency where
  # the requirement actually is, and lets that controller stay a single file.
  dependsOn:
    - name: snapshot-controller
      namespace: storage
  chart:
    spec:
      chart: openebs
      version: "4.6.1"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false

    # LVM LocalPV only; its StorageClass and VolumeSnapshotClass are declared
    # beside this file, after the thin pool exists. The snapshot CRDs come from
    # the snapshot-controller component.
    lvm-localpv:
      crds:
        csi:
          volumeSnapshots:
            enabled: false
      # Resources, which the chart leaves out. Each value applies to every
      # container in the pod, so the controller's four ask for 40m together.
      # No CPU limit: a throttled volume driver fails mounts and snapshots.
      # The memory limits sit far above use only so that Talos's OOM
      # controller scores these pods zero; see the note in the Cilium values.
      lvmNode:
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {memory: 256Mi}
        # worker-1's taint; without this its `ssd` volume group has no driver.
        tolerations:
          - {key: homelab/dedicated, value: worker-1, effect: NoSchedule}
      lvmController:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
        # A cluster takes one snapshot controller, and it is the one in
        # kube-system. The csi-snapshotter sidecar beside this stays: it turns a
        # VolumeSnapshot into an LVM snapshot, which is the driver's own work.
        snapshotController:
          enabled: false

    localpv-provisioner:
      enabled: false

    engines:
      local:
        hostpath:
          enabled: false
        lvm:
          enabled: true
        rawfile:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    alloy:
      enabled: false

    loki:
      enabled: false

    preUpgradeHook:
      enabled: false
