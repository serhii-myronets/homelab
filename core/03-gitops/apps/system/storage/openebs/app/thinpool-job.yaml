# The Talos provider still speaks the v1.13 configuration contract, which has
# no LVMVolumeGroupConfig, so each node's SSD becomes a volume group here
# instead: controlplane's WD NVMe as `nvme`, worker-1's ORICO as `ssd`.
# OpenEBS would also size a missing thin pool to the first claim and share it
# with every later one, so the pool is created once, over nearly the whole
# group; the rest stays free for its metadata.
#
# Every step is skipped when it is already done, and nothing here erases a
# disk: on a disk that still holds partitions, pvcreate fails and the job
# retries until the disk is wiped by hand.
#
# Zeroing off: by default a thin pool writes zeros over every chunk before
# handing it to a volume, which doubles the writes of anything filling fresh
# space. qBittorrent's staging volume does exactly that, and on the WD - one
# PCIe 3.0 lane - it held the disk saturated for half an hour at a time
# (NodeDiskIOSaturation, traps.yaml). The volumes are XFS on a single tenant;
# nothing reads a block it has not written. lvchange is idempotent, so the
# step runs every time.
#
# Size, checked every time too, not only at creation: a pool that already
# exists is grown to 95% of its group and 2 GiB of metadata. worker-1's pool
# had been made by OpenEBS at its first claim's 50 GiB and filled on
# 2026-10-02 with 1.8 TB free beside it (traps.yaml,
# openebs-lvm-thin-pool-sized-to-first-claim). lvextend fails harmlessly
# when the pool is already that size.
apiVersion: batch/v1
kind: Job
metadata:
  name: nvme-thinpool
  namespace: openebs
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: lvm
          image: docker.io/openebs/lvm-driver:1.10.1
          command:
            - sh
            - -c
            # No `set -e`: each step tests for its own result, and the shell
            # would exit on the first check that finds nothing yet.
            - >-
              DISK=/dev/disk/by-id/nvme-eui.e8238fa6bf530001001b444a46596260;
              vgs nvme || { pvs "$DISK" || pvcreate "$DISK"; vgcreate nvme "$DISK"; };
              lvs nvme/nvme_thinpool ||
              lvcreate --type thin-pool --extents 95%FREE --name nvme_thinpool nvme;
              lvextend -l 95%VG nvme/nvme_thinpool 2>/dev/null || true;
              lvchange --zero n nvme/nvme_thinpool;
              vgs nvme; lvs nvme
          env:
            # No udev inside the container.
            - {name: DM_DISABLE_UDEV, value: "1"}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: dev, mountPath: /dev}
      volumes:
        - name: dev
          hostPath: {path: /dev}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ssd-thinpool
  namespace: openebs
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: worker-1
      tolerations:
        - {key: homelab/dedicated, value: worker-1, effect: NoSchedule}
      containers:
        - name: lvm
          image: docker.io/openebs/lvm-driver:1.10.1
          command:
            - sh
            - -c
            - >-
              DISK=/dev/disk/by-id/ata-ORICO_UB202412065113;
              vgs ssd || { pvs "$DISK" || pvcreate "$DISK"; vgcreate ssd "$DISK"; };
              lvs ssd/ssd_thinpool ||
              lvcreate --type thin-pool --extents 95%FREE --name ssd_thinpool ssd;
              lvextend --poolmetadatasize 2G ssd/ssd_thinpool 2>/dev/null || true;
              lvextend -l 95%VG ssd/ssd_thinpool 2>/dev/null || true;
              lvchange --zero n ssd/ssd_thinpool;
              vgs ssd; lvs ssd
          env:
            - {name: DM_DISABLE_UDEV, value: "1"}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: dev, mountPath: /dev}
      volumes:
        - name: dev
          hostPath: {path: /dev}
