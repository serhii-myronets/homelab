# The key the router knows as router-backup: its authorized_keys line forces
# `sysupgrade -b -`, so the key can fetch a backup and do nothing else
# (router/backup/authorized_key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: router-backup-ssh
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: router-backup-ssh
  data:
    - {secretKey: id_ed25519, remoteRef: {key: /system/router-backup/SSH_PRIVATE_KEY}}
---
# The same R2 bucket and restic password as every other backup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: router-backup-restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: router-backup-restic
    template:
      data:
        RESTIC_REPOSITORY: "s3:{{ .ENDPOINT }}/homelab-backups/router"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .SECRET_ACCESS_KEY }}"
  data:
    - {secretKey: ENDPOINT, remoteRef: {key: /system/backups/R2_ENDPOINT}}
    - {secretKey: ACCESS_KEY_ID, remoteRef: {key: /system/backups/R2_ACCESS_KEY_ID}}
    - {secretKey: SECRET_ACCESS_KEY, remoteRef: {key: /system/backups/R2_SECRET_ACCESS_KEY}}
    - {secretKey: RESTIC_PASSWORD, remoteRef: {key: /system/backups/RESTIC_PASSWORD}}
