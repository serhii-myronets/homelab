# One htpasswd line per client. Today only immich's photo copy; its password
# in the clear is the client's, at /services/immich/PHOTO_COPY_REST_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: htpasswd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: htpasswd
  data:
    - {secretKey: .htpasswd, remoteRef: {key: /system/rest-server/HTPASSWD}}
