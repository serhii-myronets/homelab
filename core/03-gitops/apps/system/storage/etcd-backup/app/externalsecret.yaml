# The same R2 bucket and restic password as every VolSync repository, so no
# new secret has to be kept anywhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: etcd-backup-restic
    template:
      data:
        RESTIC_REPOSITORY: "s3:{{ .ENDPOINT }}/homelab-backups/etcd/beelink"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .SECRET_ACCESS_KEY }}"
  data:
    - {secretKey: ENDPOINT, remoteRef: {key: /system/backups/R2_ENDPOINT}}
    - {secretKey: ACCESS_KEY_ID, remoteRef: {key: /system/backups/R2_ACCESS_KEY_ID}}
    - {secretKey: SECRET_ACCESS_KEY, remoteRef: {key: /system/backups/R2_SECRET_ACCESS_KEY}}
    - {secretKey: RESTIC_PASSWORD, remoteRef: {key: /system/backups/RESTIC_PASSWORD}}
