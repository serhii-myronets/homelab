# Restarts a Deployment when a Secret or ConfigMap it reads changes - a key
# rotated in Infisical reaches a pod only when the pod starts again, since
# Kubernetes never refreshes environment variables in a running one. Opt-in:
# only Deployments annotated reloader.stakater.com/auto: "true" are touched.
# Stateless, so on worker-1 (decisions/0035).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: reloader
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    reloader:
      readOnlyRootFileSystem: true
      deployment:
        nodeSelector:
          kubernetes.io/hostname: worker-1
        tolerations:
          - {key: homelab/dedicated, value: worker-1, effect: NoSchedule}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
