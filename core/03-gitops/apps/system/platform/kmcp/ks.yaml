apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kmcp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core/03-gitops/apps/system/platform/kmcp/app
  prune: true
  wait: true
  timeout: 5m
