# A console for core and the lab: browse objects and read logs. It watches
# nothing and alerts on nothing - see docs/decisions/0008.
#
# Nothing is stored: no claim, no database, no CRDs. Losing the pod loses a
# session and nothing else.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  # helm-controller leaves a release alone once installed unless told
  # otherwise: with this, an edit made by hand is reverted at the next interval.
  driftDetection:
    mode: enabled
  values:
    # The chart ships no resources. It is a Go binary serving a static
    # frontend, so this is generous rather than tight.
    resources:
      requests: {cpu: 25m, memory: 96Mi}
      limits: {memory: 256Mi}

    # Two clusters from two kubeconfigs, kubeconfigs.yaml (decisions/0042).
    # Not in-cluster mode: there Headlamp hands its own token only to its
    # own cluster and asks the browser for one for any other, so the lab
    # would want a token pasted every session. Read from kubeconfigs, each
    # cluster uses the credentials in its file and nothing is asked.
    #
    # No sign-in either way: every visitor gets what the two files hold -
    # core through the service account below, the lab as its admin.
    config:
      inCluster: false
      sessionTTL: 86400
      extraArgs:
        - -kubeconfig=/headlamp/kubeconfigs/core:/headlamp/kubeconfigs/lab

    volumes:
      - name: kubeconfigs
        projected:
          sources:
            - configMap:
                name: kubeconfig-core
                items: [{key: config, path: core}]
            - secret:
                name: kubeconfig-lab
                items: [{key: config, path: lab}]
    volumeMounts:
      - {name: kubeconfigs, mountPath: /headlamp/kubeconfigs, readOnly: true}

    # cluster-admin, and with no sign-in in front of it, which is the owner's
    # decision taken knowingly on 2026-09-20 rather than a default left alone.
    #
    # What it means, written down so it is never a surprise: headlamp.home has
    # no gate whatsoever, so anyone on the LAN - a laptop, the television, a
    # device that joins the wifi - gets full control of this cluster by
    # opening a page. That includes reading every Secret in it: the NordVPN
    # keys, the Cloudflare tunnel credentials, the R2 backup keys and the
    # database passwords, all of which came from Infisical and none of which
    # the `view` role would have shown.
    #
    # headlamp.serhii.link is additionally behind Cloudflare Access, so the
    # published name is the better protected of the two.
    #
    # Narrowing it is one word - `view` reads everything, changes nothing and
    # cannot see Secrets at all.
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
