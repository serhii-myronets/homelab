# The two clusters Headlamp shows, one kubeconfig each, mounted side by side
# (helmrelease.yaml). See docs/decisions/0042.
#
# core: this cluster, through Headlamp's own ServiceAccount token and CA -
# the files Kubernetes mounts into the pod, so nothing here is secret. The
# account is bound to cluster-admin by the chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig-core
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: core
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: headlamp
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: core
        context: {cluster: core, user: headlamp}
    current-context: core
---
# lab: the lab's admin kubeconfig, which the lab's Terraform writes here from
# its Talos secrets (the lab repository's 01-infrastructure/clients.tf). Its
# context is admin@lab.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeconfig-lab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: kubeconfig-lab
  data:
    - secretKey: config
      remoteRef: {key: /system/headlamp/LAB_KUBECONFIG}
