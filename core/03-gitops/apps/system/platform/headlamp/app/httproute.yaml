# Both names. Cloudflare Access stands in front of the published one; the
# local one has no gate at all (helmrelease.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - headlamp.home
    # external-dns publishes this through the Beelink tunnel.
    - headlamp.serhii.link
  rules:
    - backendRefs:
        - {name: headlamp, port: 80}
