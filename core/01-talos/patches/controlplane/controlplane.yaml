machine:
  install:
    # By serial. The name moves between boots: the system disk was nvme1n1
    # until the rebuild of 2026-09-30 found it at nvme0n1, with the WD and
    # every volume on it at nvme1n1. The generator still writes its default
    # `disk: /dev/sda` - an HDD here - and no patch can blank it; that is
    # harmless only because diskSelector "always has priority over disk".
    diskSelector:
      serial: MQ49W66504526
  # One role, from one namespace: the nightly job in etcd-backup may take an
  # etcd snapshot through the Talos API and do nothing else. See
  # docs/decisions/0030.
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles: [os:etcd:backup]
      allowedKubernetesNamespaces: [etcd-backup]
cluster:
  allowSchedulingOnControlPlanes: true
  # Memory limits, well above use, only so that Talos's OOM controller never
  # picks the control plane: it scores zero any pod whose every container has
  # a limit. It killed kube-apiserver on 2026-09-29 for want of one. Requests
  # are Talos's defaults. See traps.yaml.
  apiServer:
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2560Mi}
  controllerManager:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 512Mi}
    # One control plane, so no rival to elect a leader against. With it on,
    # a node short of memory slows etcd, the lease lapses and the process
    # exits: it restarted this way in the stress test of 2026-09-29. Turn it
    # back on before a second control-plane node joins.
    extraArgs:
      leader-elect: "false"
  scheduler:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
    # See controllerManager.
    extraArgs:
      leader-elect: "false"
