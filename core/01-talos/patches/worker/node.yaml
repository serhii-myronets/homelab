# worker-1, core's second node since 2026-09-30, on the old OpenMediaVault
# box. See docs/decisions/0034.
machine:
  install:
    # Not by name: sda and sdb swap places between boots on this machine. Not
    # by serial either: Talos reports none for these SATA disks, only a WWID
    # that ends in it, padded with runs of spaces - hence the glob.
    diskSelector:
      wwid: "*GSMB2092400746"
  # The ORICO SSD is left whole to OpenEBS LVM LocalPV, as controlplane's WD
  # NVMe is; its volume group `ssd` is made by a Job in 03-gitops.
  kernel:
    modules:
      - name: dm_thin_pool
  # No taint, since 2026-10-05 (docs/decisions/0046): the scheduler places
  # pods on either node. What must not run here is kept off by its own
  # constraint - its volume, a node selector, the GPU plugin's.
  #
  # Were a taint wanted again: through the kubelet at registration,
  # kubelet.extraConfig.registerWithTaints, not machine.nodeTaints - on a
  # worker Talos applies those with the node's own credentials, and
  # NodeRestriction forbids a node to change its taints (traps.yaml).
