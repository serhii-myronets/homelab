services:
  vpn:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/ssd/docker/data/torrent/gluetun:/gluetun
      - /srv/ssd/docker/secrets/nordvpn:/gluetun/creds:ro
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER_FILE=/gluetun/creds/user
      - OPENVPN_PASSWORD_FILE=/gluetun/creds/pass
      - SERVER_COUNTRIES=Netherlands
      - FIREWALL_INPUT_PORTS=8080,3000
    restart: unless-stopped
    networks:
      - backend

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    # restart: true is what stops a redeploy from stranding this container.
    # Recreating vpn gives it a new network namespace; without this, Compose
    # leaves qbittorrent attached to the old one, still listening where
    # nothing can reach it. See docs/traps.yaml.
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
    volumes:
      - /srv/ssd/docker/data/torrent/qbittorrent:/config
      - ./qBittorrent.conf:/config/qBittorrent/qBittorrent.conf:ro
      - /srv/ssd/samba/torrents:/downloads
    restart: unless-stopped

  flood:
    image: jesec/flood:latest
    container_name: flood
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
      qbittorrent:
        condition: service_started
        restart: true
    environment:
      # FLOOD_OPTION_<flag> maps to Flood's CLI flags through yargs, so each
      # name has to match its flag exactly — QBURL, not QBIT_URL. Anything
      # else is ignored without a word.
      #
      # auth=none skips account creation, and is also what makes Flood pick up
      # the client settings below instead of asking for them in the UI.
      - FLOOD_OPTION_AUTH=none
      # Its database — UI settings, RSS feeds, notification rules — otherwise
      # lives inside the container and dies with it. The host directory must
      # be owned by 1001, which core/bootstrap.sh handles.
      - FLOOD_OPTION_RUNDIR=/data
      - FLOOD_OPTION_QBURL=http://localhost:8080
      # Ignored by qBittorrent, which trusts 127.0.0.1 per its AuthSubnetWhitelist,
      # but Flood refuses to start without them set.
      - FLOOD_OPTION_QBUSER=admin
      - FLOOD_OPTION_QBPASS=adminadmin
    volumes:
      - /srv/ssd/docker/data/torrent/flood:/data
    restart: unless-stopped

networks:
  backend:
    external: true
