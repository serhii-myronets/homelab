# Everything satellite runs, in one list; the root applies these pointers and
# nothing else, as on core.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-repositories.yaml

  - system/network/cloudflared/ks.yaml
  - system/network/external-dns/ks.yaml
  - system/network/gateway-system/ks.yaml

  # A HelmRelease with no manifests beside it, applied by the root directly.
  - system/platform/metrics-server.yaml
  - system/platform/headlamp/ks.yaml
  - system/security/cert-manager/ks.yaml
  - system/security/external-secrets/ks.yaml
  - system/security/home-ca/ks.yaml
  - system/storage/openebs/ks.yaml

  - system/observability/ks.yaml
