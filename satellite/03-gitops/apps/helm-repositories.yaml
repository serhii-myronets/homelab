# Every upstream chart satellite may install from, as on core.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: cert-manager, namespace: flux-system}
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: external-dns, namespace: flux-system}
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: headlamp, namespace: flux-system}
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: metrics-server, namespace: flux-system}
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: openebs, namespace: flux-system}
spec:
  interval: 24h
  url: https://openebs.github.io/openebs
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: victoriametrics, namespace: flux-system}
spec:
  interval: 24h
  url: https://victoriametrics.github.io/helm-charts/
