# satellite's own Gateway, so its services stay reachable when core is down.
# The tunnel speaks plain HTTP to the public listener, and Cloudflare holds
# that certificate at its edge. Local names are HTTPS, signed by satellite's
# intermediate of home-ca.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: gateway-system
  annotations:
    # external-dns points public names at satellite's tunnel, never core's.
    external-dns.kubernetes.io/target: 970ef69a-1a26-4869-8977-abf74db554a5.cfargotunnel.com
spec:
  gatewayClassName: cilium
  # The first address of the block, and fixed: the router's rewrites for
  # satellite's .home names will point here.
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 192.168.8.21
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.serhii.link"
      allowedRoutes:
        namespaces:
          from: All
    # Local names typed without a scheme land here and are sent to HTTPS; only
    # this namespace may attach, as on core.
    - name: http-home
      protocol: HTTP
      port: 80
      hostname: "*.home"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.home"
      tls:
        certificateRefs:
          - {name: home-tls}
      allowedRoutes:
        namespaces:
          from: All
