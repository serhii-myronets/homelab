apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    provider:
      name: cloudflare

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef: {name: cloudflare-api-token, key: CF_API_TOKEN}

    # Records come from HTTPRoutes only. The Gateway carries the tunnel as its
    # target, and only names under serhii.link are published; any other name on
    # the same Gateway stays on the LAN.
    sources:
      - gateway-httproute
    domainFilters:
      - serhii.link
    extraArgs:
      - --cloudflare-proxied

    # Its own owner, never core's `beelink`: with a shared owner and policy
    # sync, each instance would delete the other's records as its own stale
    # ones. The token is core's - satellite reads the same Infisical project.
    registry: txt
    txtOwnerId: satellite
    policy: sync

    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
