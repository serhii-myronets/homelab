apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.93.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  # The operator's CRDs are too large for a client-side apply annotation;
  # helm-controller applies server-side.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Grafana's chart mints a fresh admin password on every render; nothing
      # reads it, since the login form is off.
      - paths: ["/data"]
        target: {kind: Secret, name: grafana}
  values:
    # satellite's metrics hub, restored from archive/observability, where it
    # spent one evening on core - every lesson in its comments below was paid for
    # there. It keeps what both clusters send and alerts on it; core runs only an
    # agent that writes here. See docs/decisions/0032.
    global:
      # The label the chart's rules and dashboards group by.
      clusterLabel: cluster

    # Every name the operator builds starts from this. Left at the release
    # name, "observability", Alertmanager's pod label came to 64 bytes and the
    # StatefulSet could not create it at all - Kubernetes caps a label at 63.
    fullnameOverride: vm

    # One release carries the whole stack: the operator, VMSingle, vmagent,
    # vmalert, Alertmanager, Grafana, kube-state-metrics and node-exporter.
    #
    # Metrics only to begin with. VictoriaLogs lives in this same chart, as
    # vlsingle and vlagent at the bottom of this file, so adding logs later is
    # a change here rather than a second application.
    #
    # The chart ships no resources block for any of its eight workloads - every
    # one renders with neither request nor limit. This node's limits already
    # exceed its memory, so all eight are set below. Requests are what each is
    # expected to hold; limits leave room to spike without taking the node.

    victoria-metrics-operator:
      # Off, and the reason is worth keeping. The chart mints the webhook's
      # certificate authority while it renders; keepTLSSecret, which is meant
      # to reuse the existing one, works through Helm's lookup, and lookup
      # needs a live cluster. Argo renders without one, so every sync pushed a
      # fresh authority while the running operator went on serving the old
      # certificate - the apiserver filled with x509 errors at a core of CPU,
      # and the webhook failed open, validating nothing while it did so.
      #
      # What it buys is server-side checking of VictoriaMetrics resources,
      # which are rendered from this file and reviewed before they are pushed.
      # That is not worth a certificate that cannot hold still.
      admissionWebhooks:
        enabled: false
      resources:
        requests: {cpu: 25m, memory: 96Mi}
        limits: {memory: 256Mi}

    vmsingle:
      spec:
        # Three months, for two clusters; the ORICO's thin pool has room to spare.
        retentionPeriod: "3"
        storage:
          storageClassName: lvm
          resources:
            requests: {storage: 100Gi}
        # Observational data with a one-month life: no VolSync source points
        # here on purpose. Losing it costs history, not state.
        resources:
          requests: {cpu: 100m, memory: 320Mi}
          limits: {memory: 1Gi}

    # Load-bearing, despite VMSingle being able to scrape on its own. Turn
    # vmagent off and the chart still renders VMSingle without scrape
    # selectors, leaving its thirteen scrape objects with nobody to read them.
    # Removing it means also setting selectAllByDefault on VMSingle's spec,
    # which is a step off the chart's path - worth doing only if a measurement
    # says this pod is expensive.
    vmagent:
      spec:
        # Thirty seconds rather than fifteen. Scrape interval is the largest
        # lever on both memory and disk here, and nothing in this cluster
        # changes fast enough to need the other half.
        scrapeInterval: 30s
        # Every series says which cluster it came from; core's agent will write
        # here with cluster=core.
        externalLabels:
          cluster: satellite
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 384Mi}

    # vmalert and Alertmanager are what the chart's prebuilt alert rules run
    # on. Grafana's own alerting could replace the pair, but not the rules -
    # those would then have to be written by hand, and they are most of what
    # this stack is worth on the first day.
    vmalert:
      spec:
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 192Mi}

    alertmanager:
      spec:
        resources:
          requests: {cpu: 10m, memory: 48Mi}
          limits: {memory: 128Mi}

    grafana:
      # Fixed, so the HTTPRoute beside this file does not depend on what the
      # Argo application happens to be called.
      fullnameOverride: grafana
      # Grafana's own metrics were 24,616 series, a fifth of everything stored,
      # and their largest family was which feature flags are switched on.
      # Whether Grafana is alive is already answered by kube-state-metrics.
      vmScrape:
        enabled: false
      # No sign-in. grafana.home is open to the LAN and grafana.serhii.link sits
      # behind Cloudflare Access, as Headlamp does. Anyone who reaches it gets
      # Admin, which includes editing the alerting rules, so this is a statement
      # about who reaches it, not about Grafana.
      #
      # An admin account still exists underneath, because the chart insists on
      # one. Its password is minted fresh on every render, which is why the
      # application ignores that secret rather than rewriting it each sync.
      grafana.ini:
        auth:
          disable_login_form: true
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Admin
        users:
          allow_sign_up: false
      # The datasource for VictoriaLogs is a plugin, fetched when Grafana starts.
      plugins:
        - victoriametrics-logs-datasource
      # No claim, deliberately. Every dashboard is provisioned by the sidecar
      # from ConfigMaps and the datasource by the chart, so Grafana's database
      # holds only sessions and preferences. A claim would also need the
      # Recreate strategy, since a volume on the lvm class mounts into one pod.
      persistence:
        enabled: false
      # Steady state is about 150Mi. The ceiling is for the other moment: the
      # sidecar imports every dashboard at once on each start, and that spike
      # came within six megabytes of a 384Mi limit.
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 768Mi}
      sidecar:
        resources:
          requests: {cpu: 10m, memory: 48Mi}
          limits: {memory: 128Mi}

    kube-state-metrics:
      resources:
        requests: {cpu: 25m, memory: 48Mi}
        limits: {memory: 192Mi}

    prometheus-node-exporter:
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {memory: 96Mi}

    # Logs, since 2026-09-30, once the metrics half had been measured here.
    # VictoriaLogs keeps a month; vlagent reads every pod's log from the node
    # and writes it here. core's own vlagent will write here too.
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        storage:
          storageClassName: lvm
          resources:
            requests: {storage: 50Gi}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 256Mi}

    # Talos binds the controller manager and the scheduler to localhost, and
    # serves etcd only to clients holding its certificate, so none of the three
    # can be reached from a pod. Left on, they are targets that can only ever be
    # down, and an alert that can only ever be firing. Exposing them is a Talos
    # machine config change, not a change here.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false

    kubeApiServer:
      vmScrape:
        spec:
          # The whole endpoint is restated because Helm replaces lists rather
          # than merging them; everything but the last two keys is the chart's
          # own default.
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              # This cluster's apiserver answers /metrics with more than the
              # 16MB a scrape may read by default, and the scrape failed whole.
              # Raising the ceiling only lets it be read - the drop below is
              # what keeps it from being kept, because almost all of that size
              # is histogram buckets nobody here will open.
              max_scrape_size: "64MB"
              # Five minutes, not thirty seconds. The apiserver has to build
              # that whole answer every time it is asked, whatever is dropped
              # afterwards, and asking twice a minute cost it a full core of
              # the node's four. Nothing read from here needs finer resolution.
              scrape_interval: 5m
              # Every histogram bucket, not a list of them. Naming families one
              # by one missed the largest - the watch and storage histograms -
              # and this job alone still held 39,749 of the database's 110,669
              # series. The _sum and _count of each survive, which is what an
              # average or a rate is built from; the buckets only answer
              # questions about percentiles that nothing here asks.
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: ".*_bucket"
