# The same name as core's, so a manifest moves between the clusters unchanged.
# Thin volumes each with a hard size: claims must not add up to more than the
# pool, since a full thin pool fails every volume on it at once.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  volgroup: ssd
  thinProvision: "yes"
  fsType: xfs
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
