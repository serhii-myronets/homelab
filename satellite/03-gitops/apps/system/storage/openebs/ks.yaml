apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./satellite/03-gitops/apps/system/storage/openebs/app
  prune: true
  # Waits for the HelmRelease and for the thin-pool job, so it stays not Ready
  # until the ORICO is wiped and the pool exists.
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-classes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./satellite/03-gitops/apps/system/storage/openebs/classes
  prune: true
  wait: true
  timeout: 5m
  # No claim can bind before the thin pool exists.
  dependsOn:
  - name: openebs
