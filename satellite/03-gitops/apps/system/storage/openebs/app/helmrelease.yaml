# core's release and version, less the snapshot controller: satellite takes no
# VolumeSnapshots, since it holds copies rather than what is copied. The
# chart's csi-snapshotter sidecar still needs the snapshot CRDs to start, so
# the chart installs them here, where core takes them from its own controller.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: "4.6.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true

    lvm-localpv:
      crds:
        csi:
          volumeSnapshots:
            enabled: false
      # As on core: requests, no CPU limit, and memory limits far above use so
      # Talos's OOM controller scores these pods zero.
      lvmNode:
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {memory: 256Mi}
      lvmController:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
        snapshotController:
          enabled: false

    localpv-provisioner:
      enabled: false

    engines:
      local:
        hostpath:
          enabled: false
        lvm:
          enabled: true
        rawfile:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    alloy:
      enabled: false

    loki:
      enabled: false

    preUpgradeHook:
      enabled: false
