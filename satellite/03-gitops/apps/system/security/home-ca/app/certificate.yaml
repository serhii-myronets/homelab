# satellite's .home names, each listed, as on core. Every name here also needs
# its own rewrite on the router, since *.home points at core.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-wildcard
  namespace: gateway-system
spec:
  secretName: home-tls
  issuerRef:
    kind: ClusterIssuer
    name: home-ca
  dnsNames:
    - headlamp.home
    - grafana.home
  duration: 8760h
  renewBefore: 720h
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: ECDSA
    size: 256
