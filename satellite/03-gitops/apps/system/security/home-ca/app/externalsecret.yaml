# satellite signs its .home names with an intermediate of core's home-ca, not
# with home-ca itself: the root's key never leaves core. The intermediate was
# made once, by hand, on 2026-09-30 - signed by home-ca with pathlen 0 and a
# name constraint to `home`, valid until 2031-09-29 - and lives in Infisical.
# A device that trusts home-ca trusts what this signs, and nothing it could
# sign outside .home. Re-sign it before it lapses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-intermediate
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: home-intermediate
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        # The intermediate followed by the root, so issued certificates carry
        # the chain a client needs.
        tls.crt: "{{ .chain }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: chain
      remoteRef: {key: /satellite/HOME_INTERMEDIATE_CHAIN}
    - secretKey: key
      remoteRef: {key: /satellite/HOME_INTERMEDIATE_KEY}
