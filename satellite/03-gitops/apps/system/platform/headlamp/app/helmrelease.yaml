# One console for both clusters, here rather than on core, so it still opens
# when core is down. satellite through its own service account, core through
# the kubeconfig beside this file - `edit` there, not cluster-admin.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    resources:
      requests: {cpu: 25m, memory: 96Mi}
      limits: {memory: 256Mi}

    config:
      inCluster: true
      inClusterContextName: satellite
      # No sign-in, as on core: every visitor is handed the service account,
      # cluster-admin on satellite and `edit` on core. Whoever reaches the page
      # holds both, so its routes carry that weight.
      unsafeUseServiceAccountToken: true
      sessionTTL: 86400

    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin

    env:
      - name: KUBECONFIG
        value: /etc/headlamp/kubeconfig/config
    volumes:
      - name: kubeconfig
        secret: {secretName: headlamp-kubeconfig}
    volumeMounts:
      - {name: kubeconfig, mountPath: /etc/headlamp/kubeconfig, readOnly: true}
