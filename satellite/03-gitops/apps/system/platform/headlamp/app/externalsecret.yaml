# The kubeconfig that shows core beside satellite, assembled here from core's
# token and CA in Infisical and kept nowhere else. The account behind it is in
# core/03-gitops/apps/system/security/satellite-access.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-kubeconfig
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: headlamp-kubeconfig
    template:
      engineVersion: v2
      data:
        config: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: core
              cluster:
                server: https://192.168.8.10:6443
                certificate-authority-data: {{ .ca }}
          users:
            - name: core
              user:
                token: {{ .token }}
          contexts:
            - name: core
              context: {cluster: core, user: core}
          current-context: core
  data:
    - secretKey: token
      remoteRef: {key: /satellite/CORE_HEADLAMP_TOKEN}
    - secretKey: ca
      remoteRef: {key: /satellite/CORE_CA}
