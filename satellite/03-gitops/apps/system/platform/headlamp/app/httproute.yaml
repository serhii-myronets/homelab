# headlamp.home only for now: core still serves that name and publishes
# headlamp.serhii.link, until its own Headlamp goes and the router's rewrite
# sends headlamp.home here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - headlamp.home
  rules:
    - backendRefs:
        - {name: headlamp, port: 80}
