# Applied once, by hand, after 02-platform:
#   kubectl --context satellite apply -f satellite/03-gitops/flux.yaml
# Everything else arrives through it. The root is not reconciled from Git, so
# a change to its path needs applying again - see AGENTS.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/serhii-myronets/homelab.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: root
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./satellite/03-gitops/apps
  prune: true
