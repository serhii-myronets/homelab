# Applied once by hand, after Helmfile has installed the operator:
#   kubectl --context satellite apply -f flux-instance.yaml
#
# core's, less the patches that take fields over from Argo CD: satellite never
# ran Argo. No `.spec.sync` either - the GitRepository and root Kustomization
# belong in 03-gitops/flux.yaml.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.9.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    multitenant: false
    # Off for the reason given in core's: the lockdown shuts out the Gateway's
    # Envoy, which runs on the host rather than in a namespace.
    networkPolicy: false
    domain: cluster.local
