# The same releases and versions as core's, so that satellite runs every
# upgrade first. Pinned to the kubeconfig context `satellite`, hook included:
# the hook runs kubectl, which would otherwise use whatever context is current.
helmDefaults:
  kubeContext: satellite

repositories:
  - name: cilium
    url: https://helm.cilium.io
  - name: external-secrets
    url: https://charts.external-secrets.io

hooks:
  - events: [ "prepare" ]
    showlogs: true
    command: "kubectl"
    args: [ "--context", "satellite", "apply", "-k", "./prepare-hook/", "--server-side" ]

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.2
    values:
      - values/cilium-values.yaml

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 2.10.0
    needs:
      - kube-system/cilium
    values:
      - values/external-secrets-values.yaml

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.60.0
    needs:
      - external-secrets/external-secrets
    values:
      - values/flux-operator-values.yaml
