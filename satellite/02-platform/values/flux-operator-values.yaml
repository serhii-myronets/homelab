# As on core: the operator for its web interface on port 9080, nothing more.
resources:
  requests: {cpu: 25m, memory: 128Mi}
  limits: {memory: 512Mi}

web:
  enabled: true
  # Off for the reason given in core's values: any policy selecting the pod
  # shuts out the Gateway's Envoy, which runs on the host.
  networkPolicy:
    create: false
  # No route yet. satellite's Gateway arrives with 03-gitops, and *.home points
  # at core's; a name for it needs its own rewrite on the router first.
  httpRoute:
    enabled: false
