# Static, like core: nothing about this node may hang on the router's DHCP
# state, which a reflash wiped once. See docs/decisions/0028.
apiVersion: v1alpha1
kind: LinkConfig
name: enp1s0
up: true
addresses:
  - address: 192.168.8.11/24
routes:
  - gateway: 192.168.8.1
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.8.1
---
# A fixed name rather than a generated one, which changes on every reinstall.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: satellite
