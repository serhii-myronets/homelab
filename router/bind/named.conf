// The router's authoritative server for the house's own names, .home - see
// docs/decisions/0039. Installed by install.sh, which replaces the package's
// default file with this one.
//
// AdGuard Home forwards .home here ([/home/]127.0.0.1:5300 in its upstream
// servers); each cluster's external-dns writes its names here over RFC 2136,
// signed with its own key. Nothing else: no recursion, no other zone, port
// 5300 on the LAN and loopback only - dnsmasq holds 53, AdGuard 3053 and mDNS
// 5353.

options {
	directory "/var/cache/bind";
	listen-on port 5300 { 127.0.0.1; 192.168.8.1; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { 127.0.0.1; 192.168.8.0/24; };
	allow-transfer { none; };
	notify no;
	auth-nxdomain no;
	version none;
};

// The rndc key, which the package's init script generates on every start.
include "/etc/bind/named-rndc.conf";

// One TSIG key per cluster, named core and lab, written by install.sh from
// each cluster's Infisical project; never in Git.
include "/etc/bind/keys.conf";

zone "home" {
	type primary;
	// Under /etc, not /var: /var is tmpfs here. Written rarely - a change in
	// the clusters' routes - and rebuilt by external-dns within a minute if
	// lost.
	file "/etc/bind/dynamic/db.home";
	// Either cluster may write any .home name; which record belongs to which
	// cluster is external-dns' TXT registry, owner beelink or lab.
	update-policy {
		grant core zonesub ANY;
		grant lab zonesub ANY;
	};
	// external-dns reads the zone by transfer before it plans changes.
	allow-transfer { key core; key lab; };
};
