services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    env_file:
      - /srv/ssd/docker/secrets/portainer/license.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/ssd/docker/data/portainer/data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    external: true
