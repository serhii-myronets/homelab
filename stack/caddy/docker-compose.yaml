services:
  caddy:
    image: caddy:2
    container_name: caddy
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Requires "Enable relative path volumes" on the Portainer stack, otherwise
      # this path resolves inside the Portainer container and the daemon cannot see it.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/ssd/docker/data/caddy/data:/data
      - /srv/ssd/docker/data/caddy/config:/config
    restart: unless-stopped

networks:
  backend:
    external: true