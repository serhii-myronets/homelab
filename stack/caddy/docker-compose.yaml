services:
  caddy:
    image: caddy:2
    container_name: caddy
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Absolute host path: Portainer resolves relative paths inside its own
      # container, where the Docker daemon cannot see them (creates a phantom dir).
      - /srv/ssd/docker/data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/ssd/docker/data/caddy/data:/data
      - /srv/ssd/docker/data/caddy/config:/config
    restart: unless-stopped

networks:
  backend:
    external: true