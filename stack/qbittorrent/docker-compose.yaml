services:
  vpn:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/ssd/docker/data/qbittorrent/gluetun:/gluetun
      - /srv/ssd/docker/secrets/nordvpn:/gluetun/creds:ro
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER_FILE=/gluetun/creds/user
      - OPENVPN_PASSWORD_FILE=/gluetun/creds/pass
      - SERVER_COUNTRIES=Netherlands
      - FIREWALL_INPUT_PORTS=8080,3000
      - HEALTHCHECK=off
    restart: unless-stopped
    networks:
      - backend

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    depends_on:
      - vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
    volumes:
      - /srv/ssd/docker/data/qbittorrent/config:/config
      - /srv/ssd/samba/torrents:/downloads
    restart: unless-stopped

  flood:
    image: jesec/flood:latest
    container_name: flood
    network_mode: "service:vpn"
    depends_on:
      - vpn
      - qbittorrent
    environment:
      - FLOOD_DISABLE_AUTH=true
    volumes:
      - /srv/ssd/docker/data/flood/data:/data
    restart: unless-stopped

networks:
  backend:
    external: true
