services:
  vpn:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/ssd/docker/data/qbittorrent/gluetun:/gluetun
      - /srv/ssd/docker/secrets/nordvpn:/gluetun/creds:ro
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER_FILE=/gluetun/creds/user
      - OPENVPN_PASSWORD_FILE=/gluetun/creds/pass
      - SERVER_COUNTRIES=Netherlands
      - FIREWALL_INPUT_PORTS=8080,3000
      - HEALTHCHECK=off
    restart: unless-stopped
    networks:
      - backend

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    depends_on:
      - vpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
    volumes:
      - /srv/ssd/docker/data/qbittorrent/config:/config
      - ./qBittorrent.conf:/config/qBittorrent/qBittorrent.conf:ro
      - /srv/ssd/samba/torrents:/downloads
    restart: unless-stopped

  flood:
    image: jesec/flood:latest
    container_name: flood
    network_mode: "service:vpn"
    depends_on:
      - vpn
      - qbittorrent
    environment:
      # Flood maps FLOOD_OPTION_<flag> to its CLI flags via yargs (e.g. --auth,
      # --qburl), so the env var name must match the flag exactly, with no
      # extra underscores. auth=none is what actually skips account creation
      # (FLOOD_DISABLE_AUTH is not a real flag and was silently ignored) and
      # is also required for the qburl/qbuser/qbpass client config below to
      # be picked up automatically instead of prompting to add a client.
      - FLOOD_OPTION_AUTH=none
      - FLOOD_OPTION_QBURL=http://localhost:8080
      # Auth is bypassed via the AuthSubnetWhitelist=127.0.0.1/32 rule in
      # qBittorrent.conf, so any placeholder values work here.
      - FLOOD_OPTION_QBUSER=admin
      - FLOOD_OPTION_QBPASS=adminadmin
    volumes:
      - /srv/ssd/docker/data/flood/data:/data
    restart: unless-stopped


networks:
  backend:
    external: true
