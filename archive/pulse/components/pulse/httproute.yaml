# Published as well as local. Cloudflare Access stands in front of every
# serhii.link name, and Pulse asks for its own account behind that, so the
# two gates are independent. What is on the other side is a description of
# every machine in the house, which is why one gate would not be enough.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulse
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - pulse.home
    # external-dns publishes this through the Beelink tunnel.
    - pulse.serhii.link
  rules:
    - backendRefs:
        - {name: pulse, port: 7655}
