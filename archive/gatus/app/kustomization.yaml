apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gatus
resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - httproute.yaml
  - vmservicescrape.yaml
# The generated name carries a content hash, so a config change rolls the pod.
configMapGenerator:
  - name: gatus-config
    files:
      - config/config.yaml
