# home-ca's certificate alone, never its key, so the checks of *.home verify
# the chain rather than skip it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-ca-root
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: home-ca-root
  data:
    - secretKey: home-ca.crt
      remoteRef: {key: /system/home-ca/TLS_CRT}
