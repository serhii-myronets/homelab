# Base backups and the continuous WAL archive in Cloudflare R2. The endpoint
# names the account, not a credential.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2
  namespace: database
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://homelab-backups/cnpg
    endpointURL: https://32bd020558a0bb7293a40decd3f7b161.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: {name: r2-credentials, key: ACCESS_KEY_ID}
      secretAccessKey: {name: r2-credentials, key: SECRET_ACCESS_KEY}
    wal:
      compression: gzip
    data:
      compression: gzip
