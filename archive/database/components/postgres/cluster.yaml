# The shared Postgres for the Beelink's applications. One instance: there is
# one node, and R2 is the copy that survives it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    storageClass: lvm
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2
        serverName: postgres-v2
  # Bootstrap runs only when the cluster is created, so this does nothing
  # while it exists: a cluster rebuilt from this repository restores itself
  # from R2 instead of starting empty. It then keeps archiving to the same
  # series, which is safe only because the cluster it recovered from is gone.
  bootstrap:
    recovery:
      source: r2
  externalClusters:
    - name: r2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2
          serverName: postgres-v2
