# NOT deployed from this file. Portainer is managed by OpenMediaVault's Docker
# Compose plugin, which generates and owns:
#   /srv/ssd/docker/compose/portainer/portainer.yml
#   /srv/ssd/docker/compose/portainer/compose.override.yml
# This file documents the live container's actual config (docker inspect) and
# is the source of truth for changes. To apply a change, edit here, then mirror
# it into the OMV files and run, on the host:
#   docker compose -f /srv/ssd/docker/compose/portainer/portainer.yml up -d
#
# Kept deliberately out of Portainer's own GitOps stacks: a failed self-redeploy
# would take down the UI that manages every other stack.
services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    env_file:
      - /srv/ssd/docker/secrets/portainer/license.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/ssd/docker/data/portainer/data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    external: true
