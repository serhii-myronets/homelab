# Deployed with plain compose, by ./bootstrap.sh or:
#   docker compose -f portainer/docker-compose.yaml up -d
#
# Deliberately not one of Portainer's own GitOps stacks: a failed
# self-redeploy would take down the UI that manages every other stack.
services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    env_file:
      - /srv/ssd/docker/secrets/portainer/license.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/ssd/docker/data/portainer/data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    external: true
