[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=/config/qBittorrent/logs

[BitTorrent]
Session\AddTorrentStopped=false
Session\DefaultSavePath=/downloads/
Session\Interface=tun0
Session\InterfaceName=tun0
Session\Port=6881
Session\QueueingSystemEnabled=true
Session\SSL\Port=62002
Session\ShareLimitAction=Stop
# Download to the SSD claim first. qBittorrent copies completed files to the
# HDD save path itself, so only unfinished data occupies this volume.
Session\TempPath=/incomplete/
Session\TempPathEnabled=true
# Avoid charging the pod for Linux's HDD page cache; the SSD staging volume
# absorbs active download I/O instead.
Session\DiskIOReadMode=DisableOSCache
Session\DiskIOWriteMode=DisableOSCache

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Preferences]
Connection\PortRangeMin=6881
Connection\UPnP=false
Downloads\SavePath=/downloads/
Downloads\TempPath=/incomplete/
Downloads\TempPathEnabled=true
General\Locale=en
WebUI\Address=*
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=127.0.0.1/32, 192.168.8.0/24, 10.244.0.0/16
WebUI\ServerDomains=*
