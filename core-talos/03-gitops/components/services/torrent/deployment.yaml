apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: torrent
  template:
    metadata:
      labels:
        app: torrent
    spec:
      # Every container shares Gluetun's network, so all DNS goes through its
      # resolver inside the tunnel rather than to the cluster.
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
      # Torrents from Toloka carry http://retracker.local/announce, the
      # convention for an ISP's own retracker. Gluetun's resolver answers a
      # .local name with nothing at all - not even NXDOMAIN - so libtorrent
      # repeats the same two queries, A and AAAA, as fast as the socket takes
      # them: 28,000 packets a second on loopback, and 1.5 of four cores
      # inside Gluetun reading them. Three torrents were enough. Answering
      # the name here means the query is never sent; the announce then fails
      # on a refused connection, which libtorrent backs off from properly.
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [retracker.local]
      initContainers:
        - name: prepare
          image: busybox:1.37
          command:
            - sh
            - -c
            # qBittorrent prefers its own qBittorrent_new.conf and only
            # falls back to qBittorrent.conf, so Git's copy is installed here
            # and the rewritten one removed; otherwise changes never apply.
            - >-
              mkdir -p /apps/config/qBittorrent &&
              cp /git/qBittorrent.conf /apps/config/qBittorrent/qBittorrent.conf &&
              rm -f /apps/config/qBittorrent/qBittorrent_new.conf &&
              chown 1000:1000 /apps/config/qBittorrent/qBittorrent.conf &&
              chown 1000:1000 /incomplete
          volumeMounts:
            - {name: data, mountPath: /apps}
            - {name: config, mountPath: /git, readOnly: true}
            # A fresh claim belongs to root, and qBittorrent runs as 1000. It
            # makes a directory per category in here, so the volume's own root
            # has to be writable; chowning it here rather than through fsGroup
            # keeps the kubelet away from the 9 TB disk this pod also mounts.
            - {name: cache, mountPath: /incomplete}
        # A native sidecar: qBittorrent starts only once the tunnel is
        # healthy, so nothing leaves the pod outside the VPN.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: VPN_SERVICE_PROVIDER, value: nordvpn}
            # WireGuard, not OpenVPN, since 2026-09-20. The cost of this
            # tunnel is per packet rather than per byte, and torrent traffic
            # is mostly tiny packets: 8 million outbound of about 73 bytes
            # each - peer acknowledgements - against 14 million inbound.
            # OpenVPN encrypted every one of them in user space and spent
            # 1.5 of four cores to move 1.7 MiB/s. WireGuard is built into
            # the Talos kernel, so the packets never leave it.
            #
            # It also ends the startup trouble the two gluetun traps
            # describe: there is no authentication step to fail, so no loop
            # on a server that refuses, and no minute lost per dead address.
            # The OpenVPN credentials stay in the secret, so going back is
            # one value here.
            - {name: VPN_TYPE, value: wireguard}
            # NordVPN's key is read from the nordvpn secret through envFrom
            # below, as WIREGUARD_PRIVATE_KEY. The interface stays tun0:
            # gluetun names it from VPN_INTERFACE, not from the protocol,
            # and qBittorrent.conf binds to that name.
            #
            # The server list built into the image goes stale; gluetun
            # refreshes it, and for WireGuard it is also where each server's
            # public key comes from.
            - {name: UPDATER_PERIOD, value: 24h}
            - {name: SERVER_COUNTRIES, value: Netherlands}
            - {name: FIREWALL_INPUT_PORTS, value: "8080"}
            # Replies to LAN clients and kubelet probes must bypass the tunnel.
            - {name: FIREWALL_OUTBOUND_SUBNETS, value: "192.168.8.0/24,10.244.0.0/16"}
          envFrom:
            - secretRef: {name: nordvpn}
          volumeMounts:
            # Keeps the refreshed server list across restarts.
            - {name: gluetun, mountPath: /gluetun}
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          startupProbe:
            exec: {command: [/gluetun-entrypoint, healthcheck]}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec: {command: [/gluetun-entrypoint, healthcheck]}
            periodSeconds: 60
            # Ten minutes, not three. Some NordVPN WireGuard endpoints accept
            # the connection and carry nothing - the protocol has no
            # handshake to fail - and gluetun finds out from its own
            # healthcheck and moves to the next server. Restarting it during
            # that hunt throws the progress away and takes qBittorrent's
            # network with it, turning a recovery into an outage.
            failureThreshold: 10
          # It builds DNS block lists in memory as soon as the tunnel is up,
          # which 256Mi could not hold: the container was OOMKilled a few
          # seconds after every successful connection. Invisible until the
          # authentication loop above stopped it getting that far.
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      containers:
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: UMASK, value: "002"}
            - {name: WEBUI_PORT, value: "8080"}
          ports:
            - {name: qbittorrent, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: qbittorrent}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /config, subPath: config}
            - {name: cache, mountPath: /incomplete}
            # The torrents carried over from core hold /downloads in their
            # own resume data, so that mount stays; it now covers the same
            # files under their new name. Everything Sonarr and Radarr hand
            # over arrives through /data instead, the identical path in
            # every container, so no download client mapping is needed.
            # Drop /downloads once the old torrents have been re-imported.
            - {name: hdd-a, mountPath: /downloads, subPath: torrents}
            - {name: hdd-a, mountPath: /data}
      volumes:
        - name: gluetun
          persistentVolumeClaim: {claimName: gluetun}
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
        - name: cache
          persistentVolumeClaim: {claimName: cache}
        - name: config
          configMap: {name: torrent-config}
