apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  # external-dns publishes the public name through the Beelink tunnel behind
  # Cloudflare Access.
  hostnames: [torrent.home, torrent.serhii.link]
  rules:
    - backendRefs:
        - {name: torrent, port: 3000}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - qbittorrent.home
    - qbittorrent.serhii.link
  rules:
    - backendRefs:
        - {name: torrent, port: 8080}
