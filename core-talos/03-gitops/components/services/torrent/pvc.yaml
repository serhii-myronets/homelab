apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hdd-a
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: torrent-hdd-a
  resources:
    requests:
      storage: 9000Gi
---
# Gluetun's refreshed list of VPN servers: rebuilt on demand, never backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluetun
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: lvm
  resources:
    requests:
      storage: 1Gi
---
# Incomplete downloads land on the NVMe volume, then qBittorrent moves them to
# the HDD media volume after completion. They can always be downloaded again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: lvm
  resources:
    requests:
      storage: 50Gi
