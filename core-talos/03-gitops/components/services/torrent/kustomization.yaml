apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: torrent
resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# The generated name carries a content hash, so a config change rolls the pod.
configMapGenerator:
  - name: torrent-config
    files:
      - config/qBittorrent.conf
