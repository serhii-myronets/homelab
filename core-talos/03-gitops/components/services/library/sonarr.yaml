# The whole disk is mounted at /data, the same path qBittorrent sees, so a
# finished download needs no path translation. The library under
# /data/media/tv is hard links to the files still seeding in
# /data/torrents, which costs no space and keeps the two independent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls325
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: UMASK, value: "002"}
          ports:
            - {name: http, containerPort: 8989}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /config, subPath: sonarr}
            - {name: hdd-a, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  selector:
    app: sonarr
  ports:
    - {name: http, port: 8989, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [sonarr.home]
  rules:
    - backendRefs:
        - {name: sonarr, port: 8989}
