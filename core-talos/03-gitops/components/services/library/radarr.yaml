# The whole disk is mounted at /data, the same path qBittorrent sees, so a
# finished download needs no path translation. The library under
# /data/media/movies is hard links to the files still seeding in
# /data/torrents, which costs no space and keeps the two independent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls317
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: UMASK, value: "002"}
          ports:
            - {name: http, containerPort: 7878}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /config, subPath: radarr}
            - {name: hdd-a, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
spec:
  selector:
    app: radarr
  ports:
    - {name: http, port: 7878, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [radarr.home]
  rules:
    - backendRefs:
        - {name: radarr, port: 7878}
