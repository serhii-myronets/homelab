apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: library
# One file per application: each keeps its Deployment, Service and route
# together, because the three are independent programs sharing a namespace.
resources:
  - namespace.yaml
  - pvc.yaml
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
components:
  - ../../system/storage/templates/volsync
# All three keep their configuration in one backed-up claim, each under its
# own directory, the way the torrent stack shares a claim with Flood. Their
# databases are SQLite, which the snapshot the mover takes catches whole.
configMapGenerator:
  - name: volsync
    literals: [APP=library, CAPACITY=5Gi]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
