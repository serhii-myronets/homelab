apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: library
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
components:
  - ../../system/storage/templates/volsync
# The claim the three share, each under its own directory. Their databases
# are SQLite, which the snapshot the mover takes catches whole.
configMapGenerator:
  - name: volsync
    literals: [APP=library, CAPACITY=5Gi]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
