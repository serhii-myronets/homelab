# Local names only: these are the stack's own controls, not something to
# publish, so no record is created under serhii.link.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [prowlarr.home]
  rules:
    - backendRefs:
        - {name: prowlarr, port: 9696}
---
apiVersion: gateway.networking.k8s.io/v1
