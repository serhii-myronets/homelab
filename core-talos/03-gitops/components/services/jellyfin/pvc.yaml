apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hdd-a
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: jellyfin-hdd-a
  resources:
    requests:
      storage: 9000Gi
---
# Transcodes and image caches: rebuilt on demand, so never backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm
  resources:
    requests:
      storage: 50Gi
