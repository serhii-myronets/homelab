apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      initContainers:
        # A fresh or restored volume may be root-owned.
        #
        # Jellyfin 12 answers 400 to the X-Emby-Authorization header, which is
        # the only one Jellyseerr sends - its development build included - so
        # nothing it asks for gets through. Jellyfin keeps a switch for the
        # old header; it is off by default and lives in the configuration
        # volume, so it is set here rather than by hand, and a restore from R2
        # cannot quietly turn it back off. Remove this once Jellyseerr sends
        # Authorization, because the switch is for a header already deprecated.
        - name: prepare
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              set -e;
              chown 1000:1000 /config /cache;
              f=/config/config/system.xml;
              if [ -f "$f" ]; then
              sed -i 's|<EnableLegacyAuthorization>false<|<EnableLegacyAuthorization>true<|' "$f";
              fi
          volumeMounts:
            - {name: data, mountPath: /config}
            - {name: cache, mountPath: /cache}
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1.20260915-010956
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - {name: TZ, value: America/Los_Angeles}
          ports:
            - {name: http, containerPort: 8096}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits:
              memory: 3Gi
              # The iGPU, for Quick Sync transcoding.
              gpu.intel.com/i915: "1"
          volumeMounts:
            - {name: data, mountPath: /config}
            - {name: cache, mountPath: /cache}
            # The same /media path as on core, so its library can move over.
            # The files themselves, which the existing library points at:
            # renaming the directory on the disk left these paths untouched.
            - {name: hdd-a, mountPath: /media, subPath: torrents, readOnly: true}
            # The library Radarr and Sonarr build out of hard links to those
            # same files, added as new libraries here. Once everything is
            # imported, the mount above goes and this one stays.
            - {name: hdd-a, mountPath: /library, subPath: media, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: cache
          persistentVolumeClaim: {claimName: cache}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
