apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  # Stopped while core's configuration is copied in.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      initContainers:
        # A fresh or restored volume may be root-owned.
        - name: prepare
          image: busybox:1.37
          command: [sh, -c, "chown 1000:1000 /config /cache"]
          volumeMounts:
            - {name: data, mountPath: /config}
            - {name: cache, mountPath: /cache}
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1.20260915-010956
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - {name: TZ, value: America/Los_Angeles}
          ports:
            - {name: http, containerPort: 8096}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits:
              memory: 3Gi
              # The iGPU, for Quick Sync transcoding.
              gpu.intel.com/i915: "1"
          volumeMounts:
            - {name: data, mountPath: /config}
            - {name: cache, mountPath: /cache}
            # The same /media path as on core, so its library can move over.
            - {name: hdd-a, mountPath: /media, subPath: media, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: cache
          persistentVolumeClaim: {claimName: cache}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
