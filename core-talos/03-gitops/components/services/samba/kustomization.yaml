apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - deployment.yaml
# The generated name carries a content hash, so a config change rolls the pod.
configMapGenerator:
  - name: samba-config
    files:
      - config/smb.conf
      - config/avahi-daemon.conf
      - config/samba.service
