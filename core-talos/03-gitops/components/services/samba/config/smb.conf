[global]
   server role = standalone server
   server string = Beelink
   netbios name = BEELINK
   workgroup = WORKGROUP
   disable netbios = yes
   server min protocol = SMB2_10

   # The pod shares the node's network; serve only the LAN bridge, not the
   # Cilium interfaces.
   interfaces = br0
   bind interfaces only = yes

   log file = /dev/stdout
   log level = 1
   load printers = no
   printcap name = /dev/null

   security = user
   passdb backend = smbpasswd
   map to guest = Bad User
   guest account = media

   unix charset = UTF-8
   dos charset = CP850
   mangled names = no
   ea support = yes
   unix extensions = no
   acl allow execute always = yes

   vfs objects = catia fruit streams_xattr
   fruit:aapl = yes
   fruit:encoding = native
   fruit:metadata = stream
   fruit:resource = file
   # Otherwise macOS resets new directories to 0755 after creating them,
   # locking guests out of them.
   fruit:nfs_aces = no

   # Share defaults: everyone on the LAN may do anything. Files belong to the
   # UID the media applications share and are writable by all.
   guest ok = yes
   guest only = yes
   read only = no
   force user = media
   force group = media
   create mask = 0666
   force create mode = 0666
   directory mask = 0777
   force directory mode = 0777

[torrents]
   path = /data/hdd-a/torrents

[scan]
   path = /data/hdd-b/scan

[hdd-b]
   path = /data/hdd-b
