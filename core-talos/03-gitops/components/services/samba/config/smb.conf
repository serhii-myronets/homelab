[global]
   server role = standalone server
   server string = Beelink
   netbios name = BEELINK
   workgroup = WORKGROUP
   server min protocol = SMB2_10

   # The pod shares the node's network; serve only the LAN bridge, not the
   # Cilium interfaces. NetBIOS stays on for clients that browse with it.
   interfaces = br0
   bind interfaces only = yes

   log file = /dev/stdout
   log level = 1
   load printers = no
   printcap name = /dev/null

   security = user
   passdb backend = smbpasswd
   map to guest = Bad User
   guest account = media

   unix charset = UTF-8
   dos charset = CP850
   mangled names = no
   ea support = yes
   unix extensions = no
   acl allow execute always = yes

   vfs objects = catia fruit streams_xattr
   fruit:aapl = yes
   fruit:encoding = native
   fruit:metadata = stream
   fruit:resource = file
   # Otherwise macOS resets new directories to 0755 after creating them,
   # locking guests out through the group.
   fruit:nfs_aces = no

   # Share defaults: everyone on the LAN may do anything, as UID 1000, the
   # owner the media applications share. Samba matches guests to existing
   # files only through the group, so everything stays group-writable.
   guest ok = yes
   guest only = yes
   read only = no
   force user = media
   force group = media
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775

[torrents]
   path = /data/hdd-a/torrents

[scan]
   path = /data/hdd-b/scan

[hdd-b]
   path = /data/hdd-b
