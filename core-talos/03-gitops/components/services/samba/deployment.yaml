apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      # Bonjour and WS-Discovery announce by multicast, which does not leave
      # the pod network, so Samba answers on the node's own address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Share roots belong to UID 1000, which the media applications share.
        # Guests match these directories only through the group, so it must
        # be able to write.
        - name: prepare
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              mkdir -p /data/hdd-a/torrents /data/hdd-b/scan &&
              chown 1000:1000 /data/hdd-a /data/hdd-a/torrents /data/hdd-b /data/hdd-b/scan &&
              chmod 0775 /data/hdd-a /data/hdd-a/torrents /data/hdd-b /data/hdd-b/scan
          volumeMounts:
            - {name: hdd-a, mountPath: /data/hdd-a}
            - {name: hdd-b, mountPath: /data/hdd-b}
      containers:
        - name: samba
          image: ghcr.io/servercontainers/samba:a3.24.2-s4.23.8-r0
          # Bypasses the image's entrypoint, which builds smb.conf from
          # environment variables; the configuration is mounted instead. Only
          # the image's runit services are reused, without NetBIOS.
          command:
            - sh
            - -c
            - >-
              adduser -D -H -u 1000 -s /bin/false media &&
              rm -rf /container/config/runit/nmbd &&
              sed -i 's#^exec /usr/sbin/wsdd2$#exec /usr/sbin/wsdd2 -i br0#' /container/config/runit/wsdd2/run &&
              mkdir -p /run/samba &&
              exec runsvdir -P /container/config/runit
          securityContext:
            capabilities:
              add: [NET_ADMIN]   # wsdd2
          ports:
            - {name: smb, containerPort: 445}
          readinessProbe:
            tcpSocket: {port: smb}
          livenessProbe:
            tcpSocket: {port: smb}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: hdd-a, mountPath: /data/hdd-a}
            - {name: hdd-b, mountPath: /data/hdd-b}
            - {name: config, mountPath: /etc/samba/smb.conf, subPath: smb.conf}
            - {name: config, mountPath: /etc/avahi/avahi-daemon.conf, subPath: avahi-daemon.conf}
            - {name: config, mountPath: /etc/avahi/services/samba.service, subPath: samba.service}
      volumes:
        - name: config
          configMap: {name: samba-config}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
        - name: hdd-b
          persistentVolumeClaim: {claimName: hdd-b}
