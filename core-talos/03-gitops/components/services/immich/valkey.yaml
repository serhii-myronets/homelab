# The job queue between the server and the machine learning worker. Nothing
# in it outlives a restart by design, so it has no volume and no backup: a
# lost queue means some thumbnails are generated a second time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9
          ports:
            - {name: valkey, containerPort: 6379}
          readinessProbe:
            exec: {command: [sh, -c, "valkey-cli ping | grep -q PONG"]}
          livenessProbe:
            exec: {command: [sh, -c, "valkey-cli ping | grep -q PONG"]}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
