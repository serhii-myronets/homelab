# Local only. Photographs of the household are not something to publish, and
# nothing here is offered under serhii.link.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [immich.home]
  rules:
    - backendRefs:
        - {name: server, port: 2283}
