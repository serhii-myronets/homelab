# The only value this stack needs that cannot live in git. Add it in Infisical
# at /grafana/ADMIN_PASSWORD before the first sync.
#
# Grafana's own chart would otherwise generate a password at render time,
# which Argo re-renders on every sync - the account would change under you.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - {secretKey: password, remoteRef: {key: /grafana/ADMIN_PASSWORD}}
