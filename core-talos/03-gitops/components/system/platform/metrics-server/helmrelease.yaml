apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  driftDetection:
    mode: enabled
  values:
    args:
      - --kubelet-insecure-tls

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
