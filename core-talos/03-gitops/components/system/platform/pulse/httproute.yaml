# Local only. It describes every machine in the house, and the alerting it
# carries is not something to reach through a tunnel.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulse
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [pulse.home]
  rules:
    - backendRefs:
        - {name: pulse, port: 7655}
