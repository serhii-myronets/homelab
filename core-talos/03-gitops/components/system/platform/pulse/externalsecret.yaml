# The agent will not start without this, and it cannot exist before Pulse
# does: the token is minted inside Pulse, by hand, after the administrator
# account is created. Open https://pulse.home, make the account, then
# Settings -> API tokens -> a token scoped kubernetes:report, and put it in
# Infisical at /pulse/AGENT_TOKEN.
#
# Until then the agent pod waits on a missing secret rather than crashing in
# a loop, which is the quieter of the two ways to be unfinished.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: pulse-agent
  data:
    - {secretKey: PULSE_TOKEN, remoteRef: {key: /pulse/AGENT_TOKEN}}
