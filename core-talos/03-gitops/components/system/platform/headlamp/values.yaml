# A console for this cluster: browse objects and read logs. It watches
# nothing and alerts on nothing - that gap is still open, and neither Pulse
# nor the VictoriaMetrics stack closed it either, both now under
# 03-gitops/archive.
#
# Nothing is stored: no claim, no database, no CRDs. Losing the pod loses a
# session and nothing else.

# The chart ships no resources. It is a Go binary serving a static frontend,
# so this is generous rather than tight.
resources:
  requests: {cpu: 25m, memory: 96Mi}
  limits: {memory: 256Mi}

config:
  inCluster: true
  inClusterContextName: main
  # No sign-in: every visitor is handed the service account below. What
  # that is worth is decided entirely by the role it is bound to, which is
  # why the binding underneath is not the chart's default.
  unsafeUseServiceAccountToken: true
  sessionTTL: 86400

# view, not cluster-admin. With no sign-in in front of it, this role is the
# only thing standing between a visitor and the cluster, and headlamp.home
# answers anyone on the LAN with no gate at all - the same network where a
# television reaches Jellyfin over plain HTTP.
#
# view reads every object and every log, and cannot change one. It also
# cannot read Secrets, which the built-in role excludes on purpose: half
# the secrets here came out of Infisical.
#
# Editing from this page means either putting the sign-in back or widening
# this to edit or cluster-admin. Both are one line, and both should be a
# decision rather than a default.
clusterRoleBinding:
  create: true
  clusterRoleName: view
