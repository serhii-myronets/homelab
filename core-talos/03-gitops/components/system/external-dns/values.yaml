provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef: {name: cloudflare-api-token, key: CF_API_TOKEN}

# Records come from HTTPRoutes only. The Gateway carries the tunnel as its
# target, and only names under serhii.link are published; any other name on
# the same Gateway stays on the LAN.
sources:
  - gateway-httproute
domainFilters:
  - serhii.link
extraArgs:
  - --cloudflare-proxied

# Each cluster owns only the records it created, so core's tunnel records and
# a future Proxmox cluster are left alone.
registry: txt
txtOwnerId: beelink
policy: sync

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
