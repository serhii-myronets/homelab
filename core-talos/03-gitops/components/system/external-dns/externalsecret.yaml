apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: cloudflare-api-token
  data:
    - secretKey: CF_API_TOKEN
      remoteRef: {key: /cloudflare/beelink/API_TOKEN}
