apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
spec:
  description: Cluster-wide services and configuration for the Beelink cluster.
  sourceRepos:
    - https://github.com/serhii-myronets/homelab.git
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://openebs.github.io/openebs
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
spec:
  description: Service workloads for the Beelink cluster.
  sourceRepos:
    - https://github.com/serhii-myronets/homelab.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  # Namespaces, PVs and other cluster-scoped objects belong to system components.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
