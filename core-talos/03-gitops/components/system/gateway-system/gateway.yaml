apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: gateway-system
  annotations:
    # external-dns points public names at the Beelink tunnel, not at the
    # Gateway's LAN address.
    external-dns.alpha.kubernetes.io/target: 2150274f-5bd6-4826-b46f-16992d9f8293.cfargotunnel.com
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
