apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    # The chart owns its CRDs, so they upgrade with it.
    crds:
      enabled: true

    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
    webhook:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    cainjector:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
