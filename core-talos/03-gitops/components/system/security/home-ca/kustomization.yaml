apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuer.yaml
  - certificate.yaml
  - ca-server.yaml
configMapGenerator:
  # The only resource in this directory without a namespace of its own. Argo
  # CD supplied one from the Application; Flux applies what the build says.
  - name: ca-server
    namespace: cert-manager
    files:
      - web/index.html
      - nginx.conf=web/nginx.conf
    options:
      disableNameSuffixHash: true
