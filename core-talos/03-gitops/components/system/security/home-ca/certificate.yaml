# One certificate for every local name, presented by the Gateway.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-wildcard
  namespace: gateway-system
spec:
  secretName: home-tls
  issuerRef:
    kind: ClusterIssuer
    name: home-ca
  # Not a wildcard: Apple and Chrome refuse "*.home", because a wildcard
  # directly under a top-level name covers too much. Every local name a
  # service answers on has to be listed here.
  commonName: home
  dnsNames:
    - home
    - argocd.home
    - ca.home
    - headlamp.home
    - jellyfin.home
    - immich.home
    - jellyseerr.home
    - prowlarr.home
    - radarr.home
    - sonarr.home
    - torrent.home
  duration: 8760h
  renewBefore: 720h
  # Apple platforms reject a server certificate without serverAuth.
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: ECDSA
    size: 256
