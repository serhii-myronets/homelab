# The certificate authority Caddy created on core. Reusing it means every
# device that already trusts *.home keeps working after the move.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-ca
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: home-ca
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - {secretKey: crt, remoteRef: {key: /ca/home/tls.crt}}
    - {secretKey: key, remoteRef: {key: /ca/home/tls.key}}
