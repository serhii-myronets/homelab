# Argo CD is installed by Helmfile, but its local name belongs with the
# Gateway; the route has to sit beside the service it points at.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames:
    - argocd.home
    - argocd.serhii.link
  rules:
    - backendRefs:
        - {name: argocd-server, port: 80}
