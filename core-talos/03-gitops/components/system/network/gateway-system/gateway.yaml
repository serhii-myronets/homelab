apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: gateway-system
  annotations:
    # external-dns points public names at the Beelink tunnel, not at the
    # Gateway's LAN address.
    external-dns.kubernetes.io/target: 2150274f-5bd6-4826-b46f-16992d9f8293.cfargotunnel.com
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Local names, with the certificate authority core's Caddy created.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.home"
      tls:
        certificateRefs:
          - {name: home-tls}
      allowedRoutes:
        namespaces:
          from: All
