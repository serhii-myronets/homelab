apiVersion: v1
kind: PersistentVolume
metadata:
  name: samba-hdd-a
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 9000Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  claimRef:
    namespace: samba
    name: hdd-a
  local:
    path: /var/mnt/hdd-a
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab/media-hdd
              operator: In
              values:
                - "true"
