openebs-crds:
  csi:
    volumeSnapshots:
      enabled: false

# LVM LocalPV only; its StorageClass and VolumeSnapshotClass are declared
# beside this file, after the thin pool exists. The snapshot CRDs come from
# the snapshot-controller component.
lvm-localpv:
  crds:
    csi:
      volumeSnapshots:
        enabled: false

localpv-provisioner:
  enabled: false

engines:
  local:
    hostpath:
      enabled: false
    lvm:
      enabled: true
    rawfile:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: false

alloy:
  enabled: false

loki:
  enabled: false

preUpgradeHook:
  enabled: false
