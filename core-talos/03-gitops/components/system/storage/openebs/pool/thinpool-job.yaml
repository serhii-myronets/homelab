# The Talos provider still speaks the v1.13 configuration contract, which has
# no LVMVolumeGroupConfig, so the WD NVMe becomes a volume group here instead.
# OpenEBS would also size a missing thin pool to the first claim and share it
# with every later one, so the pool is created once, over nearly the whole
# group; the rest stays free for its metadata.
#
# Every step is skipped when it is already done, and nothing here erases a
# disk: on a disk that still holds partitions, pvcreate fails and the job
# retries until the disk is wiped by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: nvme-thinpool
  namespace: openebs
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: lvm
          image: docker.io/openebs/lvm-driver:1.10.1
          command:
            - sh
            - -c
            # No `set -e`: each step tests for its own result, and the shell
            # would exit on the first check that finds nothing yet.
            - >-
              DISK=/dev/disk/by-id/nvme-eui.e8238fa6bf530001001b444a46596260;
              vgs nvme || { pvs "$DISK" || pvcreate "$DISK"; vgcreate nvme "$DISK"; };
              lvs nvme/nvme_thinpool ||
              lvcreate --type thin-pool --extents 95%FREE --name nvme_thinpool nvme;
              vgs nvme; lvs nvme
          env:
            # No udev inside the container.
            - {name: DM_DISABLE_UDEV, value: "1"}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: dev, mountPath: /dev}
      volumes:
        - name: dev
          hostPath: {path: /dev}
