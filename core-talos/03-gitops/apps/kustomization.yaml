# Everything this cluster runs, in one list.
#
# The root Kustomization reconciles this directory. Without this file it would
# scan the tree and apply every manifest it found, including the ones inside
# each app/ - which belong to that app's own Kustomization, not to the root.
# Naming the ks.yaml files explicitly keeps the root applying pointers and
# nothing else, and gives one place to read what is installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-repositories.yaml

  - services/immich/ks.yaml
  - services/jellyfin/ks.yaml
  - services/library/ks.yaml
  - services/paperless/ks.yaml
  - services/samba/ks.yaml
  - services/torrent/ks.yaml
  - services/uptime-kuma/ks.yaml
  - services/vaultwarden/ks.yaml

  - system/network/cloudflared/ks.yaml
  - system/network/external-dns/ks.yaml
  - system/network/gateway-system/ks.yaml

  # Three that need no directory of their own: two are HelmReleases with no
  # manifests beside them, the third carries its own upstream source.
  - system/platform/intel-gpu.yaml
  - system/platform/metrics-server.yaml
  - system/platform/headlamp/ks.yaml

  - system/security/cert-manager/ks.yaml
  - system/security/external-secrets/ks.yaml
  - system/security/home-ca/ks.yaml

  - system/storage/openebs/ks.yaml
  - system/storage/snapshot-controller.yaml
  - system/storage/volsync/ks.yaml
  - system/storage/volumes/ks.yaml
