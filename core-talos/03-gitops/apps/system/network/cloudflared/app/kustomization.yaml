apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflared
resources:
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
# The generated name carries a content hash, so a config change rolls the pods.
configMapGenerator:
  - name: cloudflared-config
    files:
      - config.yaml
