apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: gateway-system
  annotations:
    # external-dns points public names at the Beelink tunnel, not at the
    # Gateway's LAN address.
    external-dns.kubernetes.io/target: 2150274f-5bd6-4826-b46f-16992d9f8293.cfargotunnel.com
spec:
  gatewayClassName: cilium
  listeners:
    # cloudflared speaks plain HTTP to the Gateway, so public names have to
    # be served without TLS here; Cloudflare holds the certificate at its
    # edge. Naming the listener keeps local names off it.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.serhii.link"
      allowedRoutes:
        namespaces:
          from: All
    # Local names typed without a scheme land here and are sent to HTTPS.
    # Only this namespace may attach, so a service route cannot take a name
    # off the redirect by matching its hostname exactly.
    - name: http-home
      protocol: HTTP
      port: 80
      hostname: "*.home"
      allowedRoutes:
        namespaces:
          from: Same
    # The exception: a device fetching the root certificate does not trust
    # it yet, so this one name stays reachable without TLS.
    - name: http-ca
      protocol: HTTP
      port: 80
      hostname: ca.home
      allowedRoutes:
        namespaces:
          from: All
    # The second exception, and a different kind. A television cannot be
    # taught to trust the home authority - its trust store is not ours to
    # write to - so it can neither follow the redirect above nor accept
    # what waits at the other end. This is a separate name rather than an
    # exemption for jellyfin.home, so every device that can do TLS still
    # does. It is deliberately absent from the certificate: tv.home is
    # plain HTTP and nothing else.
    - name: http-tv
      protocol: HTTP
      port: 80
      hostname: tv.home
      allowedRoutes:
        namespaces:
          from: All
    # Local names, with a certificate from cert-manager's home-ca authority.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.home"
      tls:
        certificateRefs:
          - {name: home-tls}
      allowedRoutes:
        namespaces:
          from: All
