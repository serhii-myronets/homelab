apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/apps/system/security/cert-manager/app
  prune: true
  wait: true
  timeout: 5m
