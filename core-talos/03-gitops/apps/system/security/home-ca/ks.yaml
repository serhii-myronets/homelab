apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-ca
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/apps/system/security/home-ca/app
  prune: true
  dependsOn:
  - name: cert-manager
