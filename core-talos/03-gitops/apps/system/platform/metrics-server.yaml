# No namespace, no route, no manifests of its own - only a chart and its
# values. A component directory and a Flux Kustomization to reconcile it would
# both be empty ceremony, so the HelmRelease sits here and the root
# Kustomization applies it directly. helm-controller does the rest.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    args:
      - --kubelet-insecure-tls

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
