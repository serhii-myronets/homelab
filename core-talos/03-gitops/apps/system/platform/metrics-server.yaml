apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/components/system/platform/metrics-server
  # Temporarily off: this Kustomization is about to be removed from Git, and
  # deleting one garbage-collects its inventory - which is the HelmRelease,
  # and deleting that uninstalls the release. The HelmRelease moves to apps/
  # in the next commit; this one only makes the removal safe.
  prune: false
  wait: true
  timeout: 5m
