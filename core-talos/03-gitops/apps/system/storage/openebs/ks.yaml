apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/apps/system/storage/openebs/app
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-classes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/apps/system/storage/openebs/classes
  prune: true
  wait: true
  timeout: 5m
  # openebs is enough: it waits for its own HelmRelease, and that waits for
  # the snapshot controller, so the CRDs exist by the time this applies a
  # VolumeSnapshotClass.
  dependsOn:
  - name: openebs
