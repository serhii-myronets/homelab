# This one keeps its component directory and its Kustomization, unlike
# metrics-server beside it, and the reason is `dependsOn`: openebs and
# openebs-classes wait on it so the snapshot CRDs exist before a
# VolumeSnapshotClass is applied. A Kustomization can only depend on another
# Kustomization, never on a bare HelmRelease, so collapsing this one would
# take the ordering with it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/apps/system/storage/snapshot-controller/app
  prune: true
  wait: true
  timeout: 5m
