apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-backup
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./core-talos/03-gitops/apps/system/storage/etcd-backup/app
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
  - name: external-secrets-config
