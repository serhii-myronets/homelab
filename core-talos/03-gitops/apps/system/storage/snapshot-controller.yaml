# A cluster takes exactly one of these: the cluster-wide snapshot controller,
# which turns a VolumeSnapshot into a VolumeSnapshotContent. The per-driver
# half - the csi-snapshotter sidecar that makes the actual LVM snapshot -
# belongs to OpenEBS and is enabled there.
#
# It owns the snapshot CRDs, and openebs waits for it through the HelmRelease
# below rather than through a Kustomization, which is why this needs no
# directory of its own.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: snapshot-controller
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    # The VolumeSnapshot CRDs and their controller, which the CSI drivers and
    # VolSync rely on. Snapshot classes belong to the storage that offers them.
    installCRDs: true
    # Deleting the CRDs would delete every VolumeSnapshot with them.
    keepCRDs: true

    controller:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
