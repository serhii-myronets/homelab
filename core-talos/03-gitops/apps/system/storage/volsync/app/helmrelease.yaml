apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 30m
  chart:
    spec:
      chart: volsync
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: volsync
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    manageCRDs: true

    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
