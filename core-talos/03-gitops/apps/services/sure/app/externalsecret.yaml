# The database password and Rails secret encrypt the stored bank-provider
# credentials. They were generated once in Infisical; changing either after
# the first start would respectively lock out Postgres or its encrypted data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: sure
  data:
    - {secretKey: DB_PASSWORD, remoteRef: {key: /sure/DB_PASSWORD}}
    - {secretKey: SECRET_KEY_BASE, remoteRef: {key: /sure/SECRET_KEY_BASE}}
