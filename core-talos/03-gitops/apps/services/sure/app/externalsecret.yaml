# The database password, Rails secret and Active Record keys protect stored
# bank-provider credentials. They were generated once in Infisical; replacing
# any of them after accounts exist can make encrypted data unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: sure
  data:
    - {secretKey: DB_PASSWORD, remoteRef: {key: /sure/DB_PASSWORD}}
    - {secretKey: SECRET_KEY_BASE, remoteRef: {key: /sure/SECRET_KEY_BASE}}
    - {secretKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, remoteRef: {key: /sure/ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}}
    - {secretKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, remoteRef: {key: /sure/ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}}
    - {secretKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, remoteRef: {key: /sure/ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}}
    # The production secret, not the sandbox one: a Trial plan speaks the
    # production API, and the sandbox secret answers with invented accounts.
    - {secretKey: PLAID_CLIENT_ID, remoteRef: {key: /sure/PLAID_CLIENT_ID}}
    - {secretKey: PLAID_SECRET, remoteRef: {key: /sure/PLAID_SECRET}}
    # Market data. Yahoo Finance needs no key and is enabled beside it, but it
    # rate-limits a single ticker on a single request, so it cannot be the only
    # source. This key also serves exchange rates, which already name
    # twelve_data as their provider.
    - {secretKey: TWELVE_DATA_API_KEY, remoteRef: {key: /sure/TWELVE_DATA_API_KEY}}
