apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sure
resources:
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
  - httproute.yaml
components:
  - ../../../../components/backed-up-volume
# Separate the database snapshot from the other hourly VolSync jobs.
configMapGenerator:
  - name: backed-up-volume
    literals: [APP=sure, CAPACITY=5Gi, MINUTE=40]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
