apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellyfin
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
components:
  - ../../../../components/volsync
# The data claim from the VolSync component: backed up hourly to R2 and, on an
# empty cluster, restored from it.
configMapGenerator:
  - name: volsync
    literals: [APP=jellyfin, CAPACITY=10Gi, MINUTE=20]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
