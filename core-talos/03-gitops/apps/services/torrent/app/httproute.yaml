# One name for one interface. Flood held torrent.* and qBittorrent held
# qbittorrent.*, which was two addresses for the same job; Flood went on
# 2026-09-20 and qBittorrent took the shorter name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [torrent.home, torrent.serhii.link]
  rules:
    - backendRefs:
        - {name: torrent, port: 8080}
