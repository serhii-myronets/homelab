[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=/config/qBittorrent/logs

[BitTorrent]
Session\AddTorrentStopped=false
Session\DefaultSavePath=/downloads/
# Without this, a category's save path is decoration: qBittorrent accepts the
# category Sonarr and Radarr set but still writes to the default path, and the
# downloads they hand over land on top of the library instead of in their own
# directories. The names are inverted - false means automatic management is on.
Session\DisableAutoTMMByDefault=false
Session\DisableAutoTMMTriggers\CategorySavePathChanged=false
# Bound to the tunnel so a torrent can never speak over the LAN interface.
# The name is gluetun's VPN_INTERFACE, which is tun0 whatever the protocol -
# it did not become wg0 when the tunnel moved to WireGuard. Getting this
# wrong costs nothing visible: qBittorrent starts, reports no error, and
# connects to no one, with every torrent stalled at zero peers.
Session\Interface=tun0
Session\InterfaceName=tun0
Session\Port=6881
Session\QueueingSystemEnabled=true
# A torrent that has found no one to talk to still holds a download slot, so
# two dead releases can leave a queue standing while one thing downloads.
# Below two KiB/s for a minute and it stops counting, and the queue moves.
Session\IgnoreSlowTorrentsForQueueing=true
Session\SlowTorrentsDownloadRate=2
Session\SlowTorrentsUploadRate=2
Session\SlowTorrentsInactivityTimer=60
# The ceiling is not the CPU but the staging volume, now 200 GiB: a season
# pack runs 10-20 GiB and holds its space in /incomplete until it is
# complete, so six at once needs about 120 GiB in the worst case. Raise
# these only together with the cache claim in pvc.yaml.
Session\MaxActiveDownloads=6
Session\MaxActiveTorrents=10
Session\MaxActiveUploads=6
Session\SSL\Port=62002
# When a torrent has given back twice what it took, or seeded a fortnight,
# whichever comes first, qBittorrent stops it. Stopping, not deleting: that
# tells Sonarr and Radarr the seeding is done, and they remove the torrent
# with its file only if they managed to import it. The library keeps a hard
# link to the same data, so nothing is lost and no orphan is left behind.
Session\GlobalMaxRatio=2
Session\GlobalMaxSeedingMinutes=20160
Session\ShareLimitAction=Stop
# Download to the SSD claim first. qBittorrent copies completed files to the
# HDD save path itself, so only unfinished data occupies this volume.
Session\TempPath=/incomplete/
Session\TempPathEnabled=true
# Avoid charging the pod for Linux's HDD page cache; the SSD staging volume
# absorbs active download I/O instead.
Session\DiskIOReadMode=DisableOSCache
Session\DiskIOWriteMode=DisableOSCache

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Preferences]
Connection\PortRangeMin=6881
Connection\UPnP=false
Downloads\SavePath=/downloads/
Downloads\TempPath=/incomplete/
Downloads\TempPathEnabled=true
General\Locale=en
WebUI\Address=*
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=127.0.0.1/32, 192.168.8.0/24, 10.244.0.0/16
WebUI\ServerDomains=*
