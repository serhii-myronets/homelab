# The only value this stack needs that cannot live in git. Add it in Infisical
# at /immich/DB_PASSWORD before the first sync: Postgres initialises its data
# directory once, with whatever password it is given, and changing it later
# means changing it inside the database too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: immich-db
  data:
    - {secretKey: DB_PASSWORD, remoteRef: {key: /immich/DB_PASSWORD}}
