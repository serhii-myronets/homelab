# Two values that cannot live in git. Add both in Infisical before the first
# sync, under /paperless:
#
#   DB_PASSWORD  anything; Postgres writes it into the data directory on the
#                first start and changing it later means changing it inside
#                the database too.
#   SECRET_KEY   signs sessions and password-reset links. Generate with
#                `python3 -c "import secrets; print(secrets.token_urlsafe(64))"`.
#                Replacing it later logs everyone out; it is not recoverable
#                from the database, so it belongs in Infisical and nowhere
#                else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-cloud
  target:
    name: paperless
  data:
    - {secretKey: DB_PASSWORD, remoteRef: {key: /paperless/DB_PASSWORD}}
    - {secretKey: SECRET_KEY, remoteRef: {key: /paperless/SECRET_KEY}}
