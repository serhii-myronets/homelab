apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: actual
resources:
  - namespace.yaml
  - deployment.yaml
  - httproute.yaml
components:
  - ../../../../components/backed-up-volume
# Budget data and account metadata are small, but not recreatable. Keep this
# hourly copy separate from the other VolSync jobs.
configMapGenerator:
  - name: backed-up-volume
    literals: [APP=actual, CAPACITY=2Gi, MINUTE=45]
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
