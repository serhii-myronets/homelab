# Local only: monitoring history describes the home network and there is no
# reason to publish it. A future external observer should be independent of
# this cluster, rather than another name routed through the same Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
spec:
  parentRefs:
    - {name: main-gateway, namespace: gateway-system}
  hostnames: [kuma.home]
  rules:
    - backendRefs:
        - {name: uptime-kuma, port: 3001}
