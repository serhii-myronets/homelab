# All four in one pod, the way the torrent stack holds qBittorrent and
# Flood: they share one backed-up claim, each under its own directory, and
# the OpenEBS LVM driver refuses to mount one logical volume into a second
# pod even on the same node. They are also started and stopped together in
# practice, so the shared restart costs little.
#
# None of the four is published, so each is open on the LAN exactly as
# qBittorrent is; the AUTH variables say so rather than leaving the first
# visitor to answer the setup dialog, which a configuration restored from R2
# would ask again. Jellyseerr is the exception: it signs people in with
# their Jellyfin account, because it is the one meant to be handed to
# someone other than the owner.
#
# Sonarr and Radarr see the whole disk at /data, the same path qBittorrent
# sees, so a finished download needs no translation between them. The
# library under /data/media is hard links to the files still seeding in
# /data/torrents: no extra space, and organising one cannot break the other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: library
  template:
    metadata:
      labels:
        app: library
    spec:
      initContainers:
        # Four directories the stack names but nothing else creates: the two
        # roots its library is built in, which Sonarr and Radarr refuse to
        # accept unless they already exist, and the two qBittorrent
        # categories they hand their grabs to, which qBittorrent would make
        # only on the first download - until then each reports the path as
        # missing. Owned by the UID every media application shares.
        - name: prepare
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              set -e;
              for d in /data/media/movies /data/media/tv
              /data/torrents/radarr /data/torrents/sonarr;
              do mkdir -p "$d"; chown 1000:1000 "$d"; chmod 0775 "$d"; done;
              chown 1000:1000 /config
          volumeMounts:
            - {name: hdd-a, mountPath: /data}
            # Kubelet creates a missing subPath directory owned by root. The
            # three below are linuxserver images, which chown their own
            # /config before dropping to PUID; Seerr does not, so its
            # directory is handed over here. The subPath keeps the name the
            # service was first deployed under - it is a directory on disk
            # holding the configuration and the SQLite database, and renaming
            # it would hand Seerr an empty one and lose every request, user
            # and setting.
            - {name: data, mountPath: /config, subPath: jellyseerr}
      containers:
        # The indexer manager: it holds the tracker definitions and pushes
        # them to the two below, which then store none of their own.
        - name: prowlarr
          image: ghcr.io/linuxserver/prowlarr:2.6.5.5623-ls161
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: UMASK, value: "002"}
            - {name: PROWLARR__AUTH__METHOD, value: External}
            - {name: PROWLARR__AUTH__REQUIRED, value: DisabledForLocalAddresses}
          ports:
            - {name: prowlarr, containerPort: 9696}
          startupProbe:
            httpGet: {path: /ping, port: prowlarr}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: prowlarr}
          livenessProbe:
            httpGet: {path: /ping, port: prowlarr}
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /config, subPath: prowlarr}
        - name: sonarr
          image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls325
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: UMASK, value: "002"}
            - {name: SONARR__AUTH__METHOD, value: External}
            - {name: SONARR__AUTH__REQUIRED, value: DisabledForLocalAddresses}
          ports:
            - {name: sonarr, containerPort: 8989}
          startupProbe:
            httpGet: {path: /ping, port: sonarr}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: sonarr}
          livenessProbe:
            httpGet: {path: /ping, port: sonarr}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /config, subPath: sonarr}
            - {name: hdd-a, mountPath: /data}
        - name: radarr
          image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls317
          env:
            - {name: TZ, value: America/Los_Angeles}
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: UMASK, value: "002"}
            - {name: RADARR__AUTH__METHOD, value: External}
            - {name: RADARR__AUTH__REQUIRED, value: DisabledForLocalAddresses}
          ports:
            - {name: radarr, containerPort: 7878}
          startupProbe:
            httpGet: {path: /ping, port: radarr}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: radarr}
          livenessProbe:
            httpGet: {path: /ping, port: radarr}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /config, subPath: radarr}
            - {name: hdd-a, mountPath: /data}
        # One search box in front of the two above: it works out whether a
        # title is a film or a series and hands it to Radarr or Sonarr, so
        # neither has to be opened to ask for something. Viewers sign in
        # with their Jellyfin account and each carries its own default
        # quality profile, which is how one household asks in two languages.
        # The project renamed itself from Jellyseerr to Seerr and moved to
        # seerr-team/seerr; ghcr.io/fallenbagel/jellyseerr stops at 2.7.3 and
        # takes no more releases, so that tag reads current and is not. The
        # local name followed on 2026-09-22 and is seerr.home; only the
        # subPath above still says jellyseerr, because that one is data.
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.4.1
          env:
            - {name: TZ, value: America/Los_Angeles}
            # Node would otherwise look for a home directory this uid cannot
            # write. Its caches go beside the configuration instead.
            - {name: HOME, value: /app/config}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - {name: seerr, containerPort: 5055}
          startupProbe:
            httpGet: {path: /api/v1/status, port: seerr}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/v1/status, port: seerr}
          livenessProbe:
            httpGet: {path: /api/v1/status, port: seerr}
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /app/config, subPath: jellyseerr}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: hdd-a
          persistentVolumeClaim: {claimName: hdd-a}
