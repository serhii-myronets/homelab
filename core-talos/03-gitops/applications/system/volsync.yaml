apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: system
  sources:
    - repoURL: https://backube.github.io/helm-charts/
      chart: volsync
      targetRevision: 0.16.0
      helm:
        valueFiles:
          - $values/core-talos/03-gitops/components/system/volsync/values.yaml
    # Supplies the values file and, as manifests, only the namespace.
    - repoURL: https://github.com/serhii-myronets/homelab.git
      targetRevision: main
      ref: values
      path: core-talos/03-gitops/components/system/volsync
      directory:
        include: namespace.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: volsync-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
