apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: system
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.45.0
      helm:
        valueFiles:
          - $values/core-talos/03-gitops/components/system/platform/headlamp/values.yaml
    # Supplies the values file and, as manifests, the namespace and the route.
    - repoURL: https://github.com/serhii-myronets/homelab.git
      targetRevision: main
      ref: values
      path: core-talos/03-gitops/components/system/platform/headlamp
      directory:
        include: "{namespace.yaml,httproute.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
