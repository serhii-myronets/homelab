apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-project
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/serhii-myronets/homelab.git
    targetRevision: main
    path: core-talos/03-gitops/components/system/project
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
