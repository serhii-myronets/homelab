# Created before the Applications that use it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Cluster-wide services and configuration for the Beelink cluster.
  sourceRepos:
    - https://github.com/serhii-myronets/homelab.git
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://openebs.github.io/openebs
    - https://kubernetes-sigs.github.io/external-dns/
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
