# Created before the Applications that use it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Cluster-wide services and configuration for the Beelink cluster.
  sourceRepos:
    - https://github.com/serhii-myronets/homelab.git
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://openebs.github.io/openebs
    - https://kubernetes-sigs.github.io/external-dns/
    - https://charts.jetstack.io
    - https://piraeus.io/helm-charts/
    - https://backube.github.io/helm-charts/
    # Kept for what sits in archive/: the entry has to exist before the
    # Application that needs it can sync again.
    - https://victoriametrics.github.io/helm-charts/
    - https://cloudnative-pg.github.io/charts
    - https://rcourtman.github.io/Pulse
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
