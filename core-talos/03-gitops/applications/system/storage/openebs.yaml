apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: system
  sources:
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: 4.6.0
      helm:
        valueFiles:
          - $values/core-talos/03-gitops/components/system/storage/openebs/values.yaml
    # Supplies the values file and, as manifests, only the namespace.
    - repoURL: https://github.com/serhii-myronets/homelab.git
      targetRevision: main
      ref: values
      path: core-talos/03-gitops/components/system/storage/openebs
      directory:
        include: namespace.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
