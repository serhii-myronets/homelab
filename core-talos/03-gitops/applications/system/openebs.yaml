apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: system
  sources:
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: 4.6.0
      helm:
        valueFiles:
          - $values/core-talos/03-gitops/components/system/openebs/values.yaml
    - repoURL: https://github.com/serhii-myronets/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # The provisioner creates each PVC directory with a privileged helper pod
    # in this namespace, which the baseline Pod Security level rejects.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
