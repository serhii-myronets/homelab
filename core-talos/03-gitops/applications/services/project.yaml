# Created before the Applications that use it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Service workloads for the Beelink cluster.
  sourceRepos:
    - https://github.com/serhii-myronets/homelab.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  # A service creates its own namespace; PVs and other cluster-scoped objects
  # belong to system components.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
