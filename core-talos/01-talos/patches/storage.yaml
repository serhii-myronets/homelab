# The whole WD NVMe is an LVM volume group. OpenEBS LVM LocalPV carves a thin
# logical volume per claim, with a hard size and snapshots VolSync can restore
# from; Talos owns only the group, never the volumes inside it.
apiVersion: v1alpha1
kind: LVMVolumeGroupConfig
name: nvme
provisioning:
  volumeSelector:
    match: disk.serial == "204390442013"
---
# The two HDDs report no serial through Talos, so they are selected by WWID.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-a
provisioning:
  diskSelector:
    match: disk.wwid == "naa.5000c500c754eee9"
  minSize: 10TB
  maxSize: 10TB
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd-b
provisioning:
  diskSelector:
    match: disk.wwid == "naa.5000c500c7482270"
  minSize: 10TB
  maxSize: 10TB
filesystem:
  type: xfs
---
machine:
  # Thin logical volumes, which the NVMe volume group's claims use.
  kernel:
    modules:
      - name: dm_thin_pool
  # The generated hostname does not survive a reinstall; local PVs select this.
  nodeLabels:
    homelab/media-hdd: "true"
  kubelet:
    extraMounts:
      - source: /var/mnt/hdd-a
        destination: /var/mnt/hdd-a
        type: bind
        options:
          - bind
          - rshared
          - rw
      - source: /var/mnt/hdd-b
        destination: /var/mnt/hdd-b
        type: bind
        options:
          - bind
          - rshared
          - rw
