apiVersion: v1alpha1
kind: BridgeConfig
name: br0
hardwareAddr: 78:55:36:08:cd:fe
links:
  - enp3s0
  - enp2s0
stp:
  enabled: true
up: true
# Static, not DHCP: a router reset once dropped the reservation and the node
# came back on another address. See docs/decisions/0028.
addresses:
  - address: 192.168.8.10/24
routes:
  - gateway: 192.168.8.1
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.8.1
