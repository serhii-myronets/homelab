repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: cilium
    url: https://helm.cilium.io
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: fluxcd-community
    url: https://fluxcd-community.github.io/helm-charts

hooks:
  - events: [ "prepare" ]
    showlogs: true
    command: "kubectl"
    args: [ "apply", "-k", "./prepare-hook/", "--server-side" ]

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.2
    values:
      - values/cilium-values.yaml

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 2.10.0
    needs:
      - kube-system/cilium
    values:
      - values/external-secrets-values.yaml

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.9.2
    needs:
      - external-secrets/external-secrets
    values:
      - values/argocd-values.yaml

  # Installed alongside Argo CD while 03-gitops moves across, one Application
  # at a time. Only one of the two may own an object; the Argo release goes
  # once nothing is left pointing at it.
  - name: flux
    namespace: flux-system
    chart: fluxcd-community/flux2
    version: 2.19.1
    needs:
      - external-secrets/external-secrets
    values:
      - values/flux-values.yaml
