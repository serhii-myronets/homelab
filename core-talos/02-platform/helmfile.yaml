repositories:
  - name: cilium
    url: https://helm.cilium.io
  - name: external-secrets
    url: https://charts.external-secrets.io

hooks:
  - events: [ "prepare" ]
    showlogs: true
    command: "kubectl"
    args: [ "apply", "-k", "./prepare-hook/", "--server-side" ]

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.2
    values:
      - values/cilium-values.yaml

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 2.10.0
    needs:
      - kube-system/cilium
    values:
      - values/external-secrets-values.yaml

  # The operator installs and sizes the Flux controllers itself, from the
  # FluxInstance in flux-instance.yaml; this release is only the operator. It
  # replaced the community flux2 chart on 2026-09-22 - see decisions/0021.
  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.60.0
    needs:
      - external-secrets/external-secrets
    values:
      - values/flux-operator-values.yaml
