configs:
  # Compare desired and live objects through the API server, so fields it
  # defaults (such as an HTTPRoute's path match and backend weight) do not
  # leave Applications permanently OutOfSync.
  params:
    controller.diff.server.side: "true"
  cm:
    kustomize.buildOptions: "--enable-helm"
    users.anonymous.enabled: "true"
  rbac:
    policy.default: role:admin
server:
  extraArgs:
    - --insecure

# Disable Dex if you don't need external Auth (OIDC/SAML)
dex:
  enabled: false

# Disable Notifications controller to save RAM
notifications:
  enabled: false

# ApplicationSet controller - can be disabled if not using generator patterns
applicationSet:
  replicas: 0
