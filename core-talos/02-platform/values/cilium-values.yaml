# =========================
# CORE
# =========================

kubeProxyReplacement: true

ipam:
  mode: kubernetes

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# =========================
# PLATFORM FEATURES
# =========================

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

envoy:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# =========================
# LOAD BALANCER
# =========================

l2announcements:
  enabled: true

# Talos exposes the LAN through this bridge, so auto-detection has no physical
# default route to select for direct routing.
devices: br0

nodePort:
  directRoutingDevice: br0

# With iptables masquerading, replies from a local NodePort or LoadBalancer
# backend are masqueraded before BPF can restore the service port, so clients
# receive data from the pod's port and reset the connection.
bpf:
  masquerade: true

operator:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}

# =========================
# RESOURCES
# =========================

# The chart sets no resources, which made every Cilium pod BestEffort - the
# first thing Talos's OOM controller kills when the node runs short of memory.
# On 2026-09-26 an Immich import did exactly that to Envoy and the operator,
# 35 kills in five minutes, and every Gateway route went down. Requests
# guarantee a CPU share under contention; there is no CPU limit, which would
# throttle the network. Memory limits sit far above use only so that every
# container - init containers too - has one: that controller scores such a
# pod zero and never picks it. The envoy and operator settings sit with their
# own sections above. See traps.yaml.
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
initResources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 512Mi}
