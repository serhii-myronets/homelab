# =========================
# CORE
# =========================

kubeProxyReplacement: true

ipam:
  mode: kubernetes

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# =========================
# PLATFORM FEATURES
# =========================

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

envoy:
  enabled: true

# =========================
# LOAD BALANCER
# =========================

l2announcements:
  enabled: true

# Talos exposes the LAN through this bridge, so auto-detection has no physical
# default route to select for direct routing.
devices: br0

nodePort:
  directRoutingDevice: br0

# With iptables masquerading, replies from a local NodePort or LoadBalancer
# backend are masqueraded before BPF can restore the service port, so clients
# receive data from the pod's port and reset the connection.
bpf:
  masquerade: true

operator:
  replicas: 1
