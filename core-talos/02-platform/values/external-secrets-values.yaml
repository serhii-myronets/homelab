# The controller reconciles ExternalSecret and SecretStore resources.
# Conversion is disabled, so it does not need an admission webhook or its
# certificate controller.
webhook:
  create: false

certController:
  create: false

# The chart owns CRDs so its controller and API definitions stay in sync.
installCRDs: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
