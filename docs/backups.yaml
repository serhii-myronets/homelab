# What is backed up, where to, and what is not. Verified 2026-09-06,
# including a restore in both directions.

meta:
  updated: 2026-09-06
  tags: [backup, restic, disaster-recovery]

tool: restic
schedule: daily systemd timer, randomised delay
retention: 7 daily, 4 weekly, 6 monthly

units:
  timer: restic-backup.timer        # enabled; the service itself is static
  service: restic-backup.service
  exec_start: /srv/ssd/docker/homelab/core/backup/backup.sh
  note: >-
    The unit stores an absolute path, generated by core/backup/install.sh from
    wherever the checkout was at the time. Moving or renaming the checkout
    leaves it pointing at nothing; re-running install.sh regenerates it.

repositories:
  - path: /var/backups/restic
    on_disk: sdb
    holds: [docker/data, docker/secrets, samba/scan, samba/doc]
    excludes: [jellyfin/cache, jellyfin/config/metadata, jellyfin/config/log]
    size: ~134M                     # grows a few MB a day
  - path: /srv/ssd/backups/restic
    on_disk: sda
    holds: [/etc/openmediavault/config.xml]
    size: ~1.1M
  - path: sftp:proxmox-backup:/var/lib/vz/backups/restic
    on_host: proxmox                # /var/lib/vz, 78G free
    holds: everything the two local repositories hold between them
    size: ~134M
    compression_ratio: 1.70x
    access:
      key: /root/.ssh/id_ed25519_backup      # generated by install.sh
      restriction: >-
        Authorised on proxmox as restrict,command="internal-sftp" — file
        transfer only, no shell and no forwarding. Verified: `ssh` with that
        key answers "This service allows sftp connections only."
      alias: >-
        /root/.ssh/config defines Host proxmox-backup, so the key is used for
        the backup and for nothing else.

rationale: >-
  Each disk holds the backup of what lives on the other, so losing either
  leaves a copy on the survivor. A third copy sits on proxmox, so losing the
  whole NAS does not lose every copy.

password:
  - /etc/restic-password
  - /srv/ssd/backups/password       # so the sda repo survives losing sdb

restore_verified: 2026-09-06        # all three repositories, byte-compared
restore_from_remote: >-
  Needs only restic and the repository password — the repository is plain
  files, readable from any machine that can reach them. The ssh key is a
  convenience for the automated job, not a requirement for recovery.

gaps:
  - >-
    Not off-site. All three copies are in one room on one breaker, so fire or
    theft still takes everything. The machine-loss case is covered; the
    building-loss case is not. restic speaks B2 and S3 natively if that
    changes.
  - samba/torrents (1.7T) is not backed up and is treated as re-downloadable.
  - Package list is not captured; core/bootstrap.sh installs Docker if missing.
  - proxmox has no vzdump schedule; its guests are Terraform-rebuildable.
  - The router's config is not backed up, only documented in hosts/router.yaml.
