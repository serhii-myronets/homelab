# What is backed up, where to, and what is not. Everything lands in Cloudflare
# R2, bucket homelab-backups, the one copy outside the house. The R2 key pair
# and the restic password - one password for every repository - are in
# Infisical /system/backups; keep that password in a password manager too, since
# without it nothing below can be read.
# Verified 2026-09-30, including a full restore.

meta:
  updated: 2026-09-30
  tags: [backup, restic, volsync, r2, etcd, disaster-recovery]

volsync_to_r2:
  covers: >-
    One claim per service, named data, under volsync/<service>: immich,
    jellyfin, library, sure, torrent and vaultwarden. Hourly,
    from a thin snapshot so the application keeps running, each service on
    its own minute past the hour (MINUTE in its kustomization) - sharing one
    throttled the snapshot controller once. Keeps 24 hourly, 7 daily,
    4 weekly, 3 monthly.
  restore: >-
    Each claim declares where it restores from, so an empty cluster fills
    it from R2 before the service starts. It restores into a volume of its
    own and keeps it (decisions/0024): the LVMSnapshots that restores leave
    behind must stay.
  verified: >-
    2026-09-30, all seven at once: core was rebuilt empty and every claim
    came back within two minutes - Immich's database with its 7,264 assets,
    Vaultwarden, Sure, Uptime Kuma and the rest.
  watch: >-
    A ReplicationSource with an empty lastSyncTime has never run, and looks
    like a healthy one at a glance (traps.yaml). VictoriaMetrics scrapes
    VolSync since 2026-10-02: volsync_volume_out_of_sync{role="source"} is 1
    for a backup that missed its hour, and dash.home shows the count. VolSync
    keeps reporting an archived service until its controller restarts.
  leftover: >-
    volsync/actual and volsync/uptime-kuma, from archived services; nothing
    writes or prunes them, and each restores its service if it returns

etcd_to_r2:
  what: >-
    Every object in etcd, Secrets included - what VolSync does not cover. A
    nightly snapshot through the Talos API by the CronJob
    etcd-backup/etcd-backup at 03:30 Pacific, into restic at etcd/beelink
    (the cluster's name when it was set up), 30 daily kept.
  restore: >-
    restic restore the latest snapshot, then `talosctl -n 192.168.8.10
    bootstrap --recover-from=<file>` on a node whose etcd is Preparing. It
    needs core/01-talos/secrets.yaml as well: Talos encrypts Secrets inside
    etcd with a key from it.
  verified: >-
    Recovery from a local snapshot worked on 2026-09-29; none from R2 yet.
    The rebuilt cluster's first run was 2026-10-01 at 03:30, snapshot
    8c746e83, 36.8 MiB read and 6.7 MiB stored.

router_to_r2:
  what: >-
    The router's own backup - sysupgrade -b, the archive GL.iNet's UI exports:
    every /etc/config, the WireGuard and Wi-Fi keys, the passwords, AdGuard's
    configuration and what router/ installed; 161 files, 24 MiB. Nightly at
    03:45 Pacific by router-backup on worker-1, through a key whose
    authorized_keys line forces that one command (router/backup), into
    restic at router in R2; 30 daily and 12 monthly kept.
  restore: >-
    On the Mac (brew install restic), export AWS_ACCESS_KEY_ID,
    AWS_SECRET_ACCESS_KEY and RESTIC_PASSWORD from Infisical /system/backups
    and RESTIC_REPOSITORY=s3:<R2_ENDPOINT>/homelab-backups/router, then
    `restic restore latest --target ./router`. Upload
    backup/router-config.tar.gz in LuCI - System, Backup / Flash Firmware,
    Restore backup - on the same model and a firmware close to the one that
    made it, and the router reboots with its settings, the backup key
    included. A reflash also changes the router's host keys: refresh
    router-backup's known_hosts with ssh-keyscan before its next run.
  verified: >-
    2026-10-02, the first run restored from R2 in a pod: 161 files, network,
    wireless, firewall, dhcp, wireguard_server, shadow and authorized_keys
    among them. No restore onto the router itself yet.

not_backed_up:
  - >-
    Immich's photographs - the only irreplaceable data in the house, on one
    HDD with no mirror and no second copy. The largest open gap. Planned: a
    copy to R2 (about $0.015 per GB a month) and an append-only one on the
    router's T7.
  - The films and series on hdd-a, treated as re-downloadable.
  - Every cache - models, transcodes, thumbnails, incomplete downloads.
  - >-
    core's Terraform state and secrets.yaml, which exist only on the Mac;
    without them the cluster can be run but not rebuilt. Planned: the state
    in R2 as a Terraform backend.
