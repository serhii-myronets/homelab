# Things that have already cost time here. Each was diagnosed from a real
# failure, not read in a manual. Check this file before debugging anything
# that "should work".
#
# A trap earns its place only while it can happen again. Ten covering
# Portainer, Caddy and Homepage went on 2026-09-20 with the Docker stack they
# described; git remembers them if that stack is ever started again.

meta:
  updated: 2026-10-03
  tags: [traps, gotchas, debugging, kubernetes, talos, cilium, openebs, volsync, networking, media, flux, immich, router, dns, external-dns]

traps:
  - id: cilium-bridge-needs-explicit-device
    applies_to: [cilium, talos, networking]
    symptom: Cilium's agent exits with "unable to determine direct routing device".
    cause: "The node's LAN IP is assigned to a Talos bridge, so Cilium cannot infer a physical direct-routing device."
    fix: "Set `nodePort.directRoutingDevice: br0` and `devices: br0` in the Cilium Helm values, then run `kubectl -n kube-system rollout restart daemonset/cilium`; the config init container only runs for a new pod."
    diagnosed: 2026-09-18, on the Beelink

  - id: cilium-iptables-masquerade-breaks-nodeport
    applies_to: [cilium, talos, networking, kubernetes]
    symptom: >-
      A LoadBalancer or NodePort Service accepts TCP connections from the LAN,
      then hangs until the client resets. The pod receives the request and
      answers; from inside the cluster the same address works. The Cilium
      Gateway, served by Envoy on the host, is unaffected.
    cause: >-
      With kube-proxy replacement and iptables masquerading, the SYN-ACK
      leaves with the service port, but data segments are masqueraded by
      iptables first. They leave from the node IP with the pod's port, which
      the client does not recognise.
    fix: >-
      Set `bpf.masquerade: true` in the Cilium values and restart the
      DaemonSet. `cilium-dbg status` must report `Masquerading: BPF`. A
      capture on br0 with `talosctl pcap` shows the wrong source port.
    diagnosed: 2026-09-18, on the Beelink

  - id: samba-guest-writes-need-group-and-no-nfs-aces
    applies_to: [samba, kubernetes, macos]
    symptom: >-
      A guest share with `force user` returns ACCESS_DENIED for creating files
      in a directory owned by that user with mode 0755; after that is fixed,
      guests still cannot write inside directories created from macOS.
    cause: >-
      Samba's own access check does not match the guest session to the
      directory owner, only to its group. Separately, the fruit module lets
      Finder reset each new directory to 0755 through NFS ACEs, after
      `force directory mode` has applied.
    fix: >-
      Keep share roots and everything below group-writable (0775/0664 with
      matching `force create mode` and `force directory mode`), and set
      `fruit:nfs_aces = no`. World-writable modes also work.
    diagnosed: 2026-09-18, on the Beelink

  - id: a-nameless-http-listener-swallows-the-local-names
    applies_to: [gateway-api, cilium, cloudflared]
    symptom: >-
      A local name typed without a scheme is served in the clear and the
      browser calls it insecure, although the Gateway holds a valid
      certificate for it and HTTPS works.
    cause: >-
      A listener with no hostname matches every name. The tunnel needs one
      like that, because cloudflared speaks plain HTTP, so the local names
      were answered there as well and never reached the HTTPS listener.
    tell: >-
      `curl --resolve <name>:80:<gateway> http://<name>/` returns 200 rather
      than a redirect.
    fix: >-
      Give each listener a hostname: the public one `*.serhii.link`, and a
      second on port 80 for `*.home` carrying only a redirect to HTTPS. The
      redirect route must be alone on its listener - a route whose hostname
      matches exactly beats a wildcard, so a service route sharing the
      listener would take its own name back off the redirect. Keep the name
      that serves the root certificate on a plain listener of its own: a
      device that has yet to trust the authority cannot be asked to use it.
    diagnosed: 2026-09-19, on the Beelink

  - id: no-wildcard-under-a-top-level-name
    applies_to: [cert-manager, tls, macos]
    symptom: >-
      macOS reports "Host name mismatch" for a certificate whose SAN is
      "*.home", and browsers keep warning even with its root installed.
    cause: >-
      Apple and Chrome refuse a wildcard directly under a top-level name,
      because it would cover every name under it. Caddy never served one: its
      `*.home` block matched hostnames, while `tls internal on_demand` minted
      a separate certificate for each name as it was first requested.
    fix: >-
      List each local name in the certificate, and add a name there in the
      same change that adds its route. A wildcard works one level deeper, on
      a real domain such as *.lan.example.com.
    diagnosed: 2026-09-19, on the Beelink

  - id: apple-needs-serverauth
    applies_to: [cert-manager, tls, macos]
    symptom: >-
      A certificate from a trusted local authority is still rejected, and
      curl reports verification failure.
    cause: >-
      cert-manager issues without an extendedKeyUsage unless asked, and Apple
      platforms require serverAuth on a TLS server certificate.
    fix: 'Set usages: [server auth, digital signature, key encipherment].'
    diagnosed: 2026-09-19, on the Beelink

  - id: qbittorrent-prefers-its-own-config
    applies_to: [qbittorrent, kubernetes]
    symptom: >-
      Changes to qBittorrent.conf never take effect, and the file it writes
      keeps the old values.
    cause: >-
      qBittorrent reads qBittorrent_new.conf when it exists and only falls
      back to qBittorrent.conf, and it rewrites that file from memory when it
      shuts down.
    fix: >-
      Copy the file from Git into the volume at startup and delete
      qBittorrent_new.conf there, rather than mounting the configuration
      read-only. To fix a running instance, delete the file and kill the pod
      without a graceful stop, which would write it back.
    diagnosed: 2026-09-19, on the Beelink

  - id: gluetun-ships-dead-vpn-servers
    applies_to: [gluetun, nordvpn, kubernetes]
    symptom: >-
      OpenVPN reports "TLS handshake failed" or the host being unreachable on
      one server after another, and connects only occasionally.
    cause: >-
      The server list built into the image holds addresses the provider no
      longer answers on, and gluetun picks from it at random. NordVPN's own
      API returns different, reachable addresses.
    fix: >-
      Give gluetun a volume for /gluetun and set UPDATER_PERIOD: it rewrites
      the list there, but only on that period and never at startup, so the
      list has to survive restarts to be of use. Shorten the wait on a dead
      address with OPENVPN_FLAGS "--connect-timeout 10 --hand-window 20".
      SERVER_HOSTNAMES only accepts names already in the stale list, and
      VPN_ENDPOINT_IP pins one server. After the first refresh here the
      tunnel came up in 24 seconds instead of minutes.
    diagnosed: 2026-09-19, on the Beelink

  - id: cilium-hides-the-client-address
    applies_to: [cilium, kubernetes, networking]
    symptom: >-
      A service that trusts LAN addresses rejects LAN clients; the pod sees
      the node's cilium_host address instead.
    cause: >-
      Traffic through the LoadBalancer is masqueraded even with
      externalTrafficPolicy set to Local. Not understood further.
    fix: >-
      Until this is understood, trust the pod network too, or use the
      service's own authentication.
    diagnosed: 2026-09-19, on the Beelink

  - id: talos-provider-lags-the-machine-config
    applies_to: [talos, terraform]
    symptom: >-
      `terraform plan` fails with "config_patches are invalid ... error
      decoding document v1alpha1/LVMVolumeGroupConfig: not registered".
    cause: >-
      Provider 0.11.0 generates and validates against the v1.13 machine
      configuration contract, so documents added in Talos 1.14 are unknown to
      it even though the node supports them.
    fix: >-
      Do it another way until a stable provider ships the newer contract; the
      LVM volume group is created by a job in the cluster instead. Applying
      such a document with `talosctl patch` would be undone by the next
      `terraform apply`, which writes the whole machine configuration.
    diagnosed: 2026-09-19, on the Beelink

  - id: openebs-lvm-thin-pool-sized-to-first-claim
    applies_to: [openebs, lvm, kubernetes]
    symptom: >-
      Thin volumes run out of space long before the disk does.
    cause: >-
      When a thin pool is missing, lvm-localpv creates one as large as the
      claim being provisioned, and every later claim shares that pool.
    fix: >-
      Create the pool first, over nearly the whole volume group, and publish
      the StorageClass only afterwards - a claim cannot bind to a class that
      does not exist yet, so none can create a small pool. Watch the pool's
      usage: when a thin pool fills, every volume in it stops accepting
      writes.
    happened_again: >-
      2026-10-02 on worker-1, despite a Job that made the pool: the pool in
      place was OpenEBS's, created at 2026-09-30 20:50:41 with the first
      claim (VictoriaLogs, 50 GiB), and the Job only checked that one
      existed. The first photo copy filled it; for seven minutes every
      volume on the ORICO returned write errors, VictoriaMetrics and
      VictoriaLogs restarted, and lvs showed the pool twi-aot-D- at 100%
      with 1.81 TB free in its group. Grown in place with lvextend
      --poolmetadatasize 2G and -l 95%VG; the Job now grows any pool smaller
      than that on every run. Nothing exports a thin pool's own fill - OpenEBS
      reports the group, which shows the pool as used space - so nothing
      warned.

  - id: openebs-brings-a-second-snapshot-controller
    applies_to: [openebs, volsync, kubernetes]
    symptom: >-
      Two snapshot controllers watch the same VolumeSnapshot objects, at
      different versions, with nothing obviously broken.
    cause: >-
      The lvm-localpv chart runs a snapshot-controller container inside its
      CSI controller pod, next to the csi-snapshotter sidecar. Turning off
      `crds.csi.volumeSnapshots` only skips the CRDs; the controller has its
      own switch, and the chart's comment says a cluster should have one.
    tell: >-
      `kubectl get pods -n openebs -o jsonpath` over container names lists
      both `csi-snapshotter` and `snapshot-controller`.
    fix: >-
      Set `lvm-localpv.lvmController.snapshotController.enabled: false` and
      keep the cluster-wide controller in kube-system. The csi-snapshotter
      sidecar stays: it is the driver turning a VolumeSnapshot into an LVM
      snapshot, which is a different job.
    diagnosed: 2026-09-19, on the Beelink

  - id: gitops-cannot-update-a-job
    applies_to: [flux, kubernetes]
    symptom: >-
      A Job keeps running its old script after the change is pushed and
      reconciled, and the controller reports success.
    cause: >-
      A Job's pod template is immutable, so the update is rejected and no
      GitOps tool can force it. Found under Argo CD, unchanged under Flux.
    fix: >-
      Delete the Job and let the controller recreate it. A Job meant to be
      changed this way has to be safe to run twice - nvme-thinpool is the one
      here, and it is.
    diagnosed: 2026-09-19, on the Beelink

  - id: gluetun-is-oomkilled-building-its-dns-block-lists
    applies_to: [gluetun, kubernetes, torrent]
    symptom: >-
      The VPN container crash-loops although the log shows no error at all:
      the tunnel comes up, the public address is reported, and a few seconds
      later the container is gone. The pod never becomes ready, so the whole
      stack answers 503.
    cause: >-
      Right after connecting, gluetun downloads and builds DNS block lists in
      memory. That peak does not fit in 256Mi - measured 332Mi in use once it
      was allowed to finish - and the kubelet kills it.
    tell: >-
      `kubectl get pod -o jsonpath` over lastState shows `exitCode: 137,
      reason: OOMKilled`, and the final log line before each death is
      `[dns] downloading hostnames and IP block lists`.
    fix: >-
      Raise the limit to 512Mi, or turn the block lists off if the memory
      matters more than they do.
    note: >-
      This stayed hidden while the container was failing to authenticate,
      because it never got far enough to build the lists. Fixing one fault
      revealed the next.
    diagnosed: 2026-09-19, on the Beelink

  - id: gluetun-retries-one-vpn-server-for-ever
    applies_to: [gluetun, openvpn, nordvpn, torrent]
    symptom: >-
      The tunnel drops and never comes back. The log repeats AUTH_FAILED
      every ten seconds - thirteen times in three minutes on 2026-09-19 -
      and the pod stays unready, so the whole stack answers 503. The
      credentials are unchanged and worked minutes earlier.
    cause: >-
      Gluetun writes a single `remote` into its OpenVPN configuration along
      with `auth-retry nointeract`. A server that answers AUTH_FAILED is
      therefore retried for ever: OpenVPN soft-restarts into the same
      address, and gluetun chooses another server only when the OpenVPN
      process dies. The cached list of every provider server sits beside it,
      unused. Restarting the pod works, which makes this look transient.
    tell: >-
      `Preserving recently used remote address` names the same IP on every
      attempt, and `grep remote /etc/openvpn/target.ovpn` inside the
      container shows exactly one.
    fix: >-
      Add `--auth-retry none` to OPENVPN_FLAGS. OpenVPN then exits on a
      rejected login and gluetun picks the next server. The flags follow
      --config on the command line, so they override what gluetun wrote.
    diagnosed: 2026-09-19, on the Beelink

  - id: openebs-lvm-mounts-a-volume-into-one-pod-only
    applies_to: [openebs, lvm, kubernetes]
    symptom: >-
      Several pods share one ReadWriteOnce claim on a single-node cluster.
      The first starts; the rest stay in ContainerCreating with
      `verifyMount: device already mounted at /var/lib/kubelet/pods/<the
      first pod>/...`.
    cause: >-
      ReadWriteOnce allows many pods on one node, but the LVM driver checks
      whether the logical volume is already mounted and refuses the second
      mount. For this driver the claim belongs to one pod, not one node.
    fix: >-
      Put the containers that share the volume in one pod, each under its
      own subPath, as the torrent and library stacks do, or give each its
      own claim.
    diagnosed: 2026-09-19, on the Beelink

  - id: volsync-populator-races-csi-leak-protection
    applies_to: [volsync, openebs, kubernetes]
    symptom: >-
      A claim with a VolSync dataSourceRef binds, but every pod fails to
      mount it with `lvmvolumes.local.openebs.io "pvc-..." not found`. The
      PV exists and is Bound; the logical volume behind it does not.
    cause: >-
      The populator provisions a temporary `vs-prime-...` claim, rebinds its
      PV to the real claim and deletes the temporary one. csi-provisioner's
      leak protection sees a claim vanish while it was provisioning and
      deletes the volume it just made. The CSI log names it outright -
      `leak_protection.go: deleted volume via csi driver if exists`. It is a
      race, so the same manifest can work one time and fail the next.
    fix: >-
      Delete the claim and let it be recreated; the second attempt usually
      wins. Pods holding the broken claim must go first, or its
      pvc-protection finalizer keeps it.
    diagnosed: 2026-09-19, on the Beelink

  - id: csistoragecapacity-keeps-a-dead-owner
    applies_to: [openebs, kubernetes, csi]
    symptom: >-
      After a CSI controller is rolled, its provisioner logs
      `CSIStorageCapacity ... is invalid: Only one reference can have
      Controller set to true` every few seconds, naming both the old and the
      new ReplicaSet.
    cause: >-
      The object is owned by the ReplicaSet that created it. A new ReplicaSet
      cannot add itself as a second controlling owner, and nothing removes
      the old one, so capacity is never updated again.
    fix: >-
      Delete the CSIStorageCapacity object. The running provisioner recreates
      it, owned by the live ReplicaSet.
    diagnosed: 2026-09-19, on the Beelink, after rolling OpenEBS

  - id: openebs-needs-a-privileged-namespace
    applies_to: [openebs, kubernetes, talos]
    symptom: >-
      OpenEBS pods are rejected, or a first claim stays Pending with
      ProvisioningFailed, on a cluster that enforces the baseline Pod Security
      level - which Talos does by default.
    cause: >-
      The LVM node plugin runs privileged, because it reaches the host's
      devices to make logical volumes. The Hostpath provisioner needed the
      same for a different reason - a privileged helper pod per claim - and
      that is what the label was first added for, before Hostpath was
      switched off.
    fix: >-
      Label the openebs namespace `pod-security.kubernetes.io/enforce:
      privileged`. Still required with Hostpath disabled: check the node
      DaemonSet, not the provisioner, before deciding the label is spare.
    diagnosed: 2026-09-19, on the Beelink; reason corrected 2026-09-24

  - id: external-dns-target-annotation-lost-alpha
    applies_to: [external-dns, cloudflare, gateway-api]
    symptom: >-
      external-dns tries to create an A record with the Gateway's LAN address
      instead of a CNAME to the tunnel, and Cloudflare answers 400, code 9003:
      "Target 192.168.8.15 is not allowed for a proxied record".
    cause: >-
      external-dns 0.22 reads `external-dns.kubernetes.io/target` on the
      Gateway and silently ignores the older
      `external-dns.alpha.kubernetes.io/target`, so it falls back to the
      Gateway's own address. The target annotation is also ignored on routes.
    fix: >-
      Use the prefix without `alpha` on the Gateway. The failed attempt can
      leave an `a-<name>` ownership TXT record behind; delete it by hand.
    diagnosed: 2026-09-19, on the Beelink

  - id: cilium-gateway-api-needs-v1-6-crds
    applies_to: [cilium, gateway-api, kubernetes]
    symptom: >-
      GatewayClass and Gateway stay Pending with "Waiting for controller" and
      no LoadBalancer Service is created.
    cause: >-
      Cilium 1.20 requires Gateway API v1.6.1 or newer. The old v1.2.0
      standard CRDs lack TLSRoute and BackendTLSPolicy and expose
      ReferenceGrant only as v1beta1, so Cilium does not start its Gateway
      controller.
    fix: >-
      Apply Gateway API v1.6.1 standard CRDs server-side, then verify the
      Cilium operator reports the Gateway controller as running. Existing
      Gateway resources reconcile automatically.
    diagnosed: 2026-09-18, on the Beelink

  - id: talos-provider-partial-on-destroy
    applies_to: [terraform, talos]
    symptom: Provider 0.11.0 plan fails with a null conversion error for on_destroy.graceful.
    cause: A partial on_destroy object leaves boolean fields null in the provider.
    fix: Set reset, graceful and reboot explicitly.
    diagnosed: 2026-09-17
  - id: wireguard-client-network-overlaps-vpn-and-lab
    applies_to: [wireguard, router, macos]
    symptom: >-
      WireGuard activates, but the client cannot reach LAN or lab resources;
      routes for the VPN gateway or lab use the physical interface.
    cause: >-
      The client's current network was 10.1.0.0/22, overlapping both the
      WireGuard client network 10.1.0.0/24 and homelab 10.1.1.0/24.
      More-specific connected routes won over tunnel routes.
    tell: >-
      `route -n get 10.1.0.1` or `route -n get 10.1.1.100` reports en0 rather
      than the WireGuard utun interface.
    fix: >-
      Renumber the WireGuard server and every peer to a less common subnet,
      for example 10.66.66.0/24.
    diagnosed: 2026-09-08

  - id: jellyseerr-api-key-has-no-owner-before-setup
    applies_to: [seerr, jellyseerr, library, kubernetes]
    symptom: >-
      Every write to /api/v1/settings/* answers
      {"status":403,"error":"You do not have permission to access this
      endpoint"} while the same key reaches the API, so the request is
      authenticated and refused rather than rejected.
    cause: >-
      The API key grants whatever the first administrator account has, and a
      fresh instance has no account at all: the wizard creates one from a
      Jellyfin sign-in. Until then the key resolves to nobody.
    tell: >-
      `curl localhost:5055/api/v1/settings/public` reports
      `"initialized": false`. A body sent to the same endpoints is still
      validated, so a malformed field answers with a field error instead of
      the 403 - which reads as if authentication had passed.
    fix: >-
      Finish the wizard once by hand; it needs a Jellyfin password, so no key
      can stand in for it. Configure the rest through the API afterwards.
    diagnosed: 2026-09-20

  - id: jellyfin-12-rejects-the-header-jellyseerr-sends
    applies_to: [jellyfin, seerr, jellyseerr, library]
    symptom: >-
      Jellyseerr's setup wizard reports it cannot connect, while the same
      pod reaches Jellyfin perfectly well. Its log shows status 400 from
      /Users/AuthenticateByName; Jellyfin's log shows only "Error processing
      request" with no reason.
    cause: >-
      Jellyfin 12 no longer reads X-Emby-Authorization, and that is the only
      header Jellyseerr sends - 2.7.3 and the develop build alike, checked in
      both images. A malformed authorization header is a bad request, not a
      failed login, which is why the status is 400 and never 401.
    tell: >-
      The same POST with a deliberately wrong password answers 400 under
      X-Emby-Authorization and 401 under Authorization. The 401 is the proof:
      that header was parsed and only the password was refused.
    fix: >-
      Jellyfin keeps a switch for the old header, EnableLegacyAuthorization
      in /config/config/system.xml, off by default. Set it to true and
      restart. Seerr 3.4.1 asks the API with Authorization but its sign-in
      route still sends the old header, so the switch has to stay on until
      that route follows.
    diagnosed: 2026-09-20

  - id: sonarr-manual-import-ignores-the-folder-when-given-a-series
    applies_to: [sonarr, library]
    symptom: >-
      A manual import scan passed both a folder and seriesId returns the
      series' own library files, or fails outright with
      "Could not find a part of the path /data/media/tv/<series>" when the
      series has nothing imported yet.
    cause: >-
      With seriesId set, the scan reads the series' root folder rather than
      the folder in the query, so it reports what is already imported and
      never sees the source.
    tell: >-
      The returned relativePath carries the library's naming
      ("Season 1/<Series> - S01E01 - <title> WEBDL-1080p.mkv") instead of the
      release's own, and the count matches what is already imported.
    fix: >-
      Scan without seriesId, which does read the folder given. Where the
      release names carry no series name, Sonarr answers "Unknown Series";
      supply seriesId and episodeIds per file in the ManualImport command
      instead, working them out from the path.
    diagnosed: 2026-09-20

  - id: a-release-numbered-straight-through-is-read-as-a-season-number
    applies_to: [sonarr, library]
    symptom: >-
      Episodes import without a single rejection and land under the wrong
      titles: a file called "14.Risky Beesness" becomes
      "S02E14 - The Case of the Cola Cult".
    cause: >-
      Some releases number every episode straight through the series while
      splitting them into season folders. Sonarr reads the leading number as
      the episode within that folder's season, which is right only for the
      first season.
    tell: >-
      Compare inodes, not names - `stat -c %i` on the source and
      `find <library> -inum` - because the library file is the same file
      under the name Sonarr chose. A mismatch between the title in the
      source name and the title in the library name is the whole symptom.
    fix: >-
      Delete the episode files (which removes only the library's hard link,
      never the seeding copy) and import again, matching each file to an
      episode by its title rather than its number.
    diagnosed: 2026-09-20

  - id: renaming-a-jellyfin-library-leaves-the-old-one-behind
    applies_to: [jellyfin, beelink]
    symptom: >-
      After renaming a library, the sidebar shows both the old name and the
      new one, listing the same titles twice.
    cause: >-
      The rename creates a library under the new name and removes the old
      one's directory under /config/root/default, but its CollectionFolder
      row stays in the database, so it is still a view with children.
    tell: >-
      /Library/VirtualFolders lists only the new name while
      /Users/<id>/Views lists both, each with its own id.
    fix: >-
      Delete the leftover by id, DELETE /Items/<id>. Every series hanging
      off it goes too, because they were its children, so a full library
      scan has to follow. The files are untouched - /library is mounted
      read-only - and anything reading the library by id, Jellyseerr among
      them, has to be pointed at the new one.
    diagnosed: 2026-09-20

  - id: a-new-jellyfin-library-writes-artwork-into-a-read-only-mount
    applies_to: [jellyfin, beelink]
    symptom: >-
      A scan crawls and leaves most series with no poster and no summary,
      while every film is fine. The log repeats "IOException saving to
      /library/tv/<series>/backdrop.jpg. Will retry saving to
      /config/metadata/...".
    cause: >-
      A library created fresh takes the defaults, and SaveLocalMetadata is
      one of them: artwork and NFO go beside the media. The media mount is
      read-only on purpose, so every write throws before the fallback path
      is tried, and the scan spends its time on exceptions.
    tell: >-
      Compare LibraryOptions between a library that works and one that does
      not - the difference is SaveLocalMetadata, with SaveSubtitlesWithMedia
      behind it.
    fix: >-
      Turn off SaveLocalMetadata and SaveSubtitlesWithMedia through
      /Library/VirtualFolders/LibraryOptions and scan again. Worth turning
      off the embedded-title options at the same time, since a file's own
      tags would otherwise overwrite the episode titles the import worked
      out.
    diagnosed: 2026-09-20

  - id: volsync-waits-for-ever-on-a-snapshot-of-a-deleted-volume
    applies_to: [volsync, openebs, beelink]
    symptom: >-
      A ReplicationSource reports "Synchronization in-progress" for hours
      with no mover job and no pod, and lastSyncTime is never set, so the
      application looks backed up on a schedule that has never once run.
    cause: >-
      The VolumeSnapshot was taken while the claim was bound to a volume
      that was later deleted - here the broken claim from the csi-provisioner
      leak-protection race. The content keeps the old volume handle, the
      driver answers "lvmvolumes.local.openebs.io <old pv> not found", and
      VolSync waits for a snapshot that can never become ready instead of
      giving up and taking a new one.
    tell: >-
      Compare the claim's current volumeName with the volume named in the
      snapshot's error, and check `kubectl get lvmvolume -A` - the one in
      the error is not there. A Released PV that refuses to delete "with 1
      active snapshot" usually sits beside it.
    fix: >-
      Delete the VolumeSnapshot. VolSync takes a fresh one against the live
      volume on its next pass. Worth checking lastSyncTime on every
      ReplicationSource after any claim is recreated, because nothing else
      reports this as a failure.
    diagnosed: 2026-09-20

  - id: an-image-repositorys-newest-tag-is-not-the-newest-release
    applies_to: [renovate, containers, seerr, jellyseerr]
    symptom: >-
      A pinned image is the highest tag its repository offers and the
      application still reports an update available, a year of releases
      behind.
    cause: >-
      The project renamed itself and moved - Jellyseerr to Seerr, at
      seerr-team/seerr - and the old repository keeps serving its last
      build for ever. Nothing in the registry says a repository is
      abandoned, and Renovate cannot follow a move it was not told about.
    tell: >-
      The GitHub repository answers 301 to a new full_name, and the
      application's own /status reports updateAvailable with commitsBehind
      0 because the image ships no commit tag to compare.
    fix: >-
      Point the Deployment at the new repository. Worth asking, whenever an
      application claims an update that the registry does not have, whether
      the registry is still the right one.
    diagnosed: 2026-09-20

  - id: gluetun-names-the-tunnel-tun0-whatever-the-protocol
    applies_to: [gluetun, qbittorrent, torrent, wireguard]
    symptom: >-
      After switching gluetun from OpenVPN to WireGuard every torrent sits at
      zero peers. The tunnel is up and gluetun reports a public IP in the
      right country; qBittorrent starts and logs nothing wrong.
    cause: >-
      qBittorrent is bound to the tunnel by interface name, and the name
      comes from gluetun's VPN_INTERFACE, which is tun0 for WireGuard as much
      as for OpenVPN. Binding it to wg0 - the name WireGuard usually takes
      elsewhere - leaves it bound to an interface that does not exist.
    tell: >-
      `ip -brief addr` in the gluetun container shows tun0 holding the
      tunnel address, while Session\Interface in qBittorrent.conf says
      something else. Nothing in either log mentions it.
    fix: >-
      Keep both on tun0, or set VPN_INTERFACE and change the two together.
      Binding to a missing interface is silent by design: qBittorrent treats
      it as "no interface available" rather than an error.
    diagnosed: 2026-09-20

  - id: a-wireguard-server-can-accept-and-carry-nothing
    applies_to: [gluetun, wireguard, nordvpn, torrent]
    symptom: >-
      The torrent stack goes down for minutes at a time after moving to
      WireGuard. gluetun logs "Wireguard setup is complete" and then, seconds
      later, restarts the VPN over a DNS lookup that timed out.
    cause: >-
      Some of NordVPN's WireGuard endpoints accept the connection and carry
      no traffic. WireGuard has no handshake to fail, so nothing reports it;
      gluetun finds out from its own healthcheck and moves to the next
      server. That part works. What does not is a liveness probe short
      enough to kill gluetun while it is still hunting - a native sidecar
      restart takes qBittorrent's network with it and throws away every
      server already ruled out.
    tell: >-
      "restarting VPN because it failed to pass the healthcheck ... i/o
      timeout" in gluetun's log, followed by a different server address.
      A healthy rotation is over in seconds; the outage is kubelet's.
    fix: >-
      Give the liveness probe room for the hunt - ten failures of sixty
      seconds rather than three. gluetun repairs this on its own; the probe
      is there for gluetun being wedged, not for gluetun working.
    diagnosed: 2026-09-20

  - id: a-dropped-dns-query-is-answered-by-asking-again
    applies_to: [gluetun, torrent, dns, kubernetes]
    symptom: >-
      gluetun burns one and a half of the node's four cores while nothing is
      downloading. qBittorrent is idle, the tunnel is kernelspace WireGuard,
      so gluetun's process never touches a packet. It subsides after a few
      minutes and returns on its own.
    cause: >-
      Torrents from Toloka announce to http://retracker.local/announce, the
      convention for an ISP's own retracker. gluetun's resolver drops a
      .local query without replying - not even NXDOMAIN - and libtorrent
      reads silence as a lost packet, so it asks again immediately, from a
      new source port, for as long as the announce lasts. Three torrents
      produced 28,000 queries a second. The cores go on gluetun reading them.
    tell: >-
      Count loopback packets in the pod's namespace rather than guessing:
      `awk '/lo:/{print $3}' /proc/net/dev` twice, twenty seconds apart. A
      quiet stack moves single digits. Then `tcpdump -i lo -nn udp port 53`
      names the offender - and note whether anything at all comes back from
      port 53, because two transaction IDs across thousands of packets mean
      one question, not thousands. Reproduce on demand with
      `POST /api/v2/torrents/reannounce?hashes=all`, which costs nothing.
    fix: >-
      Answer the name before a query is sent: a hostAliases entry pinning
      retracker.local to 127.0.0.1. The announce then fails on a refused
      connection, which is instant and which libtorrent treats as a tracker
      error and backs off from. Measured with the same reannounce either
      side of the change: 704,829 loopback packets in twenty-five seconds
      at 1489 millicores, against 10 packets at 11.
    diagnosed: 2026-09-20

  - id: a-headless-browser-is-sized-by-what-asks-it
    applies_to: [flaresolverr, prowlarr, library, kubernetes]
    symptom: >-
      A Prowlarr search returns nothing from the indexers behind Cloudflare,
      and FlareSolverr shows a restart. It had been up for days.
    cause: >-
      FlareSolverr starts one Chromium per request in flight and caps
      nothing itself, so its peak is however many tagged indexers Prowlarr
      searches at once. Two challenges together did not fit in 1Gi. It
      reads as a leak and is not one: idle it holds about 110Mi.
    tell: >-
      lastState.terminated.reason is OOMKilled, not Error, and the previous
      container's log ends on two "Challenge detected" lines a second apart
      for different indexers. `kubectl get pods` alone shows only a restart
      count, so the reason has to be read from the pod object.
    fix: >-
      Size the ceiling for concurrent challenges rather than for idle - 2Gi
      here, with the request left at 256Mi so the scheduler reserves what
      it actually uses. Tagging fewer indexers would work too.
    diagnosed: 2026-09-20

  - id: removing-an-operator-leaves-the-collector-asking-for-it
    applies_to: [kubernetes, talos, argocd, crds]
    symptom: >-
      kube-controller-manager logs "failed to list *v1.PartialObjectMetadata:
      the server could not find the requested resource" about forty times a
      minute, for ever. Nothing is broken: every resource lists by hand, no
      namespace is terminating, no CRD is unestablished.
    cause: >-
      An operator's CRDs were removed - CloudNativePG, here, now under
      archive/ - and the garbage collector's monitors for its types
      were not. It rebuilds that set from discovery only at startup, so it
      keeps retrying types that no longer resolve. The retry never reaches
      the apiserver: the RESTMapper fails locally.
    tell: >-
      Zero failing LIST or WATCH in the apiserver's own metrics while the
      controller logs the error steadily - that gap means client-side, not
      server-side. Then look for a group that appears in
      apiserver_request_total with successful calls but has no CRD left:
      `kubectl get --raw /metrics | grep apiserver_request_total | grep <group>`.
      Check it is only noise before touching anything - scan owned objects
      for owner uids that no longer exist, and load the owner kinds too, or
      every Deployment-owned ReplicaSet reads as an orphan.
    fix: >-
      Restart kube-controller-manager; it rebuilds the set from current
      discovery. It costs nothing to leave - the collector itself keeps
      working, and the next node reboot clears it anyway.
    prevent: >-
      Recurred a third time on 2026-09-21 when Argo CD's own CRDs went with it
      at the end of the Flux migration. There is no setting that prevents it:
      client-go caches the type set in the process, and only a new process is
      guaranteed to rebuild it. Nor is one needed. Restarting
      kube-controller-manager here takes about ten seconds, and on a single
      node nothing user-facing depends on it - running pods keep running, the
      apiserver stays up, only cluster-level reconciliation pauses. So the
      restart is the fix, not a workaround for one: run
      `talosctl -n 192.168.8.10 restart --namespace cri
      kube-system/kube-controller-manager-talos-lqh-j5o:kube-controller-manager`
      in the same step as any `kubectl delete crd`, without waiting for the
      log to start.
    diagnosed: 2026-09-20, recurred 2026-09-21

  - id: deleting-a-static-pod-does-not-restart-it
    applies_to: [kubernetes, talos]
    symptom: >-
      `kubectl delete pod` on kube-apiserver, kube-controller-manager or
      kube-scheduler appears to work, but whatever it was meant to fix is
      unchanged.
    cause: >-
      Those are static pods. The API object is a mirror kubelet keeps for
      visibility; deleting it makes kubelet write a new mirror and leave the
      container alone.
    tell: >-
      metadata.creationTimestamp is seconds old while
      status.containerStatuses[0].state.running.startedAt and restartCount
      are unchanged. The restart count is the honest field.
    fix: >-
      Restart the container itself - `talosctl -n <node> restart --namespace
      cri kube-system/<pod>:<container>`, with the id from
      `talosctl -n <node> containers --namespace cri`.
    diagnosed: 2026-09-20

  - id: a-long-release-name-becomes-a-label-that-does-not-fit
    applies_to: [kubernetes, helm, argocd]
    symptom: >-
      A StatefulSet never creates its pod - not pending, not crashing,
      absent - and a sync fails on a Service that was rendered correctly.
    cause: >-
      Generated names are the release name plus the chart name plus a
      suffix. Kubernetes caps a label at 63 bytes and a Service name at 63
      characters, and "observability" plus
      "victoria-metrics-k8s-stack" passed both by a single byte.
    tell: >-
      The StatefulSet's events, not the pod's - there is no pod. It says
      "metadata.labels: Invalid value ... must be no more than 63 bytes"
      and names the controller-revision-hash. A failing sync says the same
      about metadata.name.
    fix: >-
      fullnameOverride in the chart's values, short. Renaming the Argo
      application would work too and costs more.
    diagnosed: 2026-09-20

  - id: scraping-the-apiserver-is-paid-for-by-the-apiserver
    applies_to: [kubernetes, observability, victoriametrics]
    symptom: >-
      Turning on metrics collection takes the apiserver from about 70
      millicores to over 1200, a core of four, and its memory keeps
      climbing.
    cause: >-
      With 95 CRDs its /metrics runs past the 16MB a scrape reads by
      default, and it is built from scratch on every request. Raising the
      scrape's ceiling makes the scrape succeed and makes the cost real.
    tell: >-
      The scrape fails whole with "exceeds -promscrape.maxScrapeSize"
      before the ceiling is raised, and afterwards the cost appears on the
      apiserver rather than on the collector.
    fix: >-
      Scrape interval, not relabeling. metricRelabelConfigs drop after the
      response has been built and sent, so they save storage and not one
      millicore. Five minutes here, against thirty seconds.
    diagnosed: 2026-09-20

  - id: kustomize-controller-does-not-fetch-remote-bases
    applies_to: [flux, kubernetes]
    symptom: >-
      A kustomization.yaml whose `resources` names a github URL builds
      locally and under Argo CD, and fails under Flux.
    cause: >-
      kustomize-controller builds only from the artifact source-controller
      handed it and never reaches the network mid-build, by design.
    fix: >-
      Give the upstream its own GitRepository pinned to the same tag and
      point the Flux Kustomization at a path inside it, moving any patches
      from the kustomization.yaml to the Kustomization's `patches` field.
      An `ignore` block keeping only the one directory stops
      source-controller from holding the whole upstream repository.
    diagnosed: 2026-09-21, migrating the Intel GPU plugin off Argo CD

  - id: talosctl-logs-can-return-the-previous-container
    applies_to: [talos, kubernetes, debugging]
    symptom: >-
      `talosctl logs` for a control plane container returns a log that ends
      hours ago, at an old crash, so a problem that is firing right now reads
      as history already dealt with.
    cause: >-
      Addressed by pod and container name alone, the command can return the
      log of a container that has since exited rather than the one running.
      `talosctl containers --kubernetes` lists both under the same pod, one
      CONTAINER_RUNNING and one CONTAINER_EXITED.
    tell: >-
      The newest line is older than the container's own start time.
      `kubectl get pod <static-pod> -n kube-system -o
      jsonpath='{.status.containerStatuses[0].state.running.startedAt}'`
      gives that start time, and `{.status.containerStatuses[0].containerID}`
      gives the id to use.
    fix: >-
      Append the running container's short id to the address:
      `talosctl logs --namespace cri
      kube-system/<pod>:<container>:<first 12 chars of id>`. On 2026-09-21
      this was the difference between "no errors for 23 hours" and an error
      several times a second.
    diagnosed: 2026-09-21, on the Beelink

  - id: flux-network-policies-hide-the-web-ui
    applies_to: [flux, cilium, gateway-api, kubernetes]
    symptom: >-
      The Flux Operator's web interface answers 200 from inside the cluster and
      503 through the Gateway, while its HTTPRoute reports Accepted with a
      valid backend and the Service has a ready endpoint on the right port.
    cause: >-
      Two separate policies, and removing one is not enough. The operator's
      `cluster.networkPolicy: true` writes the multi-tenancy lockdown, whose
      `allow-egress` denies ingress to everything in flux-system except pods of
      the same namespace; the chart's own `web.networkPolicy.create: true`
      then selects the operator pod and admits port 9080 from any namespace.
      Neither covers the Cilium Gateway, because its Envoy runs on the host and
      is not a pod in a namespace, and any policy selecting a pod makes
      everything it does not name default-deny.
    tell: >-
      `kubectl run` a curl pod in another namespace against the Service:
      200 from there next to 503 through the Gateway means a policy, not the
      application. `kubectl get networkpolicy -n flux-system` then shows what
      selects the pod.
    fix: >-
      Set both `spec.cluster.networkPolicy: false` on the FluxInstance and
      `web.networkPolicy.create: false` in the operator's values, leaving the
      namespace with no policy at all - which is what every other namespace on
      this cluster has. Allowing the Gateway back instead would need an ipBlock
      for cilium_host, an internal address that is not ours to pin.
    diagnosed: 2026-09-22, on the Beelink

  - id: two-snapshot-delete-errors-that-look-alike
    applies_to: [volsync, openebs, kubernetes, backup]
    symptom: >-
      A Warning on a VolumeSnapshot saying a snapshot content or a volume
      could not be deleted. Two unrelated things say this, and only one of
      them matters.
    cause: >-
      The harmless one is snapshot-controller losing a race with itself:
      `failed to delete VolumeSnapshotContent ... "not found"`, raised as
      SnapshotContentObjectDeleteError. It wanted to delete something already
      deleted, so the end state it was after is the state it found. It fires
      during the hourly VolSync window - twelve times in the two and a half
      days to 2026-09-22, always at :15, and every one of them "not found".
      The one that matters is the CSI driver refusing to reclaim a volume:
      `failed to handle delete volume request ... with 1 active snapshots`,
      on a PV in Released. That one repeats for ever and holds disk.
    tell: >-
      Read the end of the message, not the reason. "not found" is noise, once
      per occurrence and self-clearing. A count in the hundreds next to a
      `Released` PV is the other one - `kubectl get pv | grep -v Bound` finds
      it in one line, and that is also what proves the harmless one harmless.
    fix: >-
      The first has a cause worth removing rather than tolerating: all four
      ReplicationSources shared one schedule, `15 * * * *`, because they come
      from one kustomize component. Four movers then snapshotted at the same
      instant on four cores, and the snapshot controller's own API client
      throttled itself - `Waited before sending request ... client-side
      throttling` in its log, a second at a time - which is what widened the
      window it then lost. The component takes a MINUTE literal now and the
      four run at 5, 20, 35 and 50. For the second, delete the VolumeSnapshot
      still holding the volume and the reclaim finishes on its own.
    diagnosed: 2026-09-22, on the Beelink

  - id: kubectl-top-counts-page-cache-as-memory
    applies_to: [kubernetes, observability, memory]
    symptom: >-
      A container appears to use far more memory than it plausibly needs, and
      sits near its limit without ever being OOM killed. qBittorrent read as
      956MiB against a 1Gi limit while actually holding 42MiB; Immich's
      Postgres reads as 102MiB while holding 8MiB.
    cause: >-
      `kubectl top` reports the working set, which is usage minus *inactive*
      file pages - active page cache is still counted. Anything that reads or
      writes files at volume is therefore charged for the cache it leaves
      behind. Across this cluster the difference is about 1.8GiB: 5686MiB
      reported against 3909MiB actually resident.
    tell: >-
      Read the cgroup instead: `anon` is what the process holds, `file` is
      cache. From outside the pod the same split is
      `container_memory_rss` and `container_memory_cache` in
      `kubectl get --raw /api/v1/nodes/<node>/proxy/metrics/cadvisor`.
      `memory.events` tells the rest of the story - a large `max` count with
      `oom_kill` at zero means the cgroup keeps hitting its ceiling and the
      kernel keeps reclaiming cache successfully, which is working as
      intended, not a shortage.
    fix: >-
      Nothing to fix in the workload, and nothing to drop: the kernel releases
      cache on demand and holding it is the point. What is worth fixing is a
      limit set from the misleading number. qBittorrent at 1Gi forced 10.5
      million reclaims in thirty hours for no benefit; at 2Gi the counter is
      zero. Size limits from `anon` plus headroom, not from what `top` prints.
    diagnosed: 2026-09-22, on the Beelink

  - id: a-service-hands-the-app-its-own-name-as-config
    applies_to: [kubernetes, paperless, gotchas]
    symptom: >-
      A container refuses to start on a value nobody wrote. Paperless's server
      exited with `Invalid value for '--port': 'tcp://10.96.54.209:8000' is
      not a valid integer`, an address that appears in no manifest.
    cause: >-
      Kubelet injects a Docker-links relic into every pod: for each Service in
      the same namespace it sets `<NAME>_PORT`, `<NAME>_SERVICE_HOST` and
      friends, named after the Service. A Service called `paperless` therefore
      sets `PAPERLESS_PORT` - and that is also the variable Paperless reads to
      choose the port it binds. Any app whose configuration prefix equals its
      own Service name collides the same way.
    tell: >-
      `kubectl exec ... -- env | grep ^<PREFIX>_` from a *different* container
      in the same pod shows the injected set plainly, and none of it is in the
      manifest. The give-away shape is a value like `tcp://10.x.x.x:port`
      where a number belongs.
    fix: >-
      `enableServiceLinks: false` on the pod spec. Nothing uses those
      variables; they predate DNS in Kubernetes. Renaming the Service also
      works and only moves the collision to the next app named after its own
      configuration. Checked the rest of this cluster afterwards - the *arr
      stack reads double-underscore names and Postgres reads PGPORT, so
      paperless was the only one.
    diagnosed: 2026-09-22, on the Beelink


  - id: volsyncs-restore-snapshot-pins-the-volume-it-came-from
    applies_to: [volsync, openebs, kubernetes, beelink]
    symptom: >-
      csi-provisioner logs "failed to handle delete volume request for
      {pvc-...} with 1 active snapshots" every two minutes for ever, with a
      failure counter in the hundreds, and a Released PV per affected service
      that never goes away. Nothing is broken; the noise never stops.
    cause: >-
      Every claim built from the backed-up-volume component runs its
      ReplicationDestination once. VolSync provisions a volume of its own,
      restores into it, snapshots it and keeps that snapshot as
      status.latestImage - it is the image the populator fills the real claim
      from, so VolSync never deletes it, and with `trigger.manual` there is no
      later sync to replace it either. `cleanupTempPVC: true` then deleted the
      volume underneath it, and OpenEBS will not free a logical volume an LVM
      snapshot still references. Unrelated to the leak-protection race above:
      this one fires on every healthy service at birth, empty repository or
      not.
    tell: >-
      `kubectl get pv | grep Released` names claims called
      `volsync-data-restore-dest`, and each namespace's ReplicationDestination
      reports a `.status.latestImage` whose VolumeSnapshot is still present.
    fix: >-
      Delete those VolumeSnapshots; the PVs clear within about three minutes,
      once csi-provisioner's backoff expires. The snapshot is owned by the
      ReplicationDestination, which Flux keeps alive for ever, so nothing
      collects it on its own. Prevented since 2026-09-23 by dropping
      `cleanupTempPVC` from the component - see decisions/0024.
    diagnosed: 2026-09-23, on the Beelink

  - id: moving-a-helm-release-between-namespaces-is-refused-by-its-own-crds
    applies_to: [helm, flux, kubernetes, crds]
    symptom: >-
      Changing a HelmRelease's namespace uninstalls the old release and then
      fails to install the new one with "invalid ownership metadata; annotation
      validation error: key meta.helm.sh/release-namespace must equal <new>:
      current value is <old>". The workload is gone by the time it is read.
    cause: >-
      CRDs annotated `helm.sh/resource-policy: keep` deliberately survive the
      uninstall - which is what protects the objects inside them - but they
      keep `meta.helm.sh/release-name` and `meta.helm.sh/release-namespace`
      from where they were installed. Helm will not adopt a resource another
      release claims, so the new install stops on the first one.
    tell: >-
      `kubectl get crd <name> -o jsonpath='{.metadata.annotations}'` names the
      old namespace while the HelmRelease names the new one.
    fix: >-
      Repoint every affected CRD before the move, not after - the gap between
      uninstall and install is an outage:
      `kubectl annotate crd <name> meta.helm.sh/release-namespace=<new>
      --overwrite`. Moving snapshot-controller and VolSync to `storage` on
      2026-09-23 needed eight of them; see decisions/0025. Check first that the
      CRDs really are kept, because if they are not, the uninstall takes every
      object in them with it.
    diagnosed: 2026-09-23, on the Beelink

  - id: a-new-public-name-is-cached-as-missing-twice
    applies_to: [dns, cloudflare, external-dns, router, macos]
    symptom: >-
      A name just published through external-dns does not open on the LAN, for
      up to half an hour, while every public resolver already answers for it.
      Later `dig` returns the address but the browser still cannot connect.
    cause: >-
      Two caches, one after the other. Anything on the network that looked the
      name up before the record existed made the router's dnsmasq cache the
      NXDOMAIN, and the zone's SOA asks for that to be held 1800 seconds. Once
      the router lets go, macOS has its own negative entry in mDNSResponder,
      which `dig` bypasses and applications do not.
    tell: >-
      `dig +short <name> @1.1.1.1` answers while `dig +short <name>
      @192.168.8.1` returns nothing - the router is the first cache. When `dig`
      succeeds but `curl` says "Could not resolve host", it is the second.
      `dig sure.serhii.link @192.168.8.1` prints the SOA with the seconds left.
    fix: >-
      Wait it out, or clear each cache: `killall -HUP dnsmasq` on the router
      reloads it without dropping the service, and `sudo dscacheutil
      -flushcache; sudo killall -HUP mDNSResponder` clears the Mac. Better,
      publish the name before anyone tries to open it. Nothing is wrong with
      the route, the tunnel or Access while this lasts.
    diagnosed: 2026-09-23, publishing sure.serhii.link

  - id: talos-oom-controller-kills-pods-without-a-memory-limit
    applies_to: [talos, kubernetes, cilium, openebs, immich, beelink, memory]
    symptom: >-
      Every route through the Gateway stops answering at once, while the
      applications behind them look healthy. cilium-envoy, cilium-operator and
      both OpenEBS LVM pods restart over and over with "procReady not
      received", "sandbox container is not running" or SandboxChanged; later a
      busy pod dies with exit 137 and reason Error, never OOMKilled, well
      under its own memory limit.
    cause: >-
      The node ran out of memory, not the container. Talos's own OOM
      controller, not the kernel's, watches node memory pressure and kills a
      whole pod cgroup with SIGKILL. Its default ranking, documented at
      docs.siderolabs.com under the OOM handler, scores every cgroup that has
      memory.max as zero and ranks the rest by usage, weighted 1.0 for
      BestEffort and 0.5 for Burstable. A pod cgroup gets memory.max only when
      every container in it, init containers included, has a memory limit. So
      the victims are the pods with no complete limit: on 2026-09-26 Cilium and
      OpenEBS (35 kills), then the Immich server, whose init container had no
      limit; on 2026-09-29, once that was fixed, kube-apiserver - no limit at
      all - and Sure, whose init container had none. Pods with limits are never
      touched, however large.
    tell: >-
      `talosctl -n 192.168.8.10 dmesg | grep -E "OOM controller|SIGKILL to
      cgroup"` names each victim's pod UID; match it with `kubectl get pods -A
      -o custom-columns=UID:.metadata.uid,NAME:.metadata.name`. `talosctl -n
      192.168.8.10 memory` shows AVAILABLE; it was 534 MB of 11708 during the
      Immich import. The pod's own memory.events shows no oom_kill.
    fix: >-
      Decide which pod has no memory limit, because that is the one it kills.
      Since 2026-09-29 Immich machine learning deliberately has none: it is
      stateless and the largest unlimited pod under load, so it goes first.
      Every other pod carries a limit on every container, init containers
      included: the applications in their manifests, Cilium in its Helmfile
      values, OpenEBS in its HelmRelease, and kube-apiserver, the controller
      manager and the scheduler in the Talos patch (cluster.*.resources) -
      all set far above use, only to take them out of the ranking. Raising a
      container's limit changes nothing; adding a missing one does.
    diagnosed: 2026-09-26, the first phone upload into Immich

  - id: helmfile-diff-applies-the-prepare-hook
    applies_to: [helmfile, talos, kubernetes]
    symptom: >-
      `helmfile diff`, `template` or `build` in core/02-platform changes the
      cluster, although each promises only to show what it would do.
    cause: >-
      Helmfile runs `prepare` hooks before every command, diff included, and
      this one server-side applies the Gateway API CRDs and the Infisical
      machine credential from prepare-hook/.
    tell: Lines prefixed `hook[prepare] logs |` ending in serverside-applied.
    fix: >-
      Harmless while prepare-hook/ matches the cluster, since the apply is
      idempotent. To preview with no side effect, call the plugin helmfile
      uses directly: `helm diff upgrade cilium cilium/cilium --version <v> -n
      kube-system -f values/cilium-values.yaml`.
      Every apply of the Cilium release also regenerates cilium-ca and the
      Hubble certificates; that is the chart, not drift.
    diagnosed: 2026-09-26, adding CPU requests to Cilium

  - id: immich-ml-spins-after-its-queue-empties
    applies_to: [immich, beelink]
    symptom: >-
      Immich machine learning holds a whole core - its CPU limit - with every
      Immich queue empty, the server idle and nothing in its own log.
    cause: >-
      Unconfirmed. The gunicorn worker kept burning CPU after the first
      import's faces, smart search and OCR were done; a restart left it idle,
      so it is state left behind by the work, not load. Inside the container
      /proc reports no CPU for any of its processes, which hides it.
    tell: >-
      `talosctl -n 192.168.8.10 processes` twice, ten seconds apart: the
      gunicorn worker's CPU-TIME grows by ten seconds. `kubectl top` shows
      the pod at 1000m while the Immich job queues in Valkey are all zero.
    fix: >-
      `kubectl -n immich rollout restart deploy/machine-learning`. It is
      stateless, so the restart costs only a model reload on the next job.
    diagnosed: 2026-09-26, after the first phone import

  - id: router-reflash-wipes-everything
    applies_to: [router, glinet, dhcp, dns, beelink, proxmox]
    symptom: >-
      After the router is recovered from a failed firmware update, `*.home`
      stops resolving, Proxmox is unreachable, the Beelink answers on a pool
      address instead of .10, and ssh to the router refuses the key.
    cause: >-
      Flashing the firmware again keeps no settings. DHCP reservations, the
      AdGuard rewrite, the LuCI-made VLAN 10 and its zone, WireGuard keys and
      peers, Wi-Fi names and the ssh key all go at once.
    tell: >-
      ssh warns REMOTE HOST IDENTIFICATION HAS CHANGED, then Permission
      denied; the SSIDs are back to GL-MT6000-xxx; `dig +short x.home
      @192.168.8.1` returns nothing.
    fix: >-
      Rebuild through the UI from hosts/router.yaml, which is the only record
      that survived. Take a configuration backup in the GL.iNet UI before every
      firmware update, and keep it out of this repository - it holds keys.
      Nothing whose address others depend on should take it from the router:
      see decisions/0028.
    diagnosed: 2026-09-29, rebuilding after the 2026-09-28 reflash

  - id: talos-shutdown-leaves-failed-pods
    applies_to: [talos, kubernetes, beelink]
    symptom: >-
      `kubectl get pods -A` lists pods in Error or Completed, some days old,
      while the same workloads also have Running pods and every deployment is
      ready.
    cause: >-
      Graceful node shutdown. Before the Beelink powers off, kubelet stops
      every pod - Failed if a container exited non-zero, Succeeded if it
      exited cleanly - and after boot the ReplicaSets create new pods
      instead. The controller manager keeps terminated pods until 12500
      of them exist, so every shutdown adds one more set.
    tell: >-
      `kubectl get pods -A --field-selector=status.phase=Failed -o
      custom-columns=POD:.metadata.name,MSG:.status.message` shows "Pod was
      terminated in response to imminent node shutdown" on every row. A
      Completed pod owned by a ReplicaSet rather than a Job is the same
      leftover.
    fix: >-
      Harmless. `kubectl delete pods -A --field-selector=status.phase=Failed`
      clears the Failed ones; the Succeeded ones need picking out by owner,
      since a Job's finished pods are Succeeded too. Both touch only pods that
      already stopped.
    diagnosed: 2026-09-29, 49 of them - 18 Failed, 31 Succeeded - from
      shutdowns since 2026-09-19

  - id: pods-read-running-straight-after-an-etcd-recovery
    applies_to: [talos, etcd, kubernetes, beelink]
    symptom: >-
      Seconds after `talosctl bootstrap --recover-from`, `kubectl get pods`
      shows every pod Running and ready, while the services do not answer.
    cause: >-
      Those statuses are the snapshot's, not the node's. After an EPHEMERAL
      wipe no container exists and no image is on disk; kubelet first logs
      "node not found" until kube-apiserver is back, then rebuilds each pod
      and pulls its images, and only then do the statuses turn true.
    tell: >-
      `talosctl -n 192.168.8.10 containers -k | grep -c CONTAINER_RUNNING` is a
      handful instead of about 45.
    fix: >-
      Wait on the node, not on the API: count running containers until it is
      near its usual number, then check the routes. On 2026-09-29 that took
      under nine minutes from the wipe.
    diagnosed: 2026-09-29, wiping EPHEMERAL for swap

  - id: talos-sees-no-serial-on-sata-disks
    applies_to: [talos, worker-1, core, disks]
    symptom: >-
      The first configuration apply is refused with "no disks matched the
      expression: glob(\"<serial>\", disk.serial)", although `talosctl get
      disks` lists a disk whose row ends in that very serial.
    cause: >-
      For these SATA disks Talos fills no serial field. The number sits at the
      end of the WWID instead, after runs of spaces -
      `t10.ATA     M.2 SSD 128GB                           GSMB2092400746` -
      and the table view makes it look like the SERIAL column.
    tell: >-
      `talosctl get disks -o yaml` has a wwid line and no serial line for the
      disk. core's HDDs showed the same, which is why its storage.yaml selects
      them by WWID.
    fix: >-
      Select by WWID with a glob on its tail: `diskSelector: {wwid:
      "*GSMB2092400746"}`, or `disk.wwid` in a volume's match expression. The
      refused apply changes nothing on the node.
    diagnosed: 2026-09-29, installing satellite

  - id: infisical-free-plan-refuses-external-intermediates
    applies_to: [infisical, pki, tls, worker-1]
    symptom: >-
      An intermediate CA created in Infisical's Certificate Manager stays in
      pending-certificate: importing the certificate an external root signed
      for its CSR fails.
    cause: >-
      A plan restriction, not a format problem: "Failed to import an
      externally signed certificate for this intermediate CA due to plan
      restriction. Upgrade plan to use externally signed intermediate CAs."
      Creating the CA and fetching its CSR both work on the free plan, so the
      wall appears only at the last step.
    tell: The import-certificate call returns 400 with that message.
    fix: >-
      Either pay, or keep the intermediate outside Infisical PKI: generate its
      key locally, sign it with the root, and store key and chain as ordinary
      Infisical secrets for cert-manager's CA issuer.
    diagnosed: 2026-09-30, building satellite's certificates

  - id: ignore-changes-pins-the-maintenance-address
    applies_to: [terraform, talos, worker-1]
    symptom: >-
      A later `terraform apply` of a node's configuration sits in "Still
      modifying..." and never reaches the node, although the node answers at
      its real address.
    cause: >-
      The first apply went to the node's maintenance address, and
      `lifecycle { ignore_changes = [node, endpoint] }` then kept that address
      in state for good. Every later apply went to a DHCP address nothing
      answers any more.
    tell: >-
      `terraform state show talos_machine_configuration_apply.<name>` shows the
      maintenance address in node and endpoint.
    fix: >-
      No ignore_changes on node and endpoint: coalesce the one-time variable
      with the real address, so the plan moves them once the variable is
      dropped. The satellite cluster of 2026-09-29 had the same bug, which is
      why an apply to it hung there.
    diagnosed: 2026-09-30, tainting satellite as core's worker

  - id: talos-cannot-taint-its-own-worker
    applies_to: [talos, kubernetes, worker-1]
    symptom: >-
      machine.nodeTaints on a worker lands in the machine configuration and in
      a NodeTaintSpec, but the Kubernetes node never shows the taint.
    cause: >-
      On a worker Talos applies taints with the node's own kubelet
      credentials, and the NodeRestriction admission plugin forbids a node to
      change its taints. The controller logs `node "satellite" is not allowed
      to modify taints` and retries for ever.
    tell: >-
      `talosctl logs controller-runtime` on the worker, NodeApplyController
      failing with that message.
    fix: >-
      Set the taint through the kubelet instead -
      `machine.kubelet.extraConfig.registerWithTaints` - which applies when the
      node registers. On a node already registered, change the taint with
      `kubectl taint` as admin too - done when homelab/satellite became
      homelab/dedicated=worker-1 - or delete the Node object and restart the
      kubelet so it registers again.
    diagnosed: 2026-09-30, tainting satellite

  - id: nvme-names-swap-under-the-install-disk
    applies_to: [talos, core, disks]
    symptom: >-
      Nothing yet - the danger was caught. After a reset the Beelink's two
      NVMe drives came up with their names swapped: the system disk at
      nvme0n1, and the WD holding every OpenEBS volume at nvme1n1, the very
      name the configuration gave as the install disk.
    cause: >-
      Device names follow probe order, not identity. The configuration named
      /dev/nvme1n1 beside a diskSelector by serial; and the Talos generator
      always writes its own default `disk: /dev/sda` (an HDD here), which no
      patch can blank - an empty string merges as nothing.
    tell: >-
      `talosctl get disks --insecure` in maintenance mode: compare the serial
      beside each name with the one the configuration selects.
    fix: >-
      Select the install disk by serial or WWID only, never by name; it is
      safe only because diskSelector "always has priority over disk", as the
      Talos reference puts it. Check the rendered install section before the
      first apply of a reinstall.
    diagnosed: 2026-09-30, rebuilding core

  - id: terraform-console-renders-the-configuration-already-applied
    applies_to: [terraform, talos]
    symptom: >-
      A patch under core/01-talos is changed and `terraform plan` shows the
      node's configuration changing, but `talosctl apply-config --dry-run`
      of the configuration rendered through `terraform console` reports "No
      changes".
    cause: >-
      terraform console evaluates data sources from state, as the last apply
      left them, not from the patch files on disk. It hands back the
      configuration the node already has.
    fix: >-
      Take the configuration from the saved plan instead, into a file and
      never onto the screen: `terraform show -json <plan> | jq -r
      '.resource_changes[] | select(.address ==
      "talos_machine_configuration_apply.<name>") |
      .change.after.machine_configuration_input'`. Then validate --strict and
      dry-run that file, and delete it.
    diagnosed: 2026-09-30, renaming worker-1's taint

  - id: volsync-movers-cannot-pass-a-taint
    applies_to: [volsync, kubernetes, worker-1]
    symptom: >-
      A backed-up claim on a tainted node never restores and never backs up:
      the mover pod stays Pending with "untolerated taint", and the
      ReplicationSource shows no lastSyncTime.
    cause: >-
      VolSync's ReplicationSource and ReplicationDestination take
      moverAffinity, moverResources and moverSecurityContext, but no
      tolerations - through 0.16.0 at least. A mover must run beside the
      volume it reads or fills, and on worker-1 its taint turns it away.
    fix: >-
      Keep backed-up claims off tainted nodes - decisions/0035. The
      namespace-wide way round it, the PodTolerationRestriction admission
      plugin, was weighed there and not taken.
    diagnosed: 2026-09-30, planning Sure's move to worker-1

  - id: uhd-600-finds-no-faces
    applies_to: [immich, openvino, gpu, worker-1]
    symptom: >-
      Immich's machine learning on worker-1's UHD 600 answers every request,
      CLIP included and correct, but finds no faces - none even at a minimum
      score of 0.05, on a photograph where controlplane finds two at 0.78.
    cause: >-
      OpenVINO's GPU plugin on this Gen9.5 iGPU, through the image's
      intel-opencl-icd-legacy1 runtime, returns 0.5 for every score of
      buffalo_l's detector - a sigmoid of nothing. The same model on the same
      node through OpenVINO's CPU device matches ONNX Runtime exactly, and
      is twice as fast as the broken GPU run.
    tell: >-
      Run the detector's model.onnx through onnxruntime with
      OpenVINOExecutionProvider and device_type GPU, then CPU: the score
      outputs' maximum is 0.5 on GPU and about 0.8 on CPU.
    fix: >-
      Give the pod no gpu.intel.com/i915 on worker-1: with no GPU, Immich's
      OpenVINO build falls back to the CPU device by itself. The plain CPU
      image is correct too but, with no AVX here, spends 5.6 s on the faces
      OpenVINO does in 1.7. The GPU plugin's DaemonSet stays off worker-1, so
      nothing can ask for this GPU by mistake.
    diagnosed: 2026-09-30, testing machine learning on worker-1

  - id: an-oom-killed-mover-leaves-a-restic-lock
    applies_to: [volsync, restic, talos, memory, backup]
    symptom: >-
      One service's ReplicationSource retries for ever: a new volsync-src
      pod every minute or two, each ending in Error, a dozen of them piling
      up, while the other services back up on time. Each attempt saves a
      snapshot - the backup itself works - and then fails.
    cause: >-
      An earlier mover was killed mid-run and left its lock in the restic
      repository; `restic forget` then refuses with "repository is already
      locked by PID ... on volsync-src-data-<old pod>". VolSync never clears
      a lock by itself. Here the killer was Talos's OOM controller, on
      2026-10-01 at 01:30, while a phone import held controlplane at 0.57 GiB
      available: the movers had no resources, so they were BestEffort and
      the first pod it took. It killed machine learning five seconds later.
    tell: >-
      The mover's log ends in "unable to create lock in backend" with the
      lock's age, and `talosctl logs controller-runtime` shows "Sending
      SIGKILL to cgroup .../kubepods/besteffort/..." at the time the lock was
      made.
    fix: >-
      Set spec.restic.unlock on the ReplicationSource to any new string -
      `kubectl patch ... -p '{"spec":{"restic":{"unlock":"<anything new>"}}}'`
      - and the next run removes the stale lock; status.restic.lastUnlocked
      echoes the string. Flux leaves the field alone, as it does not own it.
      Prevented since then by moverResources in backed-up-volume: with a
      memory limit the OOM controller scores a mover zero.
    diagnosed: 2026-10-01, Uptime Kuma's backup stuck since 01:30

  - id: gateway-503s-a-service-with-local-traffic-policy
    applies_to: [cilium, gateway, kubernetes, torrent, worker-1]
    symptom: >-
      One route through the Gateway answers 503 "no healthy upstream", server
      envoy, while the same Service answers by its own address and every
      other route through the Gateway works. From the Mac it worked; from a
      pod on worker-1 it never did.
    cause: >-
      The route's backend was a LoadBalancer Service with
      externalTrafficPolicy: Local, there so qBittorrent sees the LAN
      client's address. Cilium's Envoy honours that policy for Gateway
      traffic too, and keeps only endpoints on its own node: the node without
      the pod has none. Today the Gateway's address is announced from
      controlplane, where the pod is, so only worker-1's own traffic showed it;
      had the announcement moved to worker-1, the whole house would have had
      the 503.
    tell: >-
      `curl -D -` through the Gateway from a pod on the other node shows
      "no healthy upstream"; `kubectl get svc -o
      jsonpath='{.spec.externalTrafficPolicy}'` on the backend says Local.
    fix: >-
      Point the HTTPRoute at a ClusterIP Service on the same pods
      (torrent-web), and keep the Local policy only on the LoadBalancer
      Service that needs it.
    diagnosed: 2026-10-01, Gatus's first run from worker-1

  - id: cilium-gateway-cannot-reach-outside-the-cluster
    applies_to: [cilium, gateway, router, kubernetes]
    symptom: >-
      An HTTPRoute to a Service whose hand-written EndpointSlice names an
      address outside the cluster - here the router's Gatus at
      192.168.8.1:8090 - answers "upstream connect error or disconnect/reset
      before headers. reset reason: connection timeout". A pod on either node
      reaches the same address at once.
    cause: >-
      Cilium's Envoy opens the connection from the Gateway's own address,
      10.244.0.42, with a transparent socket; BPF masquerades it to the node's
      192.168.8.10 and the router's SYN-ACK comes back and is translated back.
      But the reply is never given the 0x200 mark that routes it to the
      socket (ip rule fwmark 0x200 lookup 2004), so it follows the pod-CIDR
      route into cilium_host and is lost - no drop event, no RST. Cilium's
      maintainers do not support manual EndpointSlices behind Gateway API at
      all, because such slices can point a Service anywhere
      (kubernetes#103675): cilium/cilium#46798, open since 2026-06.
    tell: >-
      On the router, conntrack holds the connection in SYN_RECV with the
      SYN-ACK retransmitted; on controlplane, `talosctl pcap -i br0` shows the
      SYN-ACK arriving and the SYN repeated; `cilium-dbg bpf nat list` shows
      both directions translated; `ss state syn-sent` in the host namespace
      shows 10.244.0.42 as the local address.
    fix: >-
      Send the route to a pod that forwards: socat in the router namespace
      (gatus-proxy). Envoy Gateway's Backend resource is the way without a
      pod, at the price of replacing the Gateway implementation.
    diagnosed: 2026-10-01, putting the router's Gatus behind gatus.home

  - id: downloads-saturate-the-wd
    applies_to: [torrent, qbittorrent, openebs, lvm, controlplane, disks]
    symptom: >-
      NodeDiskIOSaturation fires on controlplane for nvme1n1 - the WD - and
      for dm-1, dm-2 and one more dm device, for half an hour at a time:
      2026-10-01 19:20-19:40 and 2026-10-02 18:45-18:55. Everything on the
      WD's volumes, the databases included, waits behind it meanwhile.
    cause: >-
      qBittorrent filling its staging volume, torrent/cache: up to 428 MB/s
      of reads and writes from that pod, pieces written out of order, six
      downloads at once. Two things multiplied it. The thin pool zeroed every
      fresh chunk before use, doubling the writes into new space, and the
      staging volume is nothing but new space; and libtorrent's
      memory-mapped files flushed from the page cache in bursts. The WD has
      one PCIe 3.0 lane.
    tell: >-
      Read the device names: dm-1 and dm-2 are nvme_thinpool_tdata and
      nvme_thinpool-tpool, and /sys/block/dm-N/dm/name in the OpenEBS node
      plugin names the volume - here pvc-cd048311..., torrent/cache. `lvs -o
      zero` showing "zero" on the pool, and the torrent pod topping
      container_fs reads and writes in the same window.
    fix: >-
      Since 2026-10-02: lvchange --zero n on both thin pools, in the pool
      Jobs so a rebuild keeps it; qBittorrent on DiskIOType=Posix and three
      active downloads instead of six. If it still fires, the staging volume
      can move to its own disk.
    diagnosed: 2026-10-02, from the alert on dash.home

  - id: every-volsync-run-rewrites-the-xfs-log
    applies_to: [volsync, openebs, lvm, xfs, controlplane, disks]
    symptom: >-
      The WD's thin pool (dm-1, nvme_thinpool_tdata) writes about 2 GB an
      hour at rest, while every volume on it together writes a fifth of that.
      Per minute, the excess is six spikes of 220-275 MB an hour, each a
      minute after a service's backup minute.
    cause: >-
      Each VolSync run snapshots the claim and mounts a clone of it. XFS
      refuses two mounted filesystems with one UUID, so OpenEBS gives the
      clone a new one first - xfs_admin, "Clearing log and setting UUID" in
      the node plugin's log - and that writes the whole log and every
      superblock, each write copying a 256 KiB chunk the clone still shares.
      About 225 MB whatever the claim's size: 2Gi Vaultwarden costs what
      20Gi Immich does. Six services hourly come to some 32 GB a day, two
      thirds of the WD's writes outside downloads.
    tell: >-
      increase(node_disk_written_bytes_total{device="dm-1"}[1m]) spiking at
      a backup minute plus one, and "Successfully updated xfs filesystem
      UUID" for a volsync-src claim at the same time.
    fix: >-
      The cost is per run, so fewer runs is the lever: nightly since
      2026-10-03, about 1.4 GB a day instead of 32. ext4, which allows
      duplicate UUIDs, may avoid it altogether, but means recreating every
      claim; untested.
    diagnosed: 2026-10-03, looking for what wears the WD

  - id: external-dns-follows-the-gateway-target-whatever-the-flags
    applies_to: [external-dns, gateway-api, dns, cloudflare, bind]
    symptom: >-
      A second external-dns, meant to publish the .home names as A records
      to the Gateway's address, plans CNAMEs to the Cloudflare tunnel
      instead - and with a provider that cannot take them, writes nothing
      and reports "All records are already up to date".
    cause: >-
      The gateway-httproute source takes its target from the Gateway's
      external-dns.kubernetes.io/target annotation, set there for the
      Cloudflare instance. --default-targets with --force-default-targets
      does not override it in external-dns 0.23.
    tell: >-
      At logLevel debug, "Endpoints generated from HTTPRoute ..." lists the
      .home names with the tunnel's cfargotunnel.com as their target.
    fix: >-
      Give the second instance its own --annotation-prefix (core:
      bind.external-dns.kubernetes.io/). It then reads no target annotation
      and falls back to the Gateway's status address, 192.168.8.15. A regex
      filter keeps home-redirect's *.home out as well.
    diagnosed: 2026-10-03, publishing .home from core

  - id: glinet-adguard-admits-only-the-router-session
    applies_to: [router, glinet, adguard, dns, external-dns]
    symptom: >-
      AdGuard Home's API on the router answers 401 to every client: with no
      credentials, with basic auth for a user added to its config.yaml, and
      on loopback.
    cause: >-
      The firmware starts it with --glinet. In that mode upstream AdGuard
      (internal/home/authglinet.go, 0.107.73) swaps its own authentication
      for one check: an Admin-Token cookie naming a fresh
      /tmp/gl_token_<token> file, which only the router's login writes. Its
      own users are not consulted at all - it is one middleware or the
      other.
    tell: >-
      `ps w | grep AdGuardHome` on the router shows --glinet; the 401 does
      not change with a user in config.yaml.
    fix: >-
      Leave AdGuard alone and let nothing else write to it. Removing
      --glinet works, but takes AdGuard out from behind the router's login,
      edits a file the firmware owns and restores on upgrade, and was undone
      on 2026-10-03. .home is BIND on the router instead (decisions/0039);
      AdGuard only forwards to it.
    diagnosed: 2026-09-29 for Homepage's widget, confirmed 2026-10-03 for external-dns

  - id: infisical-jwt-auth-refuses-a-computed-public-key
    applies_to: [terraform, infisical, jwt, proxmox]
    symptom: >-
      terraform validate and plan stop at infisical_identity_jwt_auth with
      configuration_type static: "public_keys[0] is not a valid PEM-encoded
      key", although the key is a sound PEM.
    cause: >-
      The provider's ValidateConfig (0.19.38, internal/provider/resource/
      identity_jwt_auth.go; the same since the resource appeared in March
      2026) reads public_keys while Terraform still holds a computed element
      as unknown, turns it into an empty string and fails pem.Decode on it.
      It checks only that the list itself is known, not its elements.
    tell: >-
      The same key from file() validates; from tls_public_key, or any other
      resource or data source, it does not.
    fix: >-
      None in the provider yet. The lab gave Infisical the key by hand once,
      which holds because its Talos secrets no longer change at a rebuild
      (the lab repository's decisions/0010 and 0011). A key from a file
      kept in step with the secrets would also pass.
    diagnosed: 2026-10-04, moving the lab's External Secrets to JWT
