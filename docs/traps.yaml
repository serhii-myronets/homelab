# Things that have already cost time here. Each was diagnosed from a real
# failure, not read in a manual. Check this file before debugging anything
# that "should work".

meta:
  updated: 2026-09-19
  tags: [traps, gotchas, debugging, portainer, caddy, docker, networking, tailscale, wireguard, helmfile, kubernetes, samba]

traps:
  - id: cilium-bridge-needs-explicit-device
    applies_to: [cilium, talos, networking]
    symptom: Cilium's agent exits with "unable to determine direct routing device".
    cause: "The node's LAN IP is assigned to a Talos bridge, so Cilium cannot infer a physical direct-routing device."
    fix: "Set `nodePort.directRoutingDevice: br0` and `devices: br0` in the Cilium Helm values, then run `kubectl -n kube-system rollout restart daemonset/cilium`; the config init container only runs for a new pod."
    diagnosed: 2026-09-18, on the Beelink

  - id: cilium-iptables-masquerade-breaks-nodeport
    applies_to: [cilium, talos, networking, kubernetes]
    symptom: >-
      A LoadBalancer or NodePort Service accepts TCP connections from the LAN,
      then hangs until the client resets. The pod receives the request and
      answers; from inside the cluster the same address works. The Cilium
      Gateway, served by Envoy on the host, is unaffected.
    cause: >-
      With kube-proxy replacement and iptables masquerading, the SYN-ACK
      leaves with the service port, but data segments are masqueraded by
      iptables first. They leave from the node IP with the pod's port, which
      the client does not recognise.
    fix: >-
      Set `bpf.masquerade: true` in the Cilium values and restart the
      DaemonSet. `cilium-dbg status` must report `Masquerading: BPF`. A
      capture on br0 with `talosctl pcap` shows the wrong source port.
    diagnosed: 2026-09-18, on the Beelink

  - id: samba-guest-writes-need-group-and-no-nfs-aces
    applies_to: [samba, kubernetes, macos]
    symptom: >-
      A guest share with `force user` returns ACCESS_DENIED for creating files
      in a directory owned by that user with mode 0755; after that is fixed,
      guests still cannot write inside directories created from macOS.
    cause: >-
      Samba's own access check does not match the guest session to the
      directory owner, only to its group. Separately, the fruit module lets
      Finder reset each new directory to 0755 through NFS ACEs, after
      `force directory mode` has applied.
    fix: >-
      Keep share roots and everything below group-writable (0775/0664 with
      matching `force create mode` and `force directory mode`), and set
      `fruit:nfs_aces = no`. World-writable modes also work.
    diagnosed: 2026-09-18, on the Beelink

  - id: no-wildcard-under-a-top-level-name
    applies_to: [cert-manager, tls, macos]
    symptom: >-
      macOS reports "Host name mismatch" for a certificate whose SAN is
      "*.home", and browsers keep warning even with its root installed.
    cause: >-
      Apple and Chrome refuse a wildcard directly under a top-level name,
      because it would cover every name under it. Caddy never served one: its
      `*.home` block matched hostnames, while `tls internal on_demand` minted
      a separate certificate for each name as it was first requested.
    fix: >-
      List each local name in the certificate, and add a name there in the
      same change that adds its route. A wildcard works one level deeper, on
      a real domain such as *.lan.example.com.
    diagnosed: 2026-09-19, on the Beelink

  - id: apple-needs-serverauth
    applies_to: [cert-manager, tls, macos]
    symptom: >-
      A certificate from a trusted local authority is still rejected, and
      curl reports verification failure.
    cause: >-
      cert-manager issues without an extendedKeyUsage unless asked, and Apple
      platforms require serverAuth on a TLS server certificate.
    fix: 'Set usages: [server auth, digital signature, key encipherment].'
    diagnosed: 2026-09-19, on the Beelink

  - id: qbittorrent-prefers-its-own-config
    applies_to: [qbittorrent, kubernetes]
    symptom: >-
      Changes to qBittorrent.conf never take effect, and the file it writes
      keeps the old values.
    cause: >-
      qBittorrent reads qBittorrent_new.conf when it exists and only falls
      back to qBittorrent.conf, and it rewrites that file from memory when it
      shuts down.
    fix: >-
      Copy the file from Git into the volume at startup and delete
      qBittorrent_new.conf there, rather than mounting the configuration
      read-only. To fix a running instance, delete the file and kill the pod
      without a graceful stop, which would write it back.
    diagnosed: 2026-09-19, on the Beelink

  - id: gluetun-ships-dead-vpn-servers
    applies_to: [gluetun, nordvpn, kubernetes]
    symptom: >-
      OpenVPN reports "TLS handshake failed" or the host being unreachable on
      one server after another, and connects only occasionally.
    cause: >-
      The server list built into the image holds addresses the provider no
      longer answers on, and gluetun picks from it at random. NordVPN's own
      API returns different, reachable addresses.
    fix: >-
      Give gluetun a volume for /gluetun and set UPDATER_PERIOD: it rewrites
      the list there, but only on that period and never at startup, so the
      list has to survive restarts to be of use. Shorten the wait on a dead
      address with OPENVPN_FLAGS "--connect-timeout 10 --hand-window 20".
      SERVER_HOSTNAMES only accepts names already in the stale list, and
      VPN_ENDPOINT_IP pins one server. After the first refresh here the
      tunnel came up in 24 seconds instead of minutes.
    diagnosed: 2026-09-19, on the Beelink

  - id: cilium-hides-the-client-address
    applies_to: [cilium, kubernetes, networking]
    symptom: >-
      A service that trusts LAN addresses rejects LAN clients; the pod sees
      the node's cilium_host address instead.
    cause: >-
      Traffic through the LoadBalancer is masqueraded even with
      externalTrafficPolicy set to Local. Not understood further.
    fix: >-
      Until this is understood, trust the pod network too, or use the
      service's own authentication.
    diagnosed: 2026-09-19, on the Beelink

  - id: talos-provider-lags-the-machine-config
    applies_to: [talos, terraform]
    symptom: >-
      `terraform plan` fails with "config_patches are invalid ... error
      decoding document v1alpha1/LVMVolumeGroupConfig: not registered".
    cause: >-
      Provider 0.11.0 generates and validates against the v1.13 machine
      configuration contract, so documents added in Talos 1.14 are unknown to
      it even though the node supports them.
    fix: >-
      Do it another way until a stable provider ships the newer contract; the
      LVM volume group is created by a job in the cluster instead. Applying
      such a document with `talosctl patch` would be undone by the next
      `terraform apply`, which writes the whole machine configuration.
    diagnosed: 2026-09-19, on the Beelink

  - id: openebs-lvm-thin-pool-sized-to-first-claim
    applies_to: [openebs, lvm, kubernetes]
    symptom: >-
      Thin volumes run out of space long before the disk does.
    cause: >-
      When a thin pool is missing, lvm-localpv creates one as large as the
      claim being provisioned, and every later claim shares that pool.
    fix: >-
      Create the pool first, over nearly the whole volume group, and publish
      the StorageClass only afterwards - a claim cannot bind to a class that
      does not exist yet, so none can create a small pool. Watch the pool's
      usage: when a thin pool fills, every volume in it stops accepting
      writes.
    diagnosed: 2026-09-19, on the Beelink

  - id: openebs-brings-a-second-snapshot-controller
    applies_to: [openebs, volsync, kubernetes]
    symptom: >-
      Two snapshot controllers watch the same VolumeSnapshot objects, at
      different versions, with nothing obviously broken.
    cause: >-
      The lvm-localpv chart runs a snapshot-controller container inside its
      CSI controller pod, next to the csi-snapshotter sidecar. Turning off
      `crds.csi.volumeSnapshots` only skips the CRDs; the controller has its
      own switch, and the chart's comment says a cluster should have one.
    tell: >-
      `kubectl get pods -n openebs -o jsonpath` over container names lists
      both `csi-snapshotter` and `snapshot-controller`.
    fix: >-
      Set `lvm-localpv.lvmController.snapshotController.enabled: false` and
      keep the cluster-wide controller in kube-system. The csi-snapshotter
      sidecar stays: it is the driver turning a VolumeSnapshot into an LVM
      snapshot, which is a different job.
    diagnosed: 2026-09-19, on the Beelink

  - id: argo-cannot-update-a-job
    applies_to: [argocd, kubernetes]
    symptom: >-
      A Job keeps running its old script after the change is pushed and
      synced.
    cause: A Job's pod template is immutable, so the update is rejected.
    fix: >-
      Delete the Job and let Argo recreate it. Jobs meant to be changed this
      way have to be safe to run twice.
    diagnosed: 2026-09-19, on the Beelink

  - id: openebs-lvm-mounts-a-volume-into-one-pod-only
    applies_to: [openebs, lvm, kubernetes]
    symptom: >-
      Several pods share one ReadWriteOnce claim on a single-node cluster.
      The first starts; the rest stay in ContainerCreating with
      `verifyMount: device already mounted at /var/lib/kubelet/pods/<the
      first pod>/...`.
    cause: >-
      ReadWriteOnce allows many pods on one node, but the LVM driver checks
      whether the logical volume is already mounted and refuses the second
      mount. For this driver the claim belongs to one pod, not one node.
    fix: >-
      Put the containers that share the volume in one pod, each under its
      own subPath, as the torrent and library stacks do, or give each its
      own claim.
    diagnosed: 2026-09-19, on the Beelink

  - id: volsync-populator-races-csi-leak-protection
    applies_to: [volsync, openebs, kubernetes]
    symptom: >-
      A claim with a VolSync dataSourceRef binds, but every pod fails to
      mount it with `lvmvolumes.local.openebs.io "pvc-..." not found`. The
      PV exists and is Bound; the logical volume behind it does not.
    cause: >-
      The populator provisions a temporary `vs-prime-...` claim, rebinds its
      PV to the real claim and deletes the temporary one. csi-provisioner's
      leak protection sees a claim vanish while it was provisioning and
      deletes the volume it just made. The CSI log names it outright -
      `leak_protection.go: deleted volume via csi driver if exists`. It is a
      race, so the same manifest can work one time and fail the next.
    fix: >-
      Delete the claim and let it be recreated; the second attempt usually
      wins. Pods holding the broken claim must go first, or its
      pvc-protection finalizer keeps it.
    diagnosed: 2026-09-19, on the Beelink

  - id: csistoragecapacity-keeps-a-dead-owner
    applies_to: [openebs, kubernetes, csi]
    symptom: >-
      After a CSI controller is rolled, its provisioner logs
      `CSIStorageCapacity ... is invalid: Only one reference can have
      Controller set to true` every few seconds, naming both the old and the
      new ReplicaSet.
    cause: >-
      The object is owned by the ReplicaSet that created it. A new ReplicaSet
      cannot add itself as a second controlling owner, and nothing removes
      the old one, so capacity is never updated again.
    fix: >-
      Delete the CSIStorageCapacity object. The running provisioner recreates
      it, owned by the live ReplicaSet.
    diagnosed: 2026-09-19, on the Beelink, after rolling OpenEBS

  - id: openebs-hostpath-needs-privileged-namespace
    applies_to: [openebs, kubernetes, talos]
    symptom: >-
      The first claim on an OpenEBS LocalPV Hostpath class stays Pending with
      ProvisioningFailed, and its pod cannot be scheduled.
    cause: >-
      The provisioner creates each PVC directory from a privileged helper pod
      with a hostPath volume in its own namespace. Talos enforces the baseline
      Pod Security level by default, which rejects that pod.
    fix: >-
      Label the openebs namespace `pod-security.kubernetes.io/enforce:
      privileged`. The claim binds on the provisioner's next retry.
    diagnosed: 2026-09-19, on the Beelink

  - id: external-dns-target-annotation-lost-alpha
    applies_to: [external-dns, cloudflare, gateway-api]
    symptom: >-
      external-dns tries to create an A record with the Gateway's LAN address
      instead of a CNAME to the tunnel, and Cloudflare answers 400, code 9003:
      "Target 192.168.8.15 is not allowed for a proxied record".
    cause: >-
      external-dns 0.22 reads `external-dns.kubernetes.io/target` on the
      Gateway and silently ignores the older
      `external-dns.alpha.kubernetes.io/target`, so it falls back to the
      Gateway's own address. The target annotation is also ignored on routes.
    fix: >-
      Use the prefix without `alpha` on the Gateway. The failed attempt can
      leave an `a-<name>` ownership TXT record behind; delete it by hand.
    diagnosed: 2026-09-19, on the Beelink

  - id: cilium-gateway-api-needs-v1-6-crds
    applies_to: [cilium, gateway-api, kubernetes]
    symptom: >-
      GatewayClass and Gateway stay Pending with "Waiting for controller" and
      no LoadBalancer Service is created.
    cause: >-
      Cilium 1.20 requires Gateway API v1.6.1 or newer. The old v1.2.0
      standard CRDs lack TLSRoute and BackendTLSPolicy and expose
      ReferenceGrant only as v1beta1, so Cilium does not start its Gateway
      controller.
    fix: >-
      Apply Gateway API v1.6.1 standard CRDs server-side, then verify the
      Cilium operator reports the Gateway controller as running. Existing
      Gateway resources reconcile automatically.
    diagnosed: 2026-09-18, on the Beelink

  - id: helmfile-build-runs-prepare-hooks
    applies_to: [helmfile, kubernetes]
    symptom: A command intended to inspect the rendered Helmfile changes the cluster.
    cause: Helmfile executes `prepare` hooks for `build`, before rendering releases.
    fix: Use `helm template` for each chart when read-only rendering is needed. Run Helmfile commands only when applying the hook is intentional.
    diagnosed: 2026-09-18, while validating the Beelink platform

  - id: talos-provider-partial-on-destroy
    applies_to: [terraform, talos]
    symptom: Provider 0.11.0 plan fails with a null conversion error for on_destroy.graceful.
    cause: A partial on_destroy object leaves boolean fields null in the provider.
    fix: Set reset, graceful and reboot explicitly.
    diagnosed: 2026-09-17

  - id: proxmenux-icon-is-in-selfhst
    applies_to: [homepage]
    symptom: ProxMenux cards show a broken logo.
    cause: The dashboard-icons PNG URL for proxmenux.png returns HTTP 404.
    fix: Use the full selfhst/icons PNG URL, as configured in the Homepage service cards.
    diagnosed: 2026-09-12

  - id: bind-mounted-file-pins-its-inode
    applies_to: [caddy, torrent]
    symptom: >-
      A file changed in git, the stack was pulled and redeployed, and the
      container still serves the old content.
    cause: >-
      Mounting a single file pins its inode. Git replaces files rather than
      editing them in place, so the host gets a new inode and the container
      keeps reading the old one. Compose does not recreate the container
      either, because the service definition never changed.
    fix: docker restart caddy
    evidence: host inode 76032888/1049 B vs container inode 76036078/1103 B

  - id: home-tld-needs-tls-internal
    applies_to: [caddy]
    symptom: >-
      Caddy retries certificate issuance for weeks and the real serhii.link
      certificates are at risk of a rate limit.
    cause: >-
      Without `tls internal` Caddy asks Let's Encrypt for a certificate and is
      rejected, because .home is not a real TLD. It then retries for 30 days.
    fix: Every .home site uses the internal TLS issuer, either `tls internal` or `issuer internal`.

  - id: portainer-additional-paths-takes-compose-files
    applies_to: [portainer]
    symptom: "failed to deploy: top-level object must be a mapping"
    cause: >-
      "Additional paths" takes additional *compose* files and merges them with
      -f. A non-YAML file there — a Caddyfile, say — fails the parse.
    fix: Leave the field empty.
    reproduce: docker compose -f docker-compose.yaml -f Caddyfile config

  - id: relative-path-volumes-is-creation-time-only
    applies_to: [portainer, caddy, torrent]
    symptom: "mount fails with ENOTDIR"
    cause: >-
      Without "Enable relative path volumes" Portainer resolves ./file inside
      its own container, where the Docker daemon cannot see it. The daemon
      creates an empty directory at that path instead, and the mount then hits
      a directory where a file was expected.
    fix: >-
      Tick it when the stack is *created* — the option is never offered when
      editing one, so a stack that needs it and lacks it has to be recreated.
      Required by any stack bind-mounting a file out of this repo.
    stacks_needing_it: [caddy, torrent]

  - id: flood-ignores-puid-pgid
    applies_to: [torrent]
    symptom: Flood cannot write its database.
    cause: Flood runs as uid 1001 and ignores PUID/PGID.
    fix: Its data directory must be owned by 1001:1001. core/bootstrap.sh handles it.

  - id: recreating-vpn-orphans-its-dependents
    applies_to: [torrent]
    status: fixed                    # kept because the shape recurs
    symptom: >-
      After redeploying the torrent stack, torrent.home and qbittorrent.home
      return 502 while every container shows as Up and both applications log
      that they are listening.
    cause: >-
      qbittorrent and flood run with network_mode "service:vpn", so they live
      in vpn's network namespace. Recreating vpn gives it a new namespace; the
      two dependents stay attached to the old one, which is now unreachable.
      They keep serving into a dead namespace.
    tell: >-
      `docker ps` shows vpn with a *shorter* uptime than the containers that
      depend on it, and `docker exec vpn netstat -tln` lists neither 3000 nor
      8080.
    fix_permanent: >-
      depends_on in the mapping form with `restart: true`, which is in
      core/torrent/docker-compose.yaml. Compose then restarts both dependents
      whenever it updates vpn, and `condition: service_healthy` makes them wait
      for the tunnel instead of racing it. Verified 2026-09-06 by recreating
      vpn alone within a whole-project up.
    fix_by_hand: >-
      Only needed if the definition is ever lost. `docker restart` works when
      vpn was *restarted*, but not when it was *recreated* — the dependents
      then reference a container id that no longer exists and refuse with
      "joining network namespace of container: No such container". Recreate
      them instead:
      `docker compose -p torrent up -d --force-recreate qbittorrent flood`
    caveat: >-
      `restart: true` applies when Compose updates the dependency during an up
      over the project. Targeting one service — `up -d --force-recreate vpn` —
      leaves the dependents out of scope and strands them exactly as before.
    diagnosed: 2026-09-06, after a Portainer redeploy of the torrent stack

  - id: flood-options-are-yargs-flags
    applies_to: [torrent]
    symptom: >-
      Flood asks to create an account, or exits 1 with Zod
      "expected string, received undefined".
    cause: >-
      FLOOD_OPTION_<name> maps onto Flood's CLI flags through yargs, so each
      name has to match a real flag exactly. Anything unrecognised is ignored
      in silence — FLOOD_DISABLE_AUTH is not a flag, and the URL variable is
      QBURL, not QBIT_URL.
    fix: >-
      AUTH=none, RUNDIR, QBURL, QBUSER, QBPASS. The last two look redundant
      because qBittorrent trusts 127.0.0.1 through its AuthSubnetWhitelist, but
      Flood will not start without them.

  - id: homepage-readonly-config-needs-log-mountpoint
    applies_to: [homepage]
    symptom: Container creation fails mounting tmpfs at /app/config/logs with read-only file system.
    cause: The parent config bind mount is read-only, so Docker cannot create the nested logs mountpoint.
    fix: Keep config/logs/.gitkeep in git so the directory exists before mounting tmpfs there.
    diagnosed: 2026-09-06, during a temporary Homepage launch on core

  - id: cilium-vip-conflicts-with-proxmox-guest
    applies_to: [kubernetes, proxmox, caddy]
    symptom: Gateway VIP port 80 refuses connections while its NodePort serves Grafana successfully.
    cause: >-
      The external Cilium pool spans 10.1.1.80-10.1.1.85 and assigned 10.1.1.80
      to main-gateway. Running Proxmox VM 111 (control-plane) also has
      ipconfig0=10.1.1.80/24. Proxmox's neighbor entry for that IP points to
      the VM MAC bc:24:11:81:14:e0, not the announcing Cilium worker MAC
      bc:24:11:ad:7f:f7. Requests therefore reach the other guest.
    evidence: >-
      Verified with qm config/status 111, ip neigh, the Cilium IP pool,
      L2 announcement table and BPF service map. The VIP has an L7 proxy
      entry; NodePort with Host grafana.home returns HTTP 200.
    fix: >-
      Allocate a non-overlapping range for Cilium in its GitOps source, or
      deliberately renumber VM 111 through its owning configuration. Verify
      address availability first; then reconcile the Gateway VIP and Caddy
      upstream. Do not stop or destroy the VM as a diagnostic shortcut.
    resolution: >-
      The owner moved VM 111 to 10.1.1.90 (verified in qm config). Initial
      probes timed out, then a packet capture confirmed ARP replies from the
      Cilium worker and HTTP probes returned 200. No ARP flush was performed.
    status: fixed
    diagnosed: 2026-09-06

  - id: home-wildcard-certificate-does-not-validate
    applies_to: [caddy]
    symptom: >-
      A *.home site with tls internal passes caddy validate, but curl rejects
      its certificate with no alternative certificate subject name matches.
    cause: >-
      The second-level wildcard certificate is rejected by the tested client.
      Caddy also suppresses individual core certificates covered by the wildcard.
    fix: >-
      Use tls internal with on_demand for the wildcard route, issuing individual
      hostname certificates. Exact core sites use tls force_automate with
      issuer internal. The installed image rejects force_automate as a nested
      subdirective, so use it as the tls argument. Verified with a fresh CA
      and certificate validation for both wildcard-routed and exact sites.
    diagnosed: 2026-09-07

  - id: glances-metrics-without-charts-overlap
    applies_to: [homepage]
    symptom: >-
      Several Glances metrics attached to one service card render on top of
      each other, unreadable, while each one alone is fine.
    cause: >-
      A Homepage glances widget shows one metric, and its graphless block is
      absolutely positioned. Stacking four of them in a single card puts four
      absolute blocks in the same place.
    fix: >-
      One metric per service entry, each with chart: true, grouped into their
      own Core and Proxmox groups. A graph is positioned normally and needs no
      styling. The CSS written to unpick the overlap — 35 lines pinning
      .service-container and labelling blocks by nth-last-child — was deleted
      once the graphs replaced it, and custom.css is empty again.
    also: >-
      The same metrics as header widgets in widgets.yaml are legible but
      crowd the header, which is what the service cards were reaching for.
    then_narrower: >-
      Graphs did not end it. A cpu metric prints the processor model beside
      its percentage, and at columns: 4 the card is too narrow to hold both,
      so "J4125 CPU @ 2.00GHz" and "10% Used" overlapped into one bold smear
      on core and on Proxmox alike. Nothing in the widget hides the model
      name — the options are only metric, chart, pointsLimit, refreshInterval
      and diskUnits — so the card has to be wide enough. columns: 2 gives it
      about 600 px and both ends separate cleanly.
    measured: >-
      Confirmed on a temporary Homepage on core, port 3001, against a copy of
      the config: at full width the model name and the percentage separate,
      at a quarter width they still collide. The container and its config
      directory were removed afterwards.
    settled_at: >-
      Six metrics per host, three to a row. At that width the processor model
      and its percentage still separate, so columns: 3 holds and no CSS is
      involved — custom.css stays empty.
    diagnosed: 2026-09-07, adding host metrics to Homepage

  - id: homepage-preview-without-tabs-lays-groups-out-as-a-grid
    applies_to: [homepage]
    symptom: >-
      A temporary Homepage serving a copy of the production config ignores
      style: row and columns entirely. Groups come out as narrow masonry
      columns and cards stack vertically, so a layout change cannot be judged.
    cause: >-
      The tab bar never hydrates in the preview — the DOM has no role="tab"
      and every group keeps the grid classes basis-1/2 lg:basis-1/3
      xl:basis-1/4, where production has the full-width basis-full and a
      grid-cols-N on services-list. Neither HOMEPAGE_ALLOWED_HOSTS spellings
      with and without the port, nor treating the origin as secure in the
      browser, brought the tabs back. The cause was not found.
    fix: >-
      Do not judge width from such a preview. Either cut the preview config
      down to the one group under test, which then spans the page, or add
      preview-only CSS reproducing what tabs do — flex-basis 100% on
      .services-group and grid-template-columns on .services-list — and keep
      it out of the commit.
    diagnosed: 2026-09-07, sizing the host metric cards

  - id: tailscale-subnet-router-loops-through-flint
    applies_to: [tailscale, router, proxmox]
    symptom: >-
      Proxmox becomes offline in Tailscale immediately after its advertised
      10.1.1.0/24 route is approved, and loses DNS and outbound connectivity.
    cause: >-
      Flint 2 accepts Tailscale subnet routes by default. It installed
      10.1.1.0/24 in Tailscale table 52 even though that subnet is directly
      attached as br-lan.10. Replies for Proxmox 10.1.1.100 then went into
      tailscale0 instead of the VLAN, cutting off the subnet router that
      advertised the route.
    fix: >-
      Set `tailscale set --accept-routes=false` on Flint 2 before approving
      the Proxmox route. Verify table 52 has peer /32 routes but no
      10.1.1.0/24 route. Flint advertises 192.168.8.0/24; Proxmox advertises
      10.1.1.0/24.
    fix_does_not_survive_reboot: >-
      That setting is lost on every router restart. /usr/bin/gl_tailscale:331
      runs `tailscale up --reset --accept-routes` each time the service
      starts, so --reset discards the stored preference and --accept-routes
      puts RouteAll back to true. Editing that script is not an option — see
      decisions/0007. A durable fix has to remove what Flint can accept:
      un-approve Proxmox's 10.1.1.0/24 in the Tailscale admin console, or
      stop Proxmox advertising it and have Flint advertise the VLAN instead,
      since br-lan.10 is directly attached to Flint anyway.
    recurred: >-
      2026-09-10, after a power cut restarted the router. RouteAll was true
      again, table 52 held 10.1.1.0/24 dev tailscale0, `ip route get
      10.1.1.100` chose tailscale0, and Tailscale showed Proxmox with
      tx 378612 rx 0 — sending into the tailnet and hearing nothing back.
      Proxmox itself was healthy throughout: from the router,
      `ping -I br-lan.10 10.1.1.100` answered in 0.6 ms with no loss, while
      an unforced ping to the same address lost every packet.
    diagnosed: 2026-09-08

  - id: wireguard-client-network-overlaps-vpn-and-lab
    applies_to: [wireguard, router, macos]
    symptom: >-
      WireGuard activates, but the client cannot reach LAN or lab resources;
      routes for the VPN gateway or lab use the physical interface.
    cause: >-
      The client's current network was 10.1.0.0/22, overlapping both the
      WireGuard client network 10.1.0.0/24 and homelab 10.1.1.0/24.
      More-specific connected routes won over tunnel routes.
    tell: >-
      `route -n get 10.1.0.1` or `route -n get 10.1.1.100` reports en0 rather
      than the WireGuard utun interface.
    fix: >-
      Renumber the WireGuard server and every peer to a less common subnet,
      for example 10.66.66.0/24.
    diagnosed: 2026-09-08
