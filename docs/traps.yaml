# Things that have already cost time here. Each was diagnosed from a real
# failure, not read in a manual. Check this file before debugging anything
# that "should work".

meta:
  updated: 2026-09-06
  tags: [traps, gotchas, debugging, portainer, caddy, docker]

traps:
  - id: bind-mounted-file-pins-its-inode
    applies_to: [caddy, torrent]
    symptom: >-
      A file changed in git, the stack was pulled and redeployed, and the
      container still serves the old content.
    cause: >-
      Mounting a single file pins its inode. Git replaces files rather than
      editing them in place, so the host gets a new inode and the container
      keeps reading the old one. Compose does not recreate the container
      either, because the service definition never changed.
    fix: docker restart caddy
    evidence: host inode 76032888/1049 B vs container inode 76036078/1103 B

  - id: home-tld-needs-tls-internal
    applies_to: [caddy]
    symptom: >-
      Caddy retries certificate issuance for weeks and the real serhii.link
      certificates are at risk of a rate limit.
    cause: >-
      Without `tls internal` Caddy asks Let's Encrypt for a certificate and is
      rejected, because .home is not a real TLD. It then retries for 30 days.
    fix: Every .home site uses the internal TLS issuer, either `tls internal` or `issuer internal`.

  - id: portainer-additional-paths-takes-compose-files
    applies_to: [portainer]
    symptom: "failed to deploy: top-level object must be a mapping"
    cause: >-
      "Additional paths" takes additional *compose* files and merges them with
      -f. A non-YAML file there — a Caddyfile, say — fails the parse.
    fix: Leave the field empty.
    reproduce: docker compose -f docker-compose.yaml -f Caddyfile config

  - id: relative-path-volumes-is-creation-time-only
    applies_to: [portainer, caddy, torrent]
    symptom: "mount fails with ENOTDIR"
    cause: >-
      Without "Enable relative path volumes" Portainer resolves ./file inside
      its own container, where the Docker daemon cannot see it. The daemon
      creates an empty directory at that path instead, and the mount then hits
      a directory where a file was expected.
    fix: >-
      Tick it when the stack is *created* — the option is never offered when
      editing one, so a stack that needs it and lacks it has to be recreated.
      Required by any stack bind-mounting a file out of this repo.
    stacks_needing_it: [caddy, torrent]

  - id: flood-ignores-puid-pgid
    applies_to: [torrent]
    symptom: Flood cannot write its database.
    cause: Flood runs as uid 1001 and ignores PUID/PGID.
    fix: Its data directory must be owned by 1001:1001. core/bootstrap.sh handles it.

  - id: recreating-vpn-orphans-its-dependents
    applies_to: [torrent]
    status: fixed                    # kept because the shape recurs
    symptom: >-
      After redeploying the torrent stack, torrent.home and qbittorrent.home
      return 502 while every container shows as Up and both applications log
      that they are listening.
    cause: >-
      qbittorrent and flood run with network_mode "service:vpn", so they live
      in vpn's network namespace. Recreating vpn gives it a new namespace; the
      two dependents stay attached to the old one, which is now unreachable.
      They keep serving into a dead namespace.
    tell: >-
      `docker ps` shows vpn with a *shorter* uptime than the containers that
      depend on it, and `docker exec vpn netstat -tln` lists neither 3000 nor
      8080.
    fix_permanent: >-
      depends_on in the mapping form with `restart: true`, which is in
      core/torrent/docker-compose.yaml. Compose then restarts both dependents
      whenever it updates vpn, and `condition: service_healthy` makes them wait
      for the tunnel instead of racing it. Verified 2026-09-06 by recreating
      vpn alone within a whole-project up.
    fix_by_hand: >-
      Only needed if the definition is ever lost. `docker restart` works when
      vpn was *restarted*, but not when it was *recreated* — the dependents
      then reference a container id that no longer exists and refuse with
      "joining network namespace of container: No such container". Recreate
      them instead:
      `docker compose -p torrent up -d --force-recreate qbittorrent flood`
    caveat: >-
      `restart: true` applies when Compose updates the dependency during an up
      over the project. Targeting one service — `up -d --force-recreate vpn` —
      leaves the dependents out of scope and strands them exactly as before.
    diagnosed: 2026-09-06, after a Portainer redeploy of the torrent stack

  - id: flood-options-are-yargs-flags
    applies_to: [torrent]
    symptom: >-
      Flood asks to create an account, or exits 1 with Zod
      "expected string, received undefined".
    cause: >-
      FLOOD_OPTION_<name> maps onto Flood's CLI flags through yargs, so each
      name has to match a real flag exactly. Anything unrecognised is ignored
      in silence — FLOOD_DISABLE_AUTH is not a flag, and the URL variable is
      QBURL, not QBIT_URL.
    fix: >-
      AUTH=none, RUNDIR, QBURL, QBUSER, QBPASS. The last two look redundant
      because qBittorrent trusts 127.0.0.1 through its AuthSubnetWhitelist, but
      Flood will not start without them.

  - id: homepage-readonly-config-needs-log-mountpoint
    applies_to: [homepage]
    symptom: Container creation fails mounting tmpfs at /app/config/logs with read-only file system.
    cause: The parent config bind mount is read-only, so Docker cannot create the nested logs mountpoint.
    fix: Keep config/logs/.gitkeep in git so the directory exists before mounting tmpfs there.
    diagnosed: 2026-09-06, during a temporary Homepage launch on core

  - id: cilium-vip-conflicts-with-proxmox-guest
    applies_to: [kubernetes, proxmox, caddy]
    symptom: Gateway VIP port 80 refuses connections while its NodePort serves Grafana successfully.
    cause: >-
      The external Cilium pool spans 10.1.1.80-10.1.1.85 and assigned 10.1.1.80
      to main-gateway. Running Proxmox VM 111 (control-plane) also has
      ipconfig0=10.1.1.80/24. Proxmox's neighbor entry for that IP points to
      the VM MAC bc:24:11:81:14:e0, not the announcing Cilium worker MAC
      bc:24:11:ad:7f:f7. Requests therefore reach the other guest.
    evidence: >-
      Verified with qm config/status 111, ip neigh, the Cilium IP pool,
      L2 announcement table and BPF service map. The VIP has an L7 proxy
      entry; NodePort with Host grafana.home returns HTTP 200.
    fix: >-
      Allocate a non-overlapping range for Cilium in its GitOps source, or
      deliberately renumber VM 111 through its owning configuration. Verify
      address availability first; then reconcile the Gateway VIP and Caddy
      upstream. Do not stop or destroy the VM as a diagnostic shortcut.
    resolution: >-
      The owner moved VM 111 to 10.1.1.90 (verified in qm config). Initial
      probes timed out, then a packet capture confirmed ARP replies from the
      Cilium worker and HTTP probes returned 200. No ARP flush was performed.
    status: fixed
    diagnosed: 2026-09-06

  - id: home-wildcard-certificate-does-not-validate
    applies_to: [caddy]
    symptom: >-
      A *.home site with tls internal passes caddy validate, but curl rejects
      its certificate with no alternative certificate subject name matches.
    cause: >-
      The second-level wildcard certificate is rejected by the tested client.
      Caddy also suppresses individual core certificates covered by the wildcard.
    fix: >-
      Use tls internal with on_demand for the wildcard route, issuing individual
      hostname certificates. Exact core sites use tls force_automate with
      issuer internal. The installed image rejects force_automate as a nested
      subdirective, so use it as the tls argument. Verified with a fresh CA
      and certificate validation for both wildcard-routed and exact sites.
    diagnosed: 2026-09-07
