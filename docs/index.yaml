# Entry point. Read this first, then open only the file that answers the
# question - every fact lives in exactly one place.
#
# Facts are YAML, verified against the live hosts; reasoning is Markdown with
# YAML front matter under decisions/ and sessions/.
#
# The machines, named for their role:
#   core      the cluster the house depends on   controlplane .10, worker-1 .11
#   proxmox   the lab, built and destroyed       10.1.1.100 - unreachable now
#   router    the boundary with the internet     192.168.8.1, GL.iNet
#
# core/ is deployed onto core, through Terraform, Helmfile and Flux. archive/
# holds setups switched off but kept whole, read by nothing.

meta:
  updated: 2026-09-30
  tags: [index, entrypoint, homelab]

files:
  - path: docs/hosts/core.yaml
    holds: the cluster and its control plane - disks, network, access, every service's quirks
    tags: [core, controlplane, talos, kubernetes, services]
  - path: docs/hosts/worker-1.yaml
    holds: core's second node, the old OpenMediaVault box - hardware, disks, its taint
    tags: [worker-1, talos, hardware]
  - path: docs/hosts/proxmox.yaml
    holds: the lab hypervisor - hardware, guests, why it is unreachable
    tags: [proxmox, lab]
  - path: docs/hosts/router.yaml
    holds: GL.iNet GL-MT6000 - DNS, DHCP, firewall, WireGuard, what a reflash loses
    tags: [router, glinet, dns, wireguard]
  - path: docs/network.yaml
    holds: subnets, the address plan, DNS, TLS, what can reach what
    tags: [network, dns, tls, vpn]
  - path: docs/backups.yaml
    holds: what goes to R2, how it restores, what is not backed up
    tags: [backup, volsync, etcd, r2]
  - path: docs/traps.yaml
    holds: failures already paid for once - symptom, cause, tell, fix
    tags: [traps, debugging]
    read_when: anything that should work does not
  - path: docs/service-ideas.md
    holds: what to build next, in rough order
    tags: [backlog]
  - path: docs/decisions/
    holds: one file per decision in force or open; README indexes them
    tags: [decisions]
  - path: docs/sessions/
    holds: the narrative of the last working session
    tags: [sessions, handoff]
    read_when: starting work

answers:                     # question -> file, so a lookup costs one read
  what is running right now: core/03-gitops/apps, then docs/hosts/core.yaml for why
  what is the IP of X: docs/network.yaml, then docs/hosts/
  which hostname serves what: docs/hosts/core.yaml, access and services
  how is the cluster built: core/README.md and the READMEs under it
  why is it built this way: docs/decisions/
  what breaks if a disk dies: docs/backups.yaml
  why is this failing: docs/traps.yaml
  what could I build next: docs/service-ideas.md
  what did we do last time: docs/sessions/

rules:                       # the full set is in AGENTS.md
  - Verify against the live host before writing a fact down.
  - Do not change the router over ssh; see decisions/0007.
  - Secrets are never committed; Infisical holds them, and ExternalSecrets
    name only their paths.
  - A fact belongs in one file. README.md files are procedures and do not
    restate these tables.
  - New failure mode -> traps.yaml. Choice with a rejected alternative ->
    decisions/. Narrative of a session -> sessions/.
  - Commits name one author, the owner. No agent attribution anywhere.
