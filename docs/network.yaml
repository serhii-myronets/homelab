# The parts of the network that span hosts. Per-host detail lives in
# docs/hosts/. Verified 2026-09-19; router-dependent rows re-verified
# 2026-09-29, after the router's reflash.

meta:
  updated: 2026-09-29
  tags: [network, subnets, dns, tls, vpn, wireguard]

subnets:
  - {cidr: 192.168.8.0/24, use: LAN, hosts: [core, satellite], gateway: 192.168.8.1}
  - {cidr: 10.1.1.0/24, use: lab, vlan: 10, hosts: [proxmox], gateway: 10.1.1.1,
     routed: no}                   # VLAN not rebuilt after the reflash
  - {cidr: 192.168.9.0/24, use: guest, gateway: 192.168.9.1, enabled: no}
  - {cidr: 10.1.0.0/24, use: wireguard clients, gateway: 10.1.0.1}

address_plan:                      # the LAN in tens, set 2026-09-29
  core: 192.168.8.10-19            # node .10, load balancer .15-.19
  satellite: 192.168.8.20-29       # node .20 once rebuilt; now DHCP .100
  dhcp_pool: 192.168.8.100-249

load_balancers:
  cilium_core:
    range: 192.168.8.15-192.168.8.19  # .20 left the pool for satellite
    announced_by: core
    interface: br0

dns:
  server: AdGuard Home on the router at 192.168.8.1
  wildcard: "*.home -> 192.168.8.15"
  note: >-
    New internal hostnames need no DNS work, but need an HTTPRoute and an
    entry in the Gateway certificate before the Gateway can serve them.

vpn:
  wireguard: the router's server, the only way in - see hosts/router.yaml
  tailscale: not used              # its old subnet-route failure stays in
                                   # traps.yaml in case it ever comes back

tls:
  internal: cert-manager home-ca; root certificate served at ca.home
  external: Cloudflare Tunnel to serhii.link
  tunnel_note: >-
    cloudflared runs with --token-file, so ingress rules live in the
    Cloudflare Zero Trust dashboard, not in this repository.

reachability:                      # who can reach whom, as configured today
  lan_to_lab: no                   # no VLAN 10 on the router at all
  lab_to_lan: no
  vpn_to_internet: yes             # wgserver2wan
  vpn_to_lan: yes                  # verified 2026-09-29 from outside
  vpn_to_lab: no
  guest_to_anything: no            # wan only
  wan_to_lan: no                   # no port forwards; public access is the
                                   # Cloudflare tunnel, which dials outward
