# The parts of the network that span hosts. Per-host detail lives in
# docs/hosts/. Verified 2026-09-10.

meta:
  updated: 2026-09-10
  tags: [network, subnets, dns, tls, vpn, tailscale]

subnets:
  - {cidr: 192.168.8.0/24, use: LAN, vlan: 1, hosts: [core], gateway: 192.168.8.1}
  - {cidr: 10.1.1.0/24, use: lab, vlan: 10, hosts: [proxmox], gateway: 10.1.1.1}
  - {cidr: 192.168.9.0/24, use: guest, gateway: 192.168.9.1}
  - {cidr: 10.1.0.0/24, use: wireguard clients, gateway: 10.1.0.1}

dns:
  server: AdGuard Home on the router at 192.168.8.1
  wildcard: "*.home -> 192.168.8.100"
  note: New internal hostnames need no DNS work — the wildcard covers them.

tailscale:
  lan_route: {cidr: 192.168.8.0/24, advertised_by: router}
  lab_route: {cidr: 10.1.1.0/24, advertised_by: proxmox, approved: no}
  split_dns: {domain: home, server: 192.168.8.1}
  exit_node: none
  routing_note: >-
    Proxmox's 10.1.1.0/24 advertisement is left unapproved on purpose. Once
    approved, Flint installs it in Tailscale table 52 over the directly
    attached VLAN, which cuts the lab off from the LAN and Proxmox off from
    the coordination server. Telling Flint to stop accepting it does not
    hold: gl_tailscale re-runs `tailscale up --reset --accept-routes` at
    every start, so approval is the only durable lever. See traps.yaml,
    and decisions/0012 for the way out of the ceiling this imposes.

tls:
  internal: Caddy internal CA; root certificate served at ca.home
  external: Cloudflare Tunnel to serhii.link
  tunnel_note: >-
    cloudflared runs with --token-file, so ingress rules live in the
    Cloudflare Zero Trust dashboard, not in this repository.

reachability:                      # who can reach whom, as configured today
  lan_to_lab: yes                  # forwarding lan -> homelabzone
  lab_to_lan: yes                  # forwarding homelabzone -> lan
  vpn_to_lab: yes                  # forwarding wgserver -> homelabzone
  vpn_to_lan: yes                  # wgserver2lan, added 2026-09-06
  vpn_note: >-
    Both vpn_ rows describe firewall rules that are in place, not access that
    works: the WireGuard interface is disabled, so nothing arrives on it.
    See hosts/router.yaml.
  tailscale_to_lan: yes            # router advertises 192.168.8.0/24
  tailscale_to_lab: no             # advertised, deliberately unapproved
  guest_to_anything: no            # wan only
  wan_to_lan: no                   # no port forwards; public access is the
                                   # Cloudflare tunnel, which dials outward
