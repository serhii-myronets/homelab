# GL.iNet GL-MT6000 (Flint 2), the boundary with the internet. Gateway,
# DNS, firewall and VPN endpoint for everything behind it.
#
# Do not edit its uci config. Changes made outside GL.iNet's own UI drift from
# what that UI believes, and the firmware may overwrite or hide them — see
# decisions/0007. Facts below verified 2026-09-08 over ssh, read-only.

meta:
  host: router
  updated: 2026-09-08
  tags: [router, openwrt, glinet, firewall, vlan, dns, wireguard, tailscale]

identity:
  model: GL.iNet GL-MT6000 (Flint 2)
  ip: 192.168.8.1
  ssh: root@192.168.8.1
  os: OpenWrt 21.02-SNAPSHOT (GL.iNet build)
  kernel: 5.4.238
  arch: aarch64, mediatek/mt7986

wan:
  device: eth1
  proto: dhcp
  address: 50.38.32.155/21         # public, straight on the router
  port_forwards: none              # nothing reaches the LAN from outside

vlans:                             # both are VLANs on the one br-lan bridge
  - {id: 1, device: br-lan.1, subnet: 192.168.8.0/24, ports: [lan2, lan3, lan4, lan5]}
  - {id: 10, device: br-lan.10, subnet: 10.1.1.0/24, ports: [lan1], name: homelab}

other_networks:
  - {name: guest, subnet: 192.168.9.0/24}
  - {name: wgserver, subnet: 10.1.0.0/24, port: 51820, peers: 5}

dns:
  resolver: AdGuard Home on the router, port 3053
  rewrite: "*.home -> 192.168.8.100"   # this is where the wildcard comes from
  note: >-
    Explains why the adguard docker stack was redundant and got removed.

dhcp:
  pools:
    - {vlan: 1, range: 192.168.8.100-249}
    - {vlan: 10, range: 10.1.1.150-249}   # moved off .100 on 2026-09-06 so the
                                          # pool cannot lease Proxmox's own
                                          # static address; .100-.149 is now
                                          # free for statics
  reservations:
    - {mac: "84:39:4C:00:25:FC", ip: 192.168.8.100, host: core}
    - {mac: "F8:89:D2:5B:E3:1B", ip: 192.168.8.110}
    - {mac: "02:A5:88:66:E8:5E", ip: 10.1.1.10}

zones:
  lan: {policy: accept}
  homelabzone: {policy: accept, masquerade: true}
  guest: {policy: reject}
  iot: {policy: reject}
  wgserver: {input: accept, output: accept, masquerade: true, mtu_fix: true}
  tailscale0: {input: accept, output: accept, forward: reject, masquerade: true, mtu_fix: true}
  wan: {input: drop, masquerade: true}

forwardings:                       # what may reach what; i is the UCI index when stable
  - {i: 0,  src: lan,         dest: wan}
  - {i: 1,  src: guest,       dest: wan}
  - {i: 2,  src: homelabzone, dest: wan}
  - {i: 3,  src: lan,         dest: homelabzone}
  - {i: 4,  src: lan,         dest: wgclient1, name: lan2wgclient1}
  - {i: 5,  src: guest,       dest: wgclient1, name: guest2wgclient1}
  - {i: 6,  src: wan,         dest: wgclient1, name: wan2wgclient1}
  - {i: 7,  src: ovpnserver,  dest: wgclient1, name: ovpnserver2wgclient1}
  - {i: 8,  src: wgserver,    dest: wgclient1, name: wgserver2wgclient1}
  - {i: 9,  src: homelabzone, dest: lan}
  - {i: 10, src: wgserver,    dest: homelabzone}
  - {i: 11, src: homelabzone, dest: wgserver}
  - {i: 12, src: iot,         dest: wan}
  - {i: 13, src: wgserver,    dest: lan,       name: wgserver2lan}
  - {i: 14, src: wgserver,    dest: wan,       name: wgserver2wan}
  - {i: 15, src: lan,         dest: wgserver,  name: lan2wgserver}
  - {src: tailscale0, dest: lan, name: tailscale_lan}
  - {src: lan, dest: tailscale0, name: lan_tailscale}
  - {i: 18, src: tailscale0, dest: homelabzone}
forwardings_note: >-
  GL.iNet names the rules it creates <src>2<dest>. Anonymous entries came from
  LuCI or from the wizard. wgserver2lan was added by hand through LuCI on
  2026-09-06 — GL.iNet's own UI has no toggle for it, so there is nothing for
  it to drift from. See decisions/0007.

custom_configuration:
  - >-
    VLAN 10, interface homelab and firewall zone homelabzone are maintained
    through LuCI because the installed GL.iNet UI does not expose arbitrary
    wired VLAN segmentation on Flint 2.
  - >-
    tailscale0 -> homelabzone was added through LuCI so Tailscale clients can
    enter the Proxmox VLAN.
  - >-
    Tailscale route acceptance is disabled with `tailscale set
    --accept-routes=false`; otherwise Flint installs Proxmox's advertised
    10.1.1.0/24 route in table 52 and loops traffic away from br-lan.10.

installed_features:
  tailscale: firmware-integrated     # enabled in GL.iNet UI; not installed as a custom package
  adguard_home: firmware-integrated

masquerade_note: >-
  The rule is `-o br-lan.10 -j MASQUERADE`, so traffic entering VLAN 10 is
  NAT'd: Proxmox sees everything from the LAN as coming from 10.1.1.1 rather
  than its real source. Traffic the other way is not translated.

wireguard_server:
  reaches: [lan, homelabzone, wan, wgclient1]   # everything, since 2026-09-06
  masquerade_note: >-
    The wgserver zone masquerades, so a host on the LAN sees a VPN client as
    192.168.8.1 rather than as 10.1.0.x. Guest-auth shares do not care; anything
    matching on source address would.
  address_v4: 10.1.0.1/24
  port: 51820
  peers: 5                         # macbook, pixel and three others
  client_to_client: false
  masquerade: true
  peer_config:
    dns: 192.168.8.1
    allowed_ips: [192.168.8.0/24, 10.1.1.0/24]
    persistent_keepalive: 25
    mtu: 1420

tailscale:
  address_v4: 100.117.65.76
  advertises: [192.168.8.0/24]
  accepts_subnet_routes: false
  exit_node: false
  masquerade: true
  reaches: [lan, homelabzone]
  homelab_route_source: proxmox     # 10.1.1.0/24; see docs/hosts/proxmox.yaml
  split_dns: {domain: home, server: 192.168.8.1}

wifi:
  - {ssid: gl.inet, band: 2.4G, network: lan, enabled: true}
  - {ssid: gl.inet-5G, band: 5G, network: lan, enabled: true}
  - {ssid: GL-MT6000-3f6-Guest, network: guest, enabled: false}
  - {ssid: GL-MT6000-3f6-IoT, network: iot, enabled: false}

wan_input_allowed:                 # everything else is dropped
  - {port: 68/udp, what: DHCP renew}
  - {proto: igmp, what: multicast}
  - {port: 51820/udp, what: WireGuard server}

closed:                            # fixed 2026-09-06, kept for the record
  samba_exposed_on_wan:
    was: >-
      firewall.sambasharewan accepted 137/138/139/445 from the wan zone and
      samba4 bound `loopback wan lan`, so the USB disk at
      /tmp/mountd/disk1_part1 answered over SMB on the public address
      50.38.32.155.
    now: >-
      The rule's target is DROP and samba4 binds `loopback lan`. Verified: the
      eight matching rules in zone_wan_input are all DROP.
  vpn_cannot_reach_lan:
    was: >-
      lan -> wgserver existed with no wgserver -> lan, so dialling in reached
      Proxmox and the Talos cluster but not the NAS.
    now: >-
      wgserver2lan added through LuCI. Verified: one ACCEPT in
      zone_wgserver_forward.

gaps:
  wireguard_subnet_overlap:
    severity: medium
    symptom: >-
      A roaming client on a network covering 10.1.0.0/24 sends WireGuard
      gateway or lab traffic to its local interface instead of the tunnel.
    observed: >-
      A Mac at 10.1.0.62/22 routed 10.1.0.1 and 10.1.1.0/24 through en0.
    fix: >-
      Renumber wgserver and every peer to a less common subnet, for example
      10.66.66.0/24. Changing only a client address is insufficient.
  firmware_age:
    severity: medium
    symptom: >-
      The OpenWrt base is 21.02 on kernel 5.4 — old, and only as current as
      GL.iNet's own builds.
