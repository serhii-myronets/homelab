# GL.iNet GL-MT6000 (Flint 2), the boundary with the internet. Gateway,
# DNS, firewall and VPN endpoint for everything behind it.
#
# Do not edit its uci config. Changes made outside GL.iNet's own UI drift from
# what that UI believes, and the firmware may overwrite or hide them — see
# decisions/0007. Facts below verified 2026-09-29 over ssh, read-only, after a
# reflash on 2026-09-28 wiped every earlier setting (traps.yaml,
# router-reflash-wipes-everything). Whatever is not listed here was not
# rebuilt.

meta:
  host: router
  updated: 2026-09-29
  tags: [router, openwrt, glinet, firewall, dns, wireguard]

identity:
  model: GL.iNet GL-MT6000 (Flint 2)
  ip: 192.168.8.1
  ssh: root@192.168.8.1            # key added through LuCI after the reflash;
                                   # the host key changed with it
  firmware: GL.iNet 4.11.0
  os: OpenWrt 21.02-SNAPSHOT r15812+1095-46b6ee7ffc
  kernel: 5.4.238
  arch: aarch64, mediatek/mt7986

wan:
  device: eth1
  proto: dhcp
  address: 50.126.64.12/22         # public, straight on the router
  address_is_not_stable: >-
    DHCP, and it moves: 50.38.32.155/21 on 2026-09-08, 50.45.167.79/21 on
    2026-09-19, a /22 by 2026-09-29. Anything that pins the number breaks —
    WireGuard peer endpoints above all; they should use the DDNS name.
  ddns:
    hostname: bf403f6.glddns.com   # allocated by GL.iNet, never published
    enabled: yes                   # IPv4 and IPv6; resolved to the WAN
                                   # address on 2026-09-29
  port_forwards: none              # nothing reaches the LAN from outside

lan:
  bridge: br-lan
  ports: [lan1, lan2, lan3, lan4, lan5]   # one flat network; no VLANs
  subnet: 192.168.8.0/24

other_networks:
  - {name: guest, subnet: 192.168.9.0/24, enabled: no}
  - {name: iot, subnet: 192.168.10.0/24, enabled: no}
  - {name: wgserver, subnet: 10.1.0.0/24, enabled: yes}   # see wireguard_server

not_rebuilt:
  homelab_vlan: >-
    VLAN 10 (10.1.1.0/24 on lan1), its interface and the homelabzone firewall
    zone were LuCI-made and went with the reflash. Nothing waits on them:
    Proxmox was reinstalled onto the LAN at .30 on 2026-10-03.
  reservations: >-
    F8:89:D2:5B:E3:1B -> .110, paused by the owner. The old OpenMediaVault
    box needs none now - it is core's worker-1, static at .11.

vpn: WireGuard only. Tailscale ships with the firmware but is not used;
  tailscaled is not running.

dns:
  resolver: >-
    dnsmasq on port 53 forwards everything to AdGuard Home on 127.0.0.1:3053
    (noresolv). AdGuard's own web UI answers on port 3000.
  rewrite: "*.home -> 192.168.8.15"    # core's Gateway
  rewrite_precedence: >-
    An exact rewrite outranks the wildcard: while headlamp.home had one to
    192.168.8.21, every other .home name still answered 192.168.8.15.
    Verified 2026-09-30; no exact rewrite remains.
  adguard_api: >-
    AdGuard Home listens on 0.0.0.0:3000, but GL.iNet guards it with its own
    admin session: /control/* answers 401 and / redirects to the router's
    login, while AdGuard's own config.yaml has users: []. So nothing can drive
    it with AdGuard credentials - external-dns's AdGuard webhooks included -
    without adding a user to that file over ssh, which decisions/0007 rules
    out and the firmware would likely undo. Verified 2026-09-29.

  own_lookups: >-
    The router's own processes resolve through the WAN's servers, not
    through dnsmasq: /etc/resolv.conf is a link to /tmp/resolv.conf, which
    names 192.152.0.1 and .2. A program on the router that must see *.home
    has to ask 192.168.8.1:53, as Gatus's checks do. Verified 2026-10-01.

gatus:
  what: >-
    The house's watcher, decisions/0036 - the one thing installed over ssh,
    by router/gatus/install.sh from the Mac, which is also how every change
    to its checks arrives. Binary and version in /opt/gatus, checks and
    secrets in /etc/gatus (env, mode 600, empty until alerting), started by
    /etc/init.d/gatus as nobody; the three paths are in /etc/sysupgrade.conf.
  ui: >-
    https://gatus.home through core's Gateway and a socat pod (namespace
    router), local only; http://192.168.8.1:8090 directly, which still
    answers when controlplane does not
  verified: >-
    2026-10-01: v5.37.0, 32 of 32 checks passing, 31 MB resident.

backup: >-
  Nightly to R2 by core's router-backup since 2026-10-02, through a key
  limited to `sysupgrade -b -`; how it restores is in backups.yaml. It holds
  the WireGuard and Wi-Fi keys, so it lives encrypted in restic, never here.

node_exporter:
  what: >-
    prometheus-node-exporter-lua with its openwrt and wifi_stations modules,
    installed by router/node-exporter/install.sh (decisions/0036), listening
    on 192.168.8.1:9100 and scraped by core's vmagent as job router. The WAN
    is eth1. About 2 MB. The 2022.04.18 package in this feed has no thermal
    module, so the router's temperature is not among its metrics.
  verified: 2026-10-02

dhcp:
  pools:
    - {network: lan, range: 192.168.8.100-249, lease: 12h}
  reservations:
    - {mac: "78:55:36:08:CD:FE", ip: 192.168.8.10, host: talos-lqh-j5o}
  reservations_note: >-
    core no longer needs its reservation — its address is static in
    Talos (decisions/0028); it stays so the router names the machine.

zones:
  lan: {input: accept, output: accept, forward: accept}
  wan: {input: drop, forward: reject, masquerade: true}
  guest: {input: reject, forward: reject}
  iot: {input: reject, forward: reject}
  wgserver: {input: reject, output: accept, masquerade: true, mtu_fix: true}

forwardings:                       # what may reach what
  - {src: lan,      dest: wan}
  - {src: guest,    dest: wan}
  - {src: iot,      dest: wan}
  - {src: wgserver, dest: wan,      name: wgserver2wan}
  - {src: lan,      dest: wgserver, name: lan2wgserver}
forwardings_note: >-
  GL.iNet names what it creates <src>2<dest>. Firmware 4.11 ships its own
  wgserver2lan, as a rule rather than a forwarding; the WireGuard server's
  "Allow Remote Access to the LAN Subnet" option switches it on.

wan_input_allowed:                 # everything else is dropped
  - {port: 68/udp, what: DHCP renew}
  - {proto: igmp, what: multicast}
  - {port: 51820/udp, what: WireGuard server}

samba: >-
  The router serves no shares: samba4 carries only its global section and smbd
  is not running. The shares seen on the LAN are core's — see
  hosts/core.yaml, services.samba.

wireguard_server:
  status: enabled
  address_v4: 10.1.0.1/24
  address_v6: fd00:d5cc:a7e7:fdc7::1/64
  port: 51820
  peers: 1                         # macbook air; every pre-reflash client
                                   # config is dead - the server key is new
  lan_access: yes                  # Options -> Allow Remote Access to the LAN
                                   # Subnet. Verified 2026-09-29 from a phone
                                   # hotspot: .10 and .100 answer, *.home
                                   # resolves and flux.home returns 200
  router_input: >-
    Clients reach the router itself only for DNS (wgserver_allow_dns); a ping
    to 192.168.8.1 through the tunnel gets port-unreachable, and that is not a
    broken tunnel.
  client_config: >-
    AllowedIPs 192.168.8.0/24, DNS 192.168.8.1, keepalive 25, preshared key,
    endpoint the DDNS name rather than the WAN address.
  client_to_client: false
  masquerade: true

wifi:
  - {ssid: gl.inet, band: 2.4G, network: lan, enabled: true, encryption: psk2}
  - {ssid: gl.inet-5G, band: 5G, network: lan, enabled: true, encryption: psk2}
  - {ssid: GL-MT6000-3f6-Guest, network: guest, enabled: false}
  - {ssid: GL-MT6000-3f6-5G-Guest, network: guest, enabled: false}
  - {ssid: GL-MT6000-3f6-IoT, network: iot, enabled: false}
  - {ssid: GL-MT6000-3f6-5G-IoT, network: iot, enabled: false}

gaps:
  wireguard_subnet_overlap:
    severity: medium
    symptom: >-
      A roaming client on a network covering 10.1.0.0/24 sends WireGuard
      gateway traffic to its local interface instead of the tunnel.
    observed: >-
      A Mac at 10.1.0.62/22 routed 10.1.0.1 and 10.1.1.0/24 through en0.
    fix: >-
      The reflash put the server back on 10.1.0.1/24. With one peer,
      renumbering still costs one regenerated config: move it to a rarer
      subnet, for example 10.66.66.0/24, before issuing more.
  firmware_age:
    severity: medium
    symptom: >-
      The OpenWrt base is 21.02 on kernel 5.4 even on 4.11 — old, and only as
      current as GL.iNet's own builds.
