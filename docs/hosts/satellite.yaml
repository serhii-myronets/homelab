# satellite — the OpenMediaVault box, called core until 2026-09-29, when that
# name went to the cluster on the Beelink that took over its job. It serves
# nothing now - all nine of its containers are stopped, its disks and shares
# still mounted. It is to be wiped and rebuilt on Talos to watch core and keep
# copies of its backups, a role nothing may depend on.
# Verified 2026-09-20; disks re-read 2026-09-29.

meta:
  host: satellite
  updated: 2026-09-29
  tags: [satellite, nas, omv, debian, docker, storage]

identity:
  hostname: openmediavault
  ip: 192.168.8.100
  vlan: 1
  role: retired, awaiting a rebuild as satellite
  ssh: root@192.168.8.100          # key at ~/.ssh/id_ed25519
  ssh_tcp_forwarding: >-
    Refused. sshd_config carries AllowTcpForwarding no, so ssh -L to this host
    opens a local listener that then goes nowhere — connections time out with
    no error from ssh itself. Reach a container's published port directly on
    192.168.8.100 instead of tunnelling. Verified 2026-09-07.
  note: >-
    Deliberately boring. Nothing experimental runs here, which is why it
    keeps working.

os:
  distribution: OpenMediaVault on Debian 13
  kernel: 7.1.8+deb13-amd64
  timezone: America/Los_Angeles
  virtualised: false

hardware:
  cpu: {model: Intel Celeron J4125, cores: 4, ghz: 2.0}
  ram_gb: 7.6
  gpu: Intel UHD 600

docker:
  engine: 29.8.0
  compose: 5.5.1
  source: OMV-Extras apt repository (omvdocker.sources)

disks:                             # sda and sdb swap between boots - they
                                   # were the other way round on 2026-09-20;
                                   # match on model, not on the name
  - dev: sda                       # on 2026-09-29
    model: M.2 SSD 128GB
    size: 119G
    transport: sata
    role: system
    layout: "/ (110G, ~9G used), /boot/efi, 6.2G swap"
    smart: {health: passed, reallocated: 0, pending: 0, erase_fails: 0,
            power_on_hours: 16707}    # 2026-09-29
  - dev: sdb                       # on 2026-09-29
    model: ORICO
    size: 1.9T
    role: data
    transport: sata
    rotational: false
    fs: ext4
    mount: /srv/dev-disk-by-uuid-925787e7-dba0-451f-b9bf-c5afbd0ebc85
    symlink: /srv/ssd              # what every compose file refers to
    used: 1.7T
    free: ~100G
    smart: {health: passed, reallocated: 0, uncorrectable: 0, power_on_hours: 12193}  # 2026-09-29

redundancy: none                    # neither disk is mirrored

monitoring:
  smartd: enabled                   # polls both disks every 1800s
  pulse_agent: enabled              # host and Docker telemetry; tools/pulse-agent/install.sh
  alerting: none                    # no -m recipient, OMV SMTP unset
  gap: >-
    SMART will notice a failing disk and tell nobody. Needs either an -m
    recipient in smartd.conf or OMV's SMTP settings filled in.

moved_to_beelink:                   # 2026-09-19; containers stopped, data kept
  - {what: jellyfin, note: configuration and watch history copied}
  - {what: qbittorrent and flood, note: 55 torrents resumed there}
  - {what: vpn, note: stopped with them}
  - {what: samba/torrents, note: 1.8 TB copied to the Beelink's hdd-a}
  - {what: samba/scan, note: 89 document files copied to the Beelink's hdd-b}
  - {what: "*.home names", note: the router's wildcard now points at the Beelink}

shares:
  auth: guest                       # no unix users >=1000, no SMB accounts
  list:
    - {name: torrents, path: /srv/ssd/samba/torrents, size: 1.7T}
    - {name: scan, path: /srv/ssd/samba/scan, size: 110M}

nics:
  - {name: enp1s0, state: up, addr: 192.168.8.100/24}
  - {name: enp2s0, state: down}     # spare wired
  - {name: wlo1, state: down}       # spare wifi

firewall: none                      # only Docker's own NAT rules

config_of_record: /etc/openmediavault/config.xml   # shares, mounts, SMART,
                                                   # users, network — all of it

paths:                              # where things actually live on this host
  clone: /srv/ssd/docker/homelab    # the working checkout of this repository;
                                    # the backup unit's ExecStart points into
                                    # it, so moving it breaks the timer until
                                    # core/backup/install.sh is re-run
  gitops: /srv/ssd/docker/gitops    # Portainer unpacks each git-deployed stack
                                    # under here, one directory per stack
  data: /srv/ssd/docker/data        # container state, one directory per stack
  secrets: /srv/ssd/docker/secrets

cruft: none                         # the six /etc/cron.d/omv-compose-* files
                                    # left by the removed OMV compose plugin
                                    # were deleted 2026-09-06; they held only
                                    # SHELL and PATH, no scheduled job
