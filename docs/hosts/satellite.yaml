# satellite — the cluster that watches core from outside and keeps copies of
# its backups; nothing may depend on it. The old OpenMediaVault box, called
# core until 2026-09-29 and rebuilt on Talos the same day from
# satellite/01-talos. See decisions/0032.
# Verified 2026-09-29, after the install.

meta:
  host: satellite
  updated: 2026-09-29
  tags: [satellite, talos, kubernetes, bare-metal, storage]

identity:
  hostname: satellite              # fixed in the configuration, not generated
  ip: 192.168.8.20                 # static in Talos; the LAN's .20-.29 block
  vlan: 1
  role: satellite
  cluster: satellite
  access:
    talos: talosctl --context satellite -n 192.168.8.20
    kubernetes_context: satellite    # generated as admin@satellite, renamed locally
  context_note: >-
    talosctl config merge makes the merged context current, so after merging
    satellite's the default talosctl context became satellite and commands
    aimed at core went to the wrong cluster. beelink stays the current one;
    satellite is named with --context.

os:
  distribution: Talos Linux 1.14.1
  kubernetes: 1.37.0
  extensions: [i915, intel-ucode]  # core's schematic
  virtualised: false

hardware:
  cpu: {model: Intel Celeron J4125, cores: 4, ghz: 2.0}   # SSE4.2, no AVX
  ram_gb: 7.6
  gpu: Intel UHD 600

disks:                             # sda and sdb swap between boots, so both
                                   # are chosen by what ends their WWID
  - model: M.2 SSD 128GB
    serial: GSMB2092400746
    serial_note: >-
      Talos reports no serial for either SATA disk, only a WWID that ends in
      it after runs of spaces; a serial selector matched nothing and the first
      apply was refused. See traps.yaml.
    role: Talos system disk
    layout: "EFI 2.2 GB, META, STATE 105 MB, EPHEMERAL 103 GB (capped at 96 GiB), swap 8 GiB"
    smart: {health: passed, reallocated: 0, pending: 0, erase_fails: 0,
            power_on_hours: 16707}    # 2026-09-29, under Debian
  - model: ORICO
    serial: UB202412065113
    size: 2.0 TB
    role: >-
      One LVM volume group and thin pool for OpenEBS LVM LocalPV, made by a
      Job in 03-gitops. Not yet: it still holds the old machine's ext4
      partition - the torrent copy, the old restic repositories and
      config.xml - until it is wiped by hand.
    link: 3.0 Gb/s of 6.0           # the drive is SATA 3.0; the cable or port
                                   # holds it at half speed
    smart: {health: passed, reallocated: 0, uncorrectable: 0, power_on_hours: 12193}  # 2026-09-29

swap:
  size: 8 GiB                      # partition after EPHEMERAL on the system disk
  zswap: {enabled: true, max_pool_percent: 20}
  kubelet: LimitedSwap

nics:
  - {name: enp1s0, state: up, mac: "84:39:4c:00:25:fc", addr: 192.168.8.20/24}
  - {name: enp2s0, state: down}     # spare wired
  - {name: wlo1, state: absent}     # Talos has no Wi-Fi support

platform:
  scheduling: control-plane enabled
  releases:                        # from satellite/02-platform, 2026-09-29
    - {name: cilium, namespace: kube-system, chart: 1.20.2, status: deployed}
    - {name: external-secrets, namespace: external-secrets, chart: 2.10.0, status: deployed}
    - {name: flux-operator, namespace: flux-system, chart: 0.60.0, status: deployed}
  flux: v2.9.5 - source, kustomize, helm and notification controllers; nothing to sync yet
  infisical: >-
    core's machine identity, shared: it reads all of prod. See the
    02-platform README for what that costs.
  memory_after_platform: 1.85 GB used of 7.7, 5.5 available
  bootstrap_restarts: >-
    kube-controller-manager and kube-scheduler show 3 restarts each, all from
    the first minutes, when the API server behind KubePrism was not up yet.
    None since.

config:
  talos: satellite/01-talos/
  local_files:                     # ignored by Git; back them up elsewhere
    - satellite/01-talos/terraform.tfstate
    - satellite/01-talos/secrets.yaml   # regenerated from the node's own
                                        # configuration; Terraform made the
                                        # secrets, so the state is the source
