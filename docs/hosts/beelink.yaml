# The future replacement for core. It is independent bare metal, so workloads
# may move here gradually without becoming a dependency of the current core.
# Hardware verified 2026-09-19; GitOps and routes verified 2026-09-22.

meta:
  host: beelink
  updated: 2026-09-23
  tags: [beelink, talos, kubernetes, bare-metal, storage]

identity:
  model: Beelink ME Pro
  ip: 192.168.8.10
  vlan: 1
  role: future-core
  cluster: beelink
  node: talos-lqh-j5o
  access:
    talos: talosctl --nodes 192.168.8.10
    kubernetes_context: admin@beelink

os:
  distribution: Talos Linux 1.14.1
  kubernetes: 1.37.0
  kernel: 6.18.51-talos
  virtualised: false

hardware:
  cpu: {model: Intel N95, cores: 4, threads: 4}
  ram_gb: 12

disks:
  - dev: nvme0n1
    model: WDS500G1X0E-00AFY0
    serial: "204390442013"
    size: 500G
    transport: nvme
    wwid: eui.e8238fa6bf530001001b444a46596260
    role: >-
      One LVM volume group, nvme, with a 442 GB thin pool; OpenEBS LVM
      LocalPV gives each claim a thin logical volume with snapshots
  - dev: nvme1n1
    model: 128GB SSD
    serial: MQ49W66504526
    size: 128G
    transport: nvme
    role: Talos system disk
  - dev: sda
    model: ST10000DM0004-1Z
    size: 10T
    transport: sata
    rotational: true
    wwid: naa.5000c500c754eee9
    role: Talos XFS user volume hdd-a at /var/mnt/hdd-a, static PV media-hdd-a
  - dev: sdb
    model: ST10000DM0004-1Z
    size: 10T
    transport: sata
    rotational: true
    wwid: naa.5000c500c7482270
    role: Talos XFS user volume hdd-b at /var/mnt/hdd-b, static PV media-hdd-b

network:
  bridge: br0
  address: 192.168.8.10/24
  gateway: 192.168.8.1
  ports:
    - {name: enp3s0, role: router uplink}
    - {name: enp2s0, role: monitor and desktop downlink}
  cilium_device: br0

platform:
  scheduling: control-plane enabled
  cni: Cilium with kube-proxy replacement and BPF masquerading
  load_balancer_ips:
    - {ip: 192.168.8.15, service: gateway-system/cilium-gateway-main-gateway}
    - {ip: 192.168.8.16, service: torrent/torrent, ports: [8080, 3000]}
    - {ip: 192.168.8.17, service: jellyfin/jellyfin, port: 8096}
  releases:
    - {name: cilium, namespace: kube-system, chart: 1.20.2, status: deployed}
    - {name: external-secrets, namespace: external-secrets, chart: 2.10.0, status: deployed}
    - {name: flux-operator, namespace: flux-system, chart: 0.60.0, app: v0.60.0, status: deployed}
  gitops:
    controller: Flux, installed and sized by the Flux Operator's FluxInstance
    flux: v2.9.5, upgraded by the operator within the 2.9.x range
    enabled: [source-controller, kustomize-controller, helm-controller, notification-controller]
    ui: flux.home and flux.serhii.link, anonymous and read-only, served by the operator pod on 9080
    bootstrap: core-talos/03-gitops/README.md
    decision: docs/decisions/0020-flux-for-gitops.md, docs/decisions/0021-flux-operator-for-the-web-interface.md
  gitops_components:
    - {name: metrics-server, namespace: kube-system, chart: 3.14.0, app: 0.9.0, status: deployed}
    - {name: openebs, namespace: openebs, chart: 4.6.0, status: deployed}
    - {name: volumes, pvs: [samba-hdd-a, samba-hdd-b, torrent-hdd-a, jellyfin-hdd-a, library-hdd-a], status: deployed}
    - {name: cert-manager, namespace: cert-manager, chart: v1.21.2, status: deployed}
    - {name: snapshot-controller, namespace: storage, chart: 5.3.0, app: v8.6.0, status: deployed}
    - {name: volsync, namespace: storage, chart: 0.16.0, status: deployed}
    - {name: samba, namespace: samba, status: deployed}
    - {name: torrent, namespace: torrent, status: deployed}
    - {name: intel-gpu, namespace: kube-system, plugin: "intel-gpu-plugin 0.37.0", resource: "gpu.intel.com/i915", shared_by: 3, status: deployed}
    - {name: jellyfin, namespace: jellyfin, status: deployed}
    - {name: library, namespace: library, status: deployed}
    - {name: cloudflared, namespace: cloudflared, image: "cloudflare/cloudflared:2026.9.1", replicas: 1, status: deployed}
    - {name: external-dns, namespace: external-dns, chart: 1.22.0, app: 0.22.0, status: deployed}
    - {name: actual, namespace: actual, image: "actualbudget/actual-server:26.9.0", status: deployed}
    - {name: sure, namespace: sure, image: "ghcr.io/we-promise/sure:0.7.4", status: deployed}
    - {name: uptime-kuma, namespace: uptime-kuma, image: "louislam/uptime-kuma:2.5.5-rootless", status: deployed}
  local_access:
    names: [jellyfin.home, tv.home, seerr.home, immich.home, actual.home, sure.home, kuma.home, vault.home, torrent.home, prowlarr.home, sonarr.home, radarr.home, headlamp.home, flux.home, ca.home]
    gateway: >-
      192.168.8.15. Four listeners: *.serhii.link on 80 for the tunnel,
      *.home on 80 redirecting to HTTPS, ca.home and tv.home on 80 in the
      clear, and *.home on 443 with home-tls.
    certificate: >-
      One certificate lists every HTTPS .home service. tv.home is deliberately
      absent: it is plain HTTP for a television whose trust store is not ours
      to write. cert-manager creates and renews the certificate from the
      cluster's own authority; devices trust its root from ca.home/root.crt.
    note: >-
      The router now sends every *.home name here, so core's remaining ones
      (omv, portainer, homepage, pulse, proxmox, proxmenux) answer 404 until
      they move or get a route.
  public_access:
    tunnel: {name: beelink, id: 2150274f-5bd6-4826-b46f-16992d9f8293, managed: locally, config: core-talos/03-gitops/apps/system/network/cloudflared/app/config.yaml}
    secrets: Infisical /cloudflared/beelink (TUNNEL_CREDENTIALS, API_TOKEN)
    dns: external-dns, proxied CNAME per HTTPRoute under serhii.link, txtOwnerId beelink
    auth: Cloudflare Access covers every serhii.link name, including new ones
    published: [flux.serhii.link, headlamp.serhii.link, jellyfin.serhii.link, torrent.serhii.link,
                prowlarr.serhii.link, radarr.serhii.link, seerr.serhii.link, sonarr.serhii.link]
    other_tunnels:
      - {name: core, id: 324ac876-9f30-45a4-8872-e2331398e411, managed: remotely, serves: core's hostnames}
      - {name: wildcard-tunnel, id: aa04f37f-025a-4dbb-8a06-87acf29ff7a2, managed: locally, kept_for: a future Proxmox cluster, secret: Infisical /cloudflared/credentials.json}
  jellyfin:
    address: 192.168.8.17:8096 (LoadBalancer)
    television: >-
      tv.home, on port 80 without TLS, added 2026-09-20. A television's
      trust store is not ours to write to, so it can neither follow the
      redirect on jellyfin.home nor accept the home authority behind it.
      A second name rather than an exemption for the first, so every device
      that can do TLS still does; tv.home is deliberately not on the
      certificate. The password crosses the LAN in the clear either way -
      the alternative was the address above, typed with its port.
    image: "jellyfin/jellyfin:12.1.20260915-010956"
    user: "1000:1000"
    gpu: Quick Sync through the Intel iHD driver 26.2.4
    config: claim data on the lvm class, backed up hourly
    cache: claim cache on the lvm class, never backed up
    media: >-
      One read-only mount: /var/mnt/hdd-a/media as /library, the hard-link
      library Sonarr and Radarr build. The seeding directory was mounted
      beside it until the migration finished on 2026-09-20.
    libraries: >-
      Two, Movies at /library/movies and TV at /library/tv, named after the
      directories they read. The mixed Kids library is gone: age is
      metadata, not a folder, and each title is now a film or a series on
      its own. Read-only, so deleting anything is Sonarr's or Radarr's job -
      which also means SaveLocalMetadata and SaveSubtitlesWithMedia must
      stay off on both, or a scan spends itself on write errors.
    migrated: >-
      core's 12.0 library and watch history on 2026-09-19, upgraded to 12.1.
      Watch history was lost again on 2026-09-20 when the libraries moved to
      /library: Jellyfin identifies an item by its path, and every path
      changed.
    legacy_auth: >-
      EnableLegacyAuthorization is on in system.xml. Jellyseerr still sends
      X-Emby-Authorization, which Jellyfin 12 answers with 400.
  torrent:
    address: 192.168.8.16 (LoadBalancer)
    ports: {qbittorrent: 8080}
    containers:
      - {name: gluetun, image: "qmcgaw/gluetun:v3.41.3", role: "NordVPN WireGuard, Netherlands, native sidecar"}
      - {name: qbittorrent, image: "ghcr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475", interface: tun0}
    downloads: >-
      /var/mnt/hdd-a/torrents, mounted both as /downloads, the path the
      migrated torrents carry in their resume data, and inside /data, the
      path Sonarr and Radarr also use.
    config: claim data on the lvm class, backed up hourly
    cache: 200Gi lvm claim for incomplete downloads, never backed up
    ui: >-
      qBittorrent's own, at torrent.home and torrent.serhii.link since
      2026-09-20. Flood held those names and was removed: a second interface
      onto the same client, for 153 MiB.
    vpn: >-
      gluetun to NordVPN over WireGuard since 2026-09-20, in the Netherlands.
      It was OpenVPN, which cost 1.5 of four cores to carry 1.7 MiB/s: this
      traffic is millions of tiny packets - 8 million outbound peer
      acknowledgements of about 73 bytes against 14 million inbound - and
      OpenVPN pays per packet, in user space. WireGuard is built into the
      Talos kernel; measured afterwards at 5.5 MiB/s for 1-5 millicores.
      qBittorrent binds to the tunnel by name, and that name is tun0 under
      both protocols - see traps.yaml. Some NordVPN endpoints accept a
      WireGuard connection and carry nothing, so gluetun hunts for a live
      one; its liveness probe allows ten minutes for that, because a
      restart mid-hunt is what turns it into an outage.
    seeding: >-
      Stops at ratio 2 or 14 days, whichever comes first. Stopping rather
      than deleting is deliberate: it is what tells Sonarr and Radarr the
      seeding is finished, and they then remove the torrent with its file.
    resolver: >-
      Every container resolves through gluetun, inside the tunnel. One name
      is answered before that: retracker.local, which Toloka's torrents
      announce to and which gluetun's resolver drops in silence - see
      traps.yaml. A hostAliases entry pins it to 127.0.0.1.
    vpn_secret: >-
      Infisical /nordvpn - WIREGUARD_PRIVATE_KEY in use, OPENVPN_USER and
      OPENVPN_PASSWORD kept so one value here reverts the protocol.
    webui_auth: none from 192.168.8.0/24 and the pod network
    migrated: 55 torrents from core on 2026-09-19, seeding without a recheck
  vaultwarden:
    role: household password vault, compatible with Bitwarden browser and mobile clients
    image: "vaultwarden/server:1.37.3"
    data: >-
      The SQLite database, its write-ahead log, attachments and configuration
      share one 2Gi LVM claim, copied hourly to R2 at minute 25. One snapshot
      keeps the database and its log consistent.
    names: [vault.home]
    access: >-
      Local HTTPS only. No public route exists: Cloudflare Access's browser
      gate is not a transparent transport for Bitwarden mobile or extension
      clients.
    registration: open locally while the household creates its initial accounts
    built: 2026-09-22, from a fresh vault
  uptime_kuma:
    role: local availability checks, outage history and notification delivery
    image: "louislam/uptime-kuma:2.5.5-rootless"
    names: [kuma.home]
    data: >-
      Kuma's SQLite database holds its monitors, notification channels and
      history. Its 2Gi LVM claim is copied to R2 hourly at minute 30; the
      initial source backup completed on 2026-09-22.
    scope: >-
      Runs on the Beelink by the owner's choice. It can observe its services,
      Gateway and router, but cannot report that the Beelink itself has gone
      down; decision 0022 records the boundary.
    access: local HTTPS only; no public route
    built: 2026-09-22, from a fresh database
  actual:
    role: local-first household budget and transaction categorisation
    image: "actualbudget/actual-server:26.9.0"
    names: [actual.home]
    data: >-
      The account-password database and encrypted budget files share one 2Gi
      LVM claim. VolSync copies it to R2 hourly at minute 35; the initial
      source backup completed on 2026-09-22.
    access: local HTTPS only; no public route
    setup: Create the server password and first budget in Actual's own UI.
    built: 2026-09-22, from a fresh data directory
  sure:
    role: household finance dashboard, budgets, net worth and bank connections
    image: "ghcr.io/we-promise/sure:0.7.4"
    containers:
      - {name: postgres, image: "docker.io/library/postgres:16", role: financial records}
      - {name: redis, image: "docker.io/library/redis:8.4", role: Sidekiq queue; ephemeral}
      - {name: web, image: "ghcr.io/we-promise/sure:0.7.4", port: 3000, role: Rails UI}
      - {name: worker, image: "ghcr.io/we-promise/sure:0.7.4", role: scheduled provider sync}
    names: [sure.home]
    data: >-
      Postgres and Rails attachments share one 5Gi LVM claim, copied to R2
      hourly at minute 40. One snapshot captures both together. Infisical
      holds the database password, Rails secret and three Active Record
      encryption keys; bank-provider tokens are encrypted at rest.
    access: local HTTPS only; no public route while Plaid callback requirements are evaluated
    setup: Create the first owner account in Sure, then add a provider from its UI.
    measured: 704Mi RAM and 29m CPU at idle after initial migration, on 2026-09-22
    built: 2026-09-22, from a fresh database
  library:
    role: finds and organises what Jellyfin plays; one pod, four programs
    containers:
      - {name: prowlarr, image: "ghcr.io/linuxserver/prowlarr:2.6.5.5623-ls161", port: 9696, role: indexers}
      - {name: sonarr, image: "ghcr.io/linuxserver/sonarr:4.0.20.3014-ls325", port: 8989, role: series}
      - {name: radarr, image: "ghcr.io/linuxserver/radarr:6.4.4.10685-ls317", port: 7878, role: films}
      - {name: seerr, image: "ghcr.io/seerr-team/seerr:v3.4.1", port: 5055, role: requests}
    config: one claim data on the lvm class, a directory each, backed up hourly
    disk: >-
      /var/mnt/hdd-a whole, mounted as /data. A download lands in
      /data/torrents under its category and the library in /data/media is a
      hard link to it, so organising a release cannot break its torrent and
      costs no space. Since 2026-09-20 the old collection has only the
      library's name: its torrents were deleted once everything was
      imported, leaving /data/torrents holding the two category directories
      and whatever is still seeding.
    names: [seerr.home, prowlarr.home, sonarr.home, radarr.home]
    published: >-
      All four also answer under serhii.link since 2026-09-22. Seerr has its
      own sign-in against Jellyfin accounts; the three *arr have none, because
      AUTH__REQUIRED is DisabledForLocalAddresses and the pod only ever sees
      the Gateway's address, so Cloudflare Access is their only gate.
    one_pod: >-
      The OpenEBS LVM driver mounts a volume into one pod only, so the four
      cannot be separate Deployments sharing the configuration claim.
    profiles: >-
      Two each, English and Ukrainian, chosen when a title is added. Each
      scores its language 500 and requires 200, so the language is a
      requirement: the profile waits for a translation rather than taking
      the wrong one. Quality runs from SDTV to Bluray-1080p.
    cleanup: >-
      Both remove a completed download from qBittorrent once it has finished
      seeding, together with its file, leaving only the library's hard link.
      Deleting anything on purpose is done here, never in Jellyfin, which
      would remove the link, free nothing and have the episode fetched
      again.
    requests: >-
      Jellyseerr is the only one meant to be opened day to day: it takes a
      title, works out whether Radarr or Sonarr owns it, and asks on the
      viewer's behalf. Sign-in is a Jellyfin account, and a per-account
      override sets which quality profile that person's requests use, so
      one household asks in two languages without switching anything. The
      project renamed itself Seerr and moved to seerr-team/seerr;
      ghcr.io/fallenbagel/jellyseerr took its last release, 2.7.3, on
      2025-08-14, so its newest tag reads current and is not. The local name
      followed on 2026-09-22 and is seerr.home; only the subPath holding its
      configuration and database still reads jellyseerr, because renaming it
      would hand Seerr an empty directory. Signing in needs Jellyfin's
      EnableLegacyAuthorization: 3.4.1 asks the API with the Authorization
      header but its sign-in route still sends X-Emby-Authorization, which
      Jellyfin 12 answers with 400.
    flaresolverr: >-
      Its own pod, stateless. Passes the Cloudflare challenge for the
      indexers tagged with it, currently RuTracker and EZTV. It starts a
      Chromium per request in flight and limits nothing itself, so its
      ceiling is set by how many tagged indexers Prowlarr can search at
      once - both of them, which is what OOMKilled it at 1Gi. 2Gi since
      2026-09-20; it idles at about 110Mi.
  immich:
    role: the household's photographs - upload, search, faces
    added: 2026-09-20
    names: [immich.home]          # local only; not published
    pods:
      - {name: server, image: "ghcr.io/immich-app/immich-server:v3.2.2", port: 2283}
      - {name: machine-learning, image: "ghcr.io/immich-app/immich-machine-learning:v3.2.2-openvino", port: 3003, gpu: "gpu.intel.com/i915: 1"}
      - {name: postgres, image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0", port: 5432}
      - {name: valkey, image: "docker.io/valkey/valkey:9", port: 6379}
    four_pods: >-
      Not one: each of the three with a volume needs its own, because the
      OpenEBS LVM driver mounts a volume into a single pod. Valkey has none
      and could share, but keeping it apart costs nothing.
    database: >-
      Not a stock Postgres. Immich stores image and face embeddings as
      vectors and searches over them, which needs VectorChord; the image is
      the pair Immich pins and tests for this release. Crossing a Postgres
      major means a dump and restore, so the tag's 14 is deliberate.
    storage: >-
      Photographs in /var/mnt/hdd-a/photos, mounted as /data. Postgres on the
      lvm class as the claim `data`, so it goes to R2 hourly - the half that
      cannot be rebuilt from the originals. The model cache is its own claim
      and is never backed up.
    originals_not_backed_up: >-
      Decided on 2026-09-20: the photographs have no second copy, on one disk
      with no mirror, until the library has a size worth pricing against R2 at
      about $0.015 per GB per month. They are the only irreplaceable data in
      the house, so this is the open risk, not an oversight.
    gpu: >-
      Face detection and search run on the Intel iGPU through OpenVINO. The
      device plugin advertises three; Jellyfin holds one and this holds
      another, so they never queue for a slot - but they do share the
      silicon, and a transcode during an import slows both.
    secret: >-
      /immich/DB_PASSWORD in Infisical, read by the ExternalSecret immich-db.
      Postgres initialises its data directory once with whatever password it
      first sees, so changing it later means changing it inside the database.
  samba:
    auth: guest
    shares:
      - {name: media, path: /var/mnt/hdd-a/media}        # the library
      - {name: torrents, path: /var/mnt/hdd-a/torrents}  # what is seeding
      - {name: scan, path: /var/mnt/hdd-b/scan}
      - {name: hdd-b, path: /var/mnt/hdd-b}
    migrated: 89 document files from core on 2026-09-19
    owner: "1000:1000"         # shared with every media application
    modes: {files: "0664", directories: "0775"}
    address: 192.168.8.10 (host network), Beelink.local
    discovery: Bonjour (avahi), WS-Discovery (wsdd2) and NetBIOS (nmbd)
    pod_security: the samba namespace alone enforces privileged, for the host network
  headlamp:
    role: a console for this cluster - browse objects, read logs
    added: 2026-09-20
    names: [headlamp.home, headlamp.serhii.link]
    chart: headlamp/headlamp 0.45.0, from kubernetes-sigs
    auth: >-
      None, and with cluster-admin behind it - chosen knowingly by the
      owner on 2026-09-20. unsafeUseServiceAccountToken hands every visitor
      the service account, and that account is bound to cluster-admin, so
      opening the page is full control of the cluster.
    exposure: >-
      headlamp.serhii.link is behind Cloudflare Access. headlamp.home has
      no gate at all, so anyone on the LAN - including the television and
      anything else that joins the wifi - has that control by opening a
      page, including reading every Secret: the NordVPN keys, the
      Cloudflare tunnel credentials, the R2 backup keys and the database
      passwords. The published name is the better defended of the two.
    narrowing: >-
      clusterRoleName: view is one word and gives a console that reads
      every object and log, changes nothing, and cannot see Secrets at all.
    state: none - no claim, no database, no CRDs
    watches: >-
      Nothing. It reports no failure and sends no alert, so decision 0008
      is still open and no tool here closes it.
  node_labels: {homelab/media-hdd: "true"}
  storage:
    classes:
      - {name: lvm, provisioner: local.csi.openebs.io, volgroup: nvme, thin: yes, fsType: xfs}
    snapshot_class: lvm
    thin_pool: nvme_thinpool, 442 GB, created by the nvme-thinpool job
    note: >-
      The group and pool are made by that job, not by Talos: the Talos
      Terraform provider speaks the v1.13 contract, which has no
      LVMVolumeGroupConfig.
  backups:
    target: Cloudflare R2, bucket homelab-backups
    secrets: Infisical /backups/R2
    postgres: >-
      None running. CloudNativePG, the Barman Cloud plugin and a shared
      Postgres worked here on 2026-09-19 and were removed the same day,
      because no application needed a database yet; the setup is kept whole
      in archive/database at the repository root. Its backups stay in R2 under
      cnpg/postgres-v2, with a completed base backup, and the archived
      Cluster bootstraps from them.
    volumes: >-
      VolSync, hourly from a thin snapshot, each service on its own minute.
      Keeps 24 hourly, 7 daily, 4 weekly and 3 monthly. Each service's data
      claim restores itself from R2 on an empty cluster; which services are
      covered is in backups.yaml.
    not_backed_up: [media on the HDDs, caches]
  deferred: [strimzi, hubble-ui]
  archived: >-
    Two monitors ran here on 2026-09-20 and neither stayed: the
    VictoriaMetrics stack, then Pulse. Both are whole under
    archive/ at the repository root, with why each went written beside it.
    Paperless followed on 2026-09-22 after a fresh, empty trial; its manifests
    are under archive/paperless/ and its 20Gi volume was deliberately deleted.

config:
  talos: core-talos/01-talos/
  platform: core-talos/02-platform/
  gitops: core-talos/03-gitops/
  secret_paths:
    - core-talos/01-talos/secrets.yaml
    - core-talos/02-platform/prepare-hook/initial-secret.yaml
  note: Both secret files are local and ignored by Git.
