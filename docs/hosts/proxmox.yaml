# The hypervisor and lab: clusters get built and destroyed here, so nothing
# that must stay up lives on it.
#
# Unreachable since the router's reflash on 2026-09-28: it still expects
# 10.1.1.100 behind VLAN 10 at 10.1.1.1, which the router no longer has.
# Everything below was last verified on 2026-09-12 and waits on the choice
# between a flat LAN and a rebuilt VLAN.

meta:
  host: proxmox
  updated: 2026-09-30
  tags: [proxmox, hypervisor, lab, talos, terraform]

identity:
  hostname: proxmox
  ip: 10.1.1.100                   # VLAN 10, not routed at present
  ssh: root@10.1.1.100             # key at ~/.ssh/id_ed25519
  api_without_login: >-
    http://10.1.1.100:8008/api/* - ProxMenux Monitor answers unauthenticated,
    the quickest way to hardware and guest facts.
  deployed_from_here: no           # its Terraform lives elsewhere

os: {distribution: Proxmox VE 9.2.18, cluster: standalone}

hardware:
  cpu: {model: Intel Core i9-12900HK, cores: 14, threads: 20}
  ram_gb: 62                       # about 28 in use, 2026-09-12
  gpu: Intel Iris Xe, Quick Sync

disks:
  - model: Samsung SSD 980 PRO 2TB
    role: local-lvm (1.67 TB thin, 3% used) and /var/lib/vz (94 GB)
    health: 7% worn, no media errors, no reallocation (2026-09-12)

guests: >-
  Seven VMs on 2026-09-12, two Talos clusters: talos-controlplane-01 with
  talos-worker-01..03, and control-plane with worker01..02. Allocation exceeds
  physical memory, fine at the use seen then. No vzdump schedule: the guests
  are rebuilt from Terraform.

nics:
  - {name: enp2s0, role: vmbr0, cabled to the router's lan1}
  - {name: enp3s0, role: spare, uncabled}

risks:
  - >-
    65 of 115 power cycles were unsafe shutdowns: more than half the time it
    loses power without flushing, which threatens etcd and guest filesystems
    long before disk wear does. A UPS, or finding what cuts the power, comes
    before anything here is meant to last.
