# The hypervisor. Clusters get built and destroyed here, so nothing
# that needs to stay up lives on it.
# Verified 2026-09-06 against the live machine.

meta:
  host: proxmox
  updated: 2026-09-06
  tags: [proxmox, hypervisor, lab, talos, terraform]

identity:
  hostname: proxmox
  ip: 10.1.1.100
  vlan: 10
  role: lab
  ssh: root@10.1.1.100             # key at ~/.ssh/id_ed25519
  api_without_login: >-
    http://10.1.1.100:8008/api/* — ProxMenux Monitor answers unauthenticated,
    which is the quickest way to hardware and guest facts.

os:
  distribution: Proxmox VE 9.2.11
  cluster: standalone              # not a Proxmox cluster
  users: [root@pam]                # no API tokens issued

hardware:
  cpu: {model: Intel Core i9-12900HK, cores: 14, threads: 20, ghz_max: 5.0}
  ram_gb: 62
  ram_used_gb: 28
  gpu: Intel Iris Xe (Alder Lake-P GT2)   # QuickSync, well ahead of the NAS

disks:
  - dev: nvme0n1
    model: Samsung SSD 980 PRO 2TB
    size: 1.8T
    power_on_hours: 4688
    written_tb: 45.3                # ~232 GB a day
    rated_tbw: 1200                 # Samsung's endurance spec for this model
    wear_percent: 7                 # the controller's own estimate, which
                                    # runs ahead of 45.3/1200 because it counts
                                    # write amplification
    available_spare_percent: 100    # no reallocation has been needed at all
    media_errors: 0
    temperature_c: 53
    projected: >-
      At the current rate the rated endurance is reached in roughly seven
      years, and that figure is a warranty threshold rather than a failure
      point. Wear is not the thing to watch on this disk.
    write_sources: >-
      Seven VMs run continuously. Talos control-plane etcd fsyncs constantly,
      Terraform create/destroy cycles rewrite whole VM disks, and Proxmox
      writes its own RRD statistics without pause.

storage:
  - {name: local-lvm, type: lvmthin, size: 1.67T, used_percent: 3.3}
  - {name: local, type: dir, path: /var/lib/vz, size: 94G}

backups: none                      # no vzdump jobs configured

nics:
  - {name: enp2s0, state: up, role: vmbr0 bridge port}
  - {name: enp3s0, state: down, note: unconfigured and uncabled}

iommu: disabled                    # no intel_iommu in cmdline; PCI passthrough
                                   # would need that plus a reboot

guests:
  - {vmid: 100, name: talos-controlplane-01, ram_gb: 6}
  - {vmid: 101, name: talos-worker-02, ram_gb: 16}
  - {vmid: 102, name: talos-worker-03, ram_gb: 16}
  - {vmid: 103, name: talos-worker-01, ram_gb: 16}
  - {vmid: 111, name: control-plane, ram_gb: 4}
  - {vmid: 112, name: worker01, ram_gb: 4}
  - {vmid: 113, name: worker02, ram_gb: 4}

note_ram: >-
  Allocation exceeds physical RAM, which is fine while real use sits near
  28 GB, but there is less headroom than the total suggests.

spare_capacity:                    # what a consolidation could use
  sata_controller: "00:17.0 Alder Lake-P AHCI, free"
  nic: "enp3s0 — needs a cable before it is of any use"
  free_storage: 1.6T on local-lvm

risks:
  - >-
    Statically configured at 10.1.1.100, the first address of the VLAN 10 DHCP
    pool, with no reservation. A new guest could be leased the hypervisor's own
    address. Either reserve its MAC or start the pool at .150.
  - >-
    65 of 115 power cycles were unsafe shutdowns. More than half the time this
    machine loses power without flushing, which threatens etcd and guest
    filesystems long before disk wear becomes relevant. Worth a UPS, or finding
    out what is cutting the power.
