# The hypervisor and lab: clusters get built and destroyed here, so nothing
# that must stay up lives on it.
#
# Reinstalled on 2026-10-03 onto the flat LAN, replacing the VLAN 10 setup
# the router lost in its reflash. The procedure is in the lab repository's
# 00-prerequisite/README.md. Verified 2026-10-03.

meta:
  host: proxmox
  updated: 2026-10-03
  tags: [proxmox, hypervisor, lab, talos, terraform]

identity:
  hostname: proxmox
  ip: 192.168.8.30                 # static, set in the installer
  ui: >-
    https://proxmox.home, through core's Gateway with home-ca's certificate
    (core/03-gitops/apps/system/network/proxies); the host itself at
    https://192.168.8.30:8006, which is what to use while core is down.
  ssh: root@192.168.8.30           # key at ~/.ssh/id_ed25519
  deployed_from_here: no           # its Terraform lives elsewhere:
  built_from: >-
    github.com/serhii-myronets/terraform-talos-gitops-cluster, checked out
    at ~/Documents/GitHub/terraform-talos-gitops-homelab on its homelab
    branch, which its Argo CD follows. Its AGENTS.md points back here.

os:
  distribution: Proxmox VE 9.2.21, kernel 7.0.14-20-pve
  cluster: standalone              # pve-ha-lrm and pve-ha-crm disabled
  repositories: >-
    pve-no-subscription; enterprise and Ceph enterprise disabled; the
    subscription nag removed by the community post-pve-install script.
  cpu_governor: powersave          # cpu-powersave.service, oneshot at boot
  api_users: >-
    homepage@pve, PVEAuditor on /, with the token homepage@pve!homepage
    (privilege separation off) for Homepage's Proxmox card on core; its
    secret is in core's Infisical at /services/homepage/PROXMOX_TOKEN.
  proxmenux: >-
    ProxMenux 1.2.6, installed 2026-10-03 for its Monitor (the web app reports
    1.2.2): proxmenux-monitor.service, as root, http://192.168.8.30:8008, and
    https://proxmenux.home through core's Gateway
    (core/03-gitops/apps/system/network/proxies). Login off at install -
    nothing stops anyone on the LAN.
    It added jq, dialog and git from apt, /usr/local/share/proxmenux and
    /usr/local/bin/menu. Changes made from its menu are drift no Terraform
    knows of; note each one here.

hardware:
  cpu: {model: Intel Core i9-12900HK, cores: 14, threads: 20}
  ram_gb: 62
  gpu: Intel Iris Xe, Quick Sync

disks:
  - model: Samsung SSD 980 PRO 2TB
    role: >-
      ZFS rpool (RAID0 of the one disk, ashift 12, compression on), about
      1.6 TB; about 200 GB left unpartitioned. VM disks in local-zfs
      (rpool/data, sync=disabled - the guests are disposable).
    zfs_arc_max: 6.4 GB            # the installer's default, 10% of RAM
    health: 7% worn, no media errors (2026-10-03)

guests: >-
  The Talos cluster `lab`, built 2026-10-03: controlplane-1..3 (VMs
  140-142, .40-.42, 4 vCPU and 4 GB each) and worker-1..2 (145-146, .45-.46,
  8 vCPU and 18 GB), the API VIP at .50 - names that repeat core's node
  names, so a VM's name alone does not say which cluster. 48 GB of the 62 go to the
  guests. No vzdump schedule: the guests are rebuilt from Terraform.

nics:                              # names pinned by the installer
  - {name: nic2, pci: "0000:03:00.0", role: vmbr0, cabled to the router's lan1}
  - {name: nic0, pci: "0000:02:00.0", role: spare, uncabled}

risks:
  - >-
    69 of 123 power cycles were unsafe shutdowns: more than half the time it
    loses power without flushing, which threatens etcd and guest filesystems
    long before disk wear does. A UPS, or finding what cuts the power, comes
    before anything here is meant to last.
