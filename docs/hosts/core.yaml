# core — the cluster where the services and their data live, and what
# everything else in the house depends on. Talos, deployed from core/, on two
# nodes: controlplane on a Beelink ME Pro, described here, and worker-1 on the
# old OpenMediaVault box (hosts/worker-1.yaml).
#
# What runs - images, charts, versions, resources - is in core/03-gitops and
# only there; Renovate moves it. This file holds what the manifests cannot
# say: why, how it behaves, and where it bites.
# Verified 2026-09-30, after the rebuild.

meta:
  host: core
  updated: 2026-09-30
  tags: [core, controlplane, talos, kubernetes, bare-metal, storage, services]

identity:
  cluster: core
  node: controlplane               # fixed hostname; every OpenEBS volume is
                                   # pinned to its node by name
  model: Beelink ME Pro
  ip: 192.168.8.10                 # static in Talos, decisions/0028
  access:
    talos: talosctl -n 192.168.8.10
    kubernetes_context: core # the talos context is core too; both written by core/01-talos's apply
  rebuilt: >-
    2026-09-30, under fixed names: reset of STATE and EPHEMERAL only, a new
    bootstrap, Flux rebuilt everything and VolSync restored every service's
    claim from R2. The HDDs' user volumes survived untouched.

hardware:
  cpu: {model: Intel N95, cores: 4, threads: 4}
  ram_gb: 12                       # the constraint; see decisions/0029
  gpu: Intel UHD (Alder Lake-N), Quick Sync, shared by three pods

disks:                             # names swap between boots: select by serial
  - model: WDS500G1X0E-00AFY0
    serial: "204390442013"
    role: LVM volume group nvme, 442 GB thin pool for OpenEBS LVM LocalPV
  - model: 128GB SSD (Maxio MAP1202, no DRAM)
    serial: MQ49W66504526
    role: Talos system disk - EPHEMERAL capped at 100 GiB, 16 GiB swap behind zswap
  - model: ST10000DM0004 (2x 10 TB)
    wwid: [naa.5000c500c754eee9, naa.5000c500c7482270]
    role: >-
      Talos XFS user volumes hdd-a and hdd-b at /var/mnt/hdd-a and hdd-b,
      reached through static PVs that select the node label
      homelab/media-hdd. A reinstall reuses them; never reset with user
      disks wiped (decisions/0016).

network:
  bridge: br0 over enp3s0 (router) and enp2s0 (a desktop downlink)
  gateway: 192.168.8.1
  load_balancer: Cilium L2 announcements from the pool 192.168.8.15-19
  addresses:
    - {ip: 192.168.8.15, what: the Gateway}
    - {ip: 192.168.8.16, what: qBittorrent, ports: [8080]}
    - {ip: 192.168.8.17, what: Jellyfin, ports: [8096]}

platform:
  bootstrap: >-
    Cilium, External Secrets and the Flux Operator by Helmfile from
    core/02-platform, then the FluxInstance and core/03-gitops/flux.yaml by
    hand; everything else is Flux. See each directory's README.
  flux_ui: flux.home and flux.serhii.link, anonymous and read-only (decisions/0021)
  storage: >-
    Two StorageClasses of thin volumes, each bound to one node: lvm on
    controlplane's nvme group, lvm-worker-1 on worker-1's ssd group. A pod
    on lvm-worker-1 must tolerate worker-1's taint. Nothing crosses between
    nodes except over the network - the HDDs are controlplane's alone.
  secrets: >-
    Infisical, project homelab, environment prod, laid out as the repository
    is: /system/<component> for the cluster's own (home-ca, cloudflare,
    backups), /services/<application> for each service, /router/<thing> for
    the router, /archive for what nothing reads. Keys are UPPER_SNAKE
    outside /archive, which keeps them as they were.
    Read through one
    ClusterSecretStore, as the machine identity core: no access to the
    organization, Viewer on this project alone. It replaced talos-cluster, a
    member here, and homelab, an organization admin nothing used any more,
    both deleted on 2026-10-04. It logs in by JWT with the cluster's own
    ServiceAccount token, external-secrets/infisical, and nothing secret is
    placed by hand (decisions/0041).
    A running pod never sees a changed secret; Reloader restarts the
    Deployments annotated reloader.stakater.com/auto - Homepage, Sure,
    torrent, Immich's server, cloudflared, external-dns - within seconds of
    one changing. Verified 2026-10-02 on Homepage.
  memory: >-
    Every application pod has a memory limit, init containers included,
    except Immich's machine learning - so it is the one pod Talos's OOM
    controller kills when the node runs short (traps.yaml). Requests reserve
    most of the node; a new service has little room left on controlplane.

access:
  local: >-
    Each .home name of an HTTPRoute is published to the router's BIND by
    external-dns-bind, owner core, at the Gateway's address. HTTP
    redirects to HTTPS; the exceptions are ca.home, where a device fetches
    the root it does not trust yet, and tv.home, plain HTTP for a television
    whose trust store is not ours to write.
  certificate: >-
    One certificate lists every HTTPS .home name - a new route needs its
    name added there. It is signed by home-ca, a root that lives in
    Infisical /system/home-ca (valid to 2036-09-17, renewed by nothing) and is
    served at ca.home/root.crt.
  public: >-
    *.serhii.link through the Cloudflare tunnel beelink, locally managed from
    core/03-gitops/apps/system/network/cloudflared. external-dns publishes a
    proxied CNAME per HTTPRoute under serhii.link, as owner core.
    Cloudflare Access guards every name, including new ones.

services:
  immich:
    names: [immich.home]                     # never published
    storage: >-
      Originals on hdd-a under photos/, copied nightly to the ORICO and not
      yet outside the house (backups.yaml, photos_to_orico). Postgres on an
      lvm claim, backed up nightly; the model cache is its own claim and never
      backed up.
    database: >-
      Immich's own Postgres image with VectorChord; the major version is
      pinned on purpose, since crossing one needs a dump and restore.
    gpu: machine learning through OpenVINO, video transcoding through QSV
  jellyfin:
    names: [jellyfin.home, jellyfin.serhii.link, tv.home]
    media: >-
      hdd-a's media/ read-only as /library: Movies and TV. Deleting is Sonarr's
      and Radarr's job; SaveLocalMetadata and SaveSubtitlesWithMedia must stay
      off, or scans spend themselves on write errors.
    legacy_auth: EnableLegacyAuthorization on - Seerr still sends X-Emby-Authorization
  torrent:
    names: [torrent.home, torrent.serhii.link]
    vpn: >-
      gluetun to NordVPN over WireGuard, the Netherlands; qBittorrent binds to
      tun0. Some endpoints accept WireGuard and carry nothing, so gluetun
      hunts, and its probe allows ten minutes for that. Key in Infisical
      /services/torrent.
    downloads: >-
      hdd-a's torrents/, as /downloads and inside /data, the path the *arr
      share; incomplete downloads on a 200Gi cache claim, never backed up.
    seeding: >-
      Stops at ratio 2 or 14 days; stopping is what tells Sonarr and Radarr
      to remove the torrent with its file.
    resolver: retracker.local pinned to 127.0.0.1, since gluetun drops it
  library:
    names: [seerr.home, prowlarr.home, sonarr.home, radarr.home, and each under serhii.link]
    shape: >-
      One pod for Prowlarr, Sonarr, Radarr and Seerr, sharing one claim - the
      LVM driver mounts a volume into one pod only. FlareSolverr apart,
      stateless.
    disk: >-
      hdd-a whole as /data; the library is hard links into torrents/, so
      organising costs no space and breaks no torrent.
    profiles: English and Ukrainian, each requiring its language
    search_year: >-
      Radarr's Toloka, RuTracker and Mazepa indexers have "Remove year from
      search query" on. Those trackers are searched by title text and label a
      film by its first premiere, while Radarr searches with TMDb's year: The
      Gentlemen is 2020 to TMDb and 2019 on all three, so a search for it
      found nothing there. Radarr still matches the release by its secondary
      year. Set in Radarr, not Prowlarr; a forced Prowlarr sync keeps it.
    rutracker: >-
      Switched off since 2026-10-01, by the owner's choice, in all three
      places: Prowlarr, and RSS and both searches in Sonarr and Radarr.
      Prowlarr leaves a disabled indexer in the apps and answers them 410
      Gone, so it has to be switched off there too; turning it back on is the
      same three steps.
    gate: >-
      Seerr signs in against Jellyfin; the three *arr have no sign-in, since
      they see only the Gateway's address, so Cloudflare Access is their gate.
  sure:
    names: [sure.home, sure.serhii.link]
    providers: >-
      Plaid's Trial plan, ten Items and a slot never returned - eight are
      spent. Re-authorise a connection, never delete and re-add it.
    public: >-
      sure.serhii.link exists because Plaid redirects only to public TLS
      (decisions/0026); no Access exemption for its webhook, so updates come
      by polling.
  vaultwarden:
    names: [vault.home]                      # local only
    why_local: Cloudflare Access is not a transport Bitwarden clients can pass
  homepage:
    names: [dash.home]                       # local only
    where: >-
      worker-1, stateless: the cards are config/ in Git and the widgets' API
      keys sit in Infisical /services/homepage: Sonarr's, Radarr's,
      Prowlarr's and Seerr's copied from their own configuration, Immich's and
      Jellyfin's made in their interfaces for Homepage. qBittorrent's widget
      needs none, as its whitelist admits the pod network. The storage and
      backup cards query VictoriaMetrics directly.
  samba:
    address: 192.168.8.10, host network, Beelink.local
    auth: guest
    shares: [media, torrents, scan, hdd-b, photos (read-only)]
    owner: "1000:1000, shared with every media application"
  headlamp:
    names: [headlamp.home, headlamp.serhii.link]
    auth: >-
      None, with cluster-admin behind it - the owner's choice. headlamp.home
      has no gate at all; anyone on the LAN has full control of the cluster.
    clusters: >-
      core and the lab, as the contexts core and lab, from two kubeconfigs rather than
      in-cluster mode, since 2026-10-04 (decisions/0042): the lab as its
      admin too. Verified that day - each cluster's nodes listed with no
      token asked.

config:
  talos: core/01-talos/
  platform: core/02-platform/
  gitops: core/03-gitops/
  ignored_but_kept_elsewhere:      # local files Git ignores, each with a copy
    terraform_state: R2 homelab-backups, terraform/core-01-talos.tfstate (decisions/0037)
    talos_secrets: Infisical /system/talos/SECRETS_YAML, which Terraform reads (decisions/0041); core/01-talos/secrets.yaml is an ignored local copy
  outside_infisical: >-
    What reaches Infisical and the backups belongs in a password manager as
    well, since a locked account would close everything else: the Infisical
    and Cloudflare logins, the restic password, the router's admin password
    and the Mac's ssh key.
