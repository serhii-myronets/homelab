# core's Docker stacks. Every container below was stopped on 2026-09-19 once
# its replacement reached the Beelink; the compose files stay as a way back.
# What is actually running is in hosts/beelink.yaml.
#
# This file is rollback material. Read it when something has to be started on
# core again - not otherwise.

meta:
  updated: 2026-09-20
  tags: [core, docker, portainer, rollback, secrets]

status: every stack stopped 2026-09-19; 0 of 9 containers running, verified 2026-09-20

stacks:                     # name: compose path, how it was deployed
  homepage:    {path: core/homepage/docker-compose.yaml,    by: portainer-gitops, rpv: true}
  caddy:       {path: core/caddy/docker-compose.yaml,       by: portainer-gitops, rpv: true}
  torrent:     {path: core/torrent/docker-compose.yaml,     by: portainer-gitops, rpv: true,
                note: "vpn, qbittorrent and flood; the last two share vpn's network namespace"}
  pulse:       {path: core/pulse/docker-compose.yaml,       by: docker-compose-manual, rpv: false}
  cloudflared: {path: core/cloudflared/docker-compose.yaml, by: portainer-gitops, rpv: false}
  jellyfin:    {path: core/jellyfin/docker-compose.yaml,    by: portainer-gitops, rpv: false}
  portainer:   {path: core/portainer/docker-compose.yaml,   by: core/bootstrap.sh, rpv: false,
                edition: EE, note: "not a Portainer stack - see decisions/0001"}

portainer_stack_settings:   # Stacks -> Add stack -> Repository
  reference: refs/heads/main
  additional_paths: >-
    Leave empty. It takes further compose files to merge, not a working
    directory, so a path here makes the deploy fail on a file it cannot find.
  relative_path_volumes: >-
    Required by any stack bind-mounting a file out of this repo (rpv: true
    above), and offered only when the stack is created. An existing stack
    cannot be given it later - delete and recreate instead.
  gitops_paths: /srv/ssd/docker/gitops/<stack>; the manual one is /srv/ssd/docker/homelab/core/pulse

routes:
  status: inactive          # Caddy and core's tunnel are both stopped
  names_still_pointing_here: >-
    omv, portainer, homepage, pulse, proxmox and proxmenux under .home. The
    router sends every *.home to the Beelink since 2026-09-19, so all six
    answer 404 until they move or get a router entry of their own.
  former_targets: >-
    omv and proxmox went to their own web interfaces, proxmenux to
    10.1.1.100:8008, the rest to the container of the same name. The same set
    was published under serhii.link through core's tunnel, each behind
    Cloudflare Access, with a catch-all 404 for anything else.

secrets:
  location: /srv/ssd/docker/secrets     # on core, never in git
  files:
    - {path: portainer/license.env, holds: PORTAINER_LICENSE_KEY}
    - {path: cloudflared/auth.env, holds: Cloudflare tunnel token}
    - {path: pulse/credentials, holds: Pulse admin password and API token}
    - {path: pulse/proxmox-api.json, holds: Proxmox PVE API token secret}
    - {path: nordvpn/user, holds: OpenVPN username}
    - {path: nordvpn/pass, holds: OpenVPN password}
  unused: >-
    nordvpn/token (wireguard mode, unused), cloudflared/credentials.json and
    cloudflared/tunnel_token.txt (both superseded by auth.env). The whole
    nordvpn directory is bind-mounted into gluetun, so anything left in it is
    visible to that container whether referenced or not.

pulse:
  server: stopped with the rest
  agents: >-
    tools/pulse-agent/install.sh put pulse-agent.service on core and proxmox,
    and core's is still enabled - it logs connection refused against the
    stopped server every few seconds. Stopping it is an open cleanup item.
  proxmox_api: "pulse@pve!monitor, role PVEAuditor, against https://10.1.1.100:8006"
