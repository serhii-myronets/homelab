# What runs, where it is deployed from, and every hostname that reaches it.
# Verified 2026-09-07.

meta:
  updated: 2026-09-07
  tags: [stacks, docker, portainer, caddy, routes, secrets]

portainer_stack_settings:      # Stacks -> Add stack -> Repository
  reference: refs/heads/main
  additional_paths: empty          # it takes compose files — see traps.yaml
  relative_path_volumes: >-
    Required by any stack bind-mounting a file out of this repo, and offered
    only at creation time. See traps.yaml.

stacks:
  - name: homepage
    host: core
    deployed_by: portainer-gitops
    compose_path: core/homepage/docker-compose.yaml
    relative_path_volumes: true
    filesystem_path: /srv/ssd/docker/gitops/homepage
    role: home dashboard
    note: Config is in git; logs are ephemeral. No API credentials or Docker socket.
  - name: caddy
    host: core
    deployed_by: portainer-gitops
    compose_path: core/caddy/docker-compose.yaml
    relative_path_volumes: true
    filesystem_path: /srv/ssd/docker/gitops/caddy
    role: reverse proxy, internal TLS
  - name: torrent
    host: core
    deployed_by: portainer-gitops
    compose_path: core/torrent/docker-compose.yaml
    relative_path_volumes: true
    filesystem_path: /srv/ssd/docker/gitops/torrent
    services: [vpn, qbittorrent, flood]
    note: qbittorrent and flood share vpn's network namespace
  - name: cloudflared
    host: core
    deployed_by: portainer-gitops
    compose_path: core/cloudflared/docker-compose.yaml
    relative_path_volumes: false
  - name: jellyfin
    host: core
    deployed_by: portainer-gitops
    compose_path: core/jellyfin/docker-compose.yaml
    relative_path_volumes: false
  - name: portainer
    host: core
    deployed_by: core/bootstrap.sh       # see decisions/0001
    compose_path: core/portainer/docker-compose.yaml
    edition: EE
    note: >-
      Not a Portainer stack. Deploy with ./core/bootstrap.sh or
      docker compose -f core/portainer/docker-compose.yaml up -d

routes:
  internal:                         # all via Caddy, TLS from its own CA.
                                    # *.home resolves to the NAS by wildcard,
                                    # so a new name needs no DNS work; trust
                                    # the root certificate from ca.home.
    - {host: omv.home, target: "host.docker.internal:81"}
    - {host: jellyfin.home, target: "jellyfin:8096"}
    - {host: torrent.home, target: "vpn:3000", ui: flood}
    - {host: qbittorrent.home, target: "vpn:8080", ui: qBittorrent's own}
    - {host: proxmenux.home, target: "10.1.1.100:8008"}
    - {host: proxmox.home, target: "https://10.1.1.100:8006", tls_skip_verify: true}
    - {host: portainer.home, target: "portainer:9000"}
    - {host: homepage.home, target: "homepage:3000"}
    - {host: ca.home, target: Caddy's internal root certificate}
  external:                         # via Cloudflare Tunnel, each behind
                                    # Cloudflare Access. Read from the running
                                    # connector's configuration update log on
                                    # 2026-09-07; the dashboard is the source.
    - {host: jellyfin.serhii.link, target: "jellyfin:8096"}
    - {host: omv.serhii.link, target: "host.docker.internal:81"}
    - {host: torrent.serhii.link, target: "vpn:3000", ui: flood}
    - {host: qbittorrent.serhii.link, target: "vpn:8080", ui: qBittorrent's own}
    - {host: portainer.serhii.link, target: "portainer:9000"}
    - {host: proxmox.serhii.link, target: "https://10.1.1.100:8006"}
    - {host: proxmenux.serhii.link, target: "10.1.1.100:8008"}
    - {host: homepage.serhii.link, target: "homepage:3000"}
                                    # anything else the tunnel is asked for
                                    # gets 404 from its catch-all rule.

secrets:
  location: /srv/ssd/docker/secrets
  in_git: false
  files:
    - {path: portainer/license.env, holds: PORTAINER_LICENSE_KEY, used_by: portainer}
    - {path: cloudflared/auth.env, holds: Cloudflare tunnel token, used_by: cloudflared}
    - {path: nordvpn/user, holds: OpenVPN username, used_by: vpn}
    - {path: nordvpn/pass, holds: OpenVPN password, used_by: vpn}
  unused:                           # present on disk, referenced by nothing
    - {path: nordvpn/token, note: for gluetun's wireguard mode; VPN_TYPE is openvpn}
    - {path: cloudflared/credentials.json, note: superseded by --token-file}
    - {path: cloudflared/tunnel_token.txt, note: superseded by auth.env}
  note: >-
    The whole nordvpn/ directory is bind-mounted into gluetun, so anything left
    in it is visible to that container whether it is referenced or not.

kubernetes:
  context: admin@homelab
  verified: 2026-09-06
  managed_by: argocd
  tunnel:
    namespace: cloudflared
    configmap: cloudflared
    name: wildcard-tunnel
    hostname: "*.serhii.link"
    target: http://cilium-gateway-main-gateway.gateway-system.svc.cluster.local:80
  gateway:
    namespace: gateway-system
    name: main-gateway
    class: cilium
    address: 10.1.1.80
    listener: HTTP:80
  routes:
    - {host: argocd.serhii.link, namespace: argocd, target: "argocd-server:80"}
    - {host: argocd.home, namespace: argocd, target: "argocd-server:80"}
    - {host: minio.serhii.link, namespace: minio, target: "minio-console:9001"}
    - {host: minio.home, namespace: minio, target: "minio-console:9001"}
    - {host: grafana.serhii.link, namespace: observability, target: "grafana:80"}
    - {host: grafana.home, namespace: observability, target: "grafana:80"}
    - {host: vm-agent.serhii.link, namespace: observability, target: "vmagent-main-agent:8429"}
    - {host: vm-agent.home, namespace: observability, target: "vmagent-main-agent:8429"}
    - {host: vm-server.serhii.link, namespace: observability, target: "victoria-metrics-server:8428"}
    - {host: vm-server.home, namespace: observability, target: "victoria-metrics-server:8428"}
  verification: >-
    Gateway Programmed=True; all five HTTPRoutes Accepted=True and ResolvedRefs=True.
    All five public HTTPS URLs returned 302 to Cloudflare Access login.
    This confirms the authentication boundary, not backend application health.

  local_grafana:
    caddy_route: grafana.home
    upstream: http://10.1.1.80:80
    status: verified
    verification: >-
      The Gateway VIP returns HTTP 200 from core and Proxmox. After restarting
      Caddy to pick up its updated bind-mounted file, https://grafana.home
      returns HTTP 200 from core with certificate validation against the local
      Caddy CA. Homepage's configured primary link now uses the local hostname.

  additional_local_routes:
    hosts: [argocd.home, minio.home, vm-agent.home, vm-server.home]
    status: verified
    verification: Each hostname returns HTTP 200 from core through the Gateway VIP.
    authentication: Local routes bypass Cloudflare Access and rely on backend authentication.

homepage_publication:
  status: published
  hostname: homepage.serhii.link
  tunnel_origin: http://homepage:3000
  allowed_hosts: [homepage.home, serhii.link, homepage.serhii.link]
  tabs: [Local, Public]
  verified: 2026-09-07
  verification: >-
    homepage.serhii.link redirects to the Cloudflare Access login, so the
    tunnel route exists and the dashboard is behind authentication.
    homepage.home returns HTTP 200 from core with the certificate validated
    against the local CA.
  apex: >-
    serhii.link itself has no DNS record and is not a route. It stays in
    HOMEPAGE_ALLOWED_HOSTS as an unused leftover; publishing the apex would
    need both a tunnel hostname and a DNS record.
  note: Tabs select links, not access permissions; both sets are available to any dashboard visitor.

kubernetes_wildcard:
  hostname: "*.home"
  upstream: http://10.1.1.80:80
  status: verified
  tls: On-demand individual certificates from the internal CA; exact core sites force their own certificates.
  verification: >-
    A temporary Caddy on core served grafana.home and argocd.home with HTTP
    200 and validated TLS. Exact jellyfin.home returned 302 and portainer.home
    returned 200 with validated TLS, confirming their routes take precedence.

host_metrics:                     # what the Homepage graphs read from
  tool: Glances 4.5.6, API version 4
  installed_by: tools/glances/install.sh     # not a stack, and not under core/
  unit: glances-homepage.service
  runs_as: nobody, from a virtualenv at /opt/glances-homepage
  endpoints:
    - {host: core, url: "http://192.168.8.100:61208"}
    - {host: proxmox, url: "http://10.1.1.100:61208"}
  reachable_from: >-
    the LAN only. Each process binds its own host address, and there is no
    Caddy site and no tunnel hostname for port 61208.
  processes: not collected — the unit passes --disable-process
  metrics: CPU, memory, one filesystem and the "Package id 0" temperature, per host
  filesystem:
    core: /srv/dev-disk-by-uuid-925787e7-dba0-451f-b9bf-c5afbd0ebc85   # the data disk
    proxmox: /                     # the root LV, not the LVM-thin guest storage
  read_by: >-
    Homepage's service widgets, which query both endpoints from the server
    and render a Core and a Proxmox graph group at the end of every tab. The
    numbers are therefore visible to anyone who opens the dashboard, public
    hostname included. Graphs accumulate samples while the page is open;
    nothing stores history.
  verified: 2026-09-07
  verification: >-
    Both units active and enabled, each listening on its own LAN address and
    nothing else. cpu, mem, fs and sensors returned 200 on both hosts, and the
    live API confirms both mount points above and the "Package id 0" label.
